<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>النوم بالأرقام</title>
<style>
/*@FONTS@*/
html,body{margin:0;background:#0B0B10;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#0B0B10;transform-origin:0 0}
.layer{position:absolute;inset:0}
.abs{position:absolute;white-space:nowrap}
.c{left:0;right:0;text-align:center}
.kufi{font-family:"Kufam",sans-serif}
.kufi{padding:40px 0}
.mono{font-family:"Mono",monospace;direction:ltr}
#hud{position:absolute;inset:0;pointer-events:none;color:#fff;opacity:.5;font-size:24px}
#hud .br{position:absolute;width:56px;height:56px;border-color:#fff;border-style:solid;opacity:.8}
#grain,#vig{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%)}
canvas{position:absolute;left:0;top:0}
#ui{position:fixed;left:8px;bottom:8px;z-index:9;font:14px sans-serif;color:#fff;direction:ltr}
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <svg id="art" class="layer" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="txt" class="layer"></div>
  <div id="vig"></div>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="hud">
    <div class="br" style="left:48px;top:150px;border-width:3px 0 0 3px"></div>
    <div class="br" style="right:48px;top:150px;border-width:3px 3px 0 0"></div>
    <div class="br" style="left:48px;bottom:330px;border-width:0 0 3px 3px"></div>
    <div class="br" style="right:48px;bottom:330px;border-width:0 3px 3px 0"></div>
    <div id="hudScene" class="abs mono" style="right:120px;top:166px"></div>
    <div id="hudCat" class="abs mono" style="left:120px;bottom:346px"></div>
    <div id="hudTc" class="abs mono" style="right:120px;bottom:346px"></div>
  </div>
</div>
<div id="ui"></div>
<script>/*@SFX@*/</script>
<script>
/* Beat sheet — «النوم بالأرقام», 120 BPM (beat = 0.5 s), 33 s, 9:16, brain24h grammar in light Egyptian Arabic.
   Facts checked (WebSearch) — sources in the description.
 0.00  a crescent moon draws itself, stars blink, «z» floats up                    | soft chimes
 1.75  moonlight floods the screen indigo                                          | impact 2.0
 2.00  title «كل ليلة…» «النوم» «بالأرقام» (mask wipe)                             | kick+clap start
 4.25  dark disc grows from the centre                                             | whoosh 4.5
 4.50  NEED: clock ring fills to 7, count 0→7 «ساعات على الأقل»                   | ticks on beats
 8.75  cream bar wipes up                                                          | whoosh 9.0
 9.00  THIRD: a day ring splits in three, one third goes indigo, 0→33 % «من وقتك» | swells
12.75  the third collapses into a dot that becomes the start of a sleep wave        | whoosh 13.0
13.00  CYCLES (lavender on indigo): hypnogram draws 5 cycles, 0→90 «دقيقة الدورة» | sub sweeps
16.75  blackout                                                                    | impact 17.0
17.00  AWAKE (alarm red): battery drains, alarm shakes, 0→17 «ساعة صاحي», slam «مخك بيهنّج!» | alarm, impact 19.5
21.50  DREAMS (navy): moon + dream bubbles, 0→120 «دقيقة أحلام»                   | bells
25.50  RECORD (dark): calendar flips 11 days, 0→264 «ساعة من غير نوم»             | page flips
29.50  END (cream): «وكل ده…» «وإنت نايم!» + follow + sources note                | riser, ring-out
*/
const VIDEO = { w: 1080, h: 1920, duration: 33 };
window.VIDEO = VIDEO;
const BEAT = 0.5;
const INK = "#0B0B14", IND = "#3A2A9E", CREAM = "#F2E8D0", LAV = "#B9A8FF", ALARM = "#D8343F", NAVY = "#0E1638", MOON = "#F6EBC8", WHITE = "#FFFFFF", YEL = "#FFD23F";

function spring(t, w = 14, z = 0.82) { if (t <= 0) return 0; if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t); const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 4);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const fmt = n => Math.round(n).toLocaleString("en-US");
const pulse = (t, period, w = 18) => { const k = ((t % period) + period) % period; return Math.exp(-w * k); };

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const bg = $("bg"), art = $("art"), txt = $("txt"), fx = $("fx").getContext("2d");
function el(tag, cls, html, parent = txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; }
function svg(tag, attrs, parent = art) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }

const T = {};
T.kick = el("div", "abs c kufi"); T.big = el("div", "abs c kufi"); T.sub = el("div", "abs c kufi");
T.label = el("div", "abs c kufi"); T.num = el("div", "abs c kufi"); T.unit = el("div", "abs c kufi");
T.extra = el("div", "abs c kufi"); T.note = el("div", "abs c kufi"); T.label2 = el("div", "abs mono");
for (const k in T) Object.assign(T[k].style, { opacity: 0 });

// ---------- S1: crescent moon + stars ----------
const moonArc = svg("path", { d: "M600,770 A190,190 0 1 0 600,1150 A150,150 0 1 1 600,770", fill: "none", stroke: MOON, "stroke-width": 12, "stroke-linecap": "round", "stroke-linejoin": "round" });
const moonLen = 1400;
moonArc.setAttribute("stroke-dasharray", moonLen); moonArc.setAttribute("stroke-dashoffset", moonLen);
const moonFill = svg("path", { d: "M600,770 A190,190 0 1 0 600,1150 A150,150 0 1 1 600,770 Z", fill: MOON, opacity: 0 });
const s1stars = (() => { const r = rng(31), a = []; for (let i = 0; i < 16; i++) a.push({ e: svg("circle", { cx: 140 + r() * 800, cy: 420 + r() * 1100, r: 3 + r() * 4, fill: WHITE, opacity: 0 }), ph: r() }); return a; })();
const flood = svg("circle", { cx: 520, cy: 960, r: 0, fill: IND });
const disc = svg("circle", { cx: 540, cy: 960, r: 0, fill: INK });

// ---------- S3: clock ring ----------
const clockG = svg("g", { opacity: 0 });
svg("circle", { cx: 540, cy: 700, r: 250, fill: "none", stroke: WHITE, "stroke-opacity": .15, "stroke-width": 34 }, clockG);
const clockArc = svg("path", { d: "", fill: "none", stroke: LAV, "stroke-width": 34, "stroke-linecap": "round" }, clockG);
const clockTicks = Array.from({ length: 12 }, (_, i) => { const a = i / 12 * Math.PI * 2 - Math.PI / 2; return svg("line", { x1: 540 + Math.cos(a) * 196, y1: 700 + Math.sin(a) * 196, x2: 540 + Math.cos(a) * 216, y2: 700 + Math.sin(a) * 216, stroke: WHITE, "stroke-opacity": .5, "stroke-width": 6, "stroke-linecap": "round" }, clockG); });
const clockHand = svg("line", { x1: 540, y1: 700, x2: 540, y2: 540, stroke: WHITE, "stroke-width": 12, "stroke-linecap": "round" }, clockG);
svg("circle", { cx: 540, cy: 700, r: 18, fill: WHITE }, clockG);

// ---------- S4: day ring split in three (canvas) ----------
// ---------- S5: hypnogram (canvas) ----------
const blackout = svg("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: INK, opacity: 0 });

// ---------- S6: battery + alarm clock ----------
const batG = svg("g", { opacity: 0 });
svg("rect", { x: 330, y: 420, width: 420, height: 560, rx: 56, fill: "none", stroke: WHITE, "stroke-width": 22 }, batG);
svg("rect", { x: 465, y: 372, width: 150, height: 52, rx: 16, fill: WHITE }, batG);
const batFill = svg("rect", { x: 358, y: 450, width: 364, height: 500, rx: 34, fill: "#2BD576" }, batG);
const alarmG = svg("g", { opacity: 0 });
svg("circle", { cx: 0, cy: 0, r: 70, fill: WHITE }, alarmG);
svg("circle", { cx: 0, cy: 0, r: 56, fill: ALARM }, alarmG);
svg("line", { x1: 0, y1: 0, x2: 0, y2: -36, stroke: WHITE, "stroke-width": 8, "stroke-linecap": "round" }, alarmG);
svg("line", { x1: 0, y1: 0, x2: 26, y2: 10, stroke: WHITE, "stroke-width": 8, "stroke-linecap": "round" }, alarmG);
svg("circle", { cx: -52, cy: -60, r: 22, fill: WHITE }, alarmG); svg("circle", { cx: 52, cy: -60, r: 22, fill: WHITE }, alarmG);

// ---------- S7: night + dream bubbles ----------
const nightG = svg("g", { opacity: 0 });
const nstars = (() => { const r = rng(17), a = []; for (let i = 0; i < 60; i++) a.push(svg("circle", { cx: r() * 1080, cy: 160 + r() * 1100, r: 1.5 + r() * 3, fill: WHITE }, nightG)); return a; })();
const moon2 = svg("g", {}, nightG); svg("circle", { cx: 0, cy: 0, r: 120, fill: MOON }, moon2); svg("circle", { cx: 54, cy: -38, r: 104, fill: NAVY }, moon2);
const bubbles = [0, 1, 2].map(i => svg("g", { opacity: 0 }, nightG));
bubbles.forEach((b, i) => { svg("ellipse", { cx: 0, cy: 0, rx: 110, ry: 70, fill: LAV, opacity: .9 }, b); svg("circle", { cx: -70, cy: 80, r: 18, fill: LAV, opacity: .9 }, b); svg("circle", { cx: -95, cy: 115, r: 10, fill: LAV, opacity: .9 }, b); const ic = svg("text", { x: 0, y: 22, "text-anchor": "middle", "font-family": "Mono", "font-size": 64, fill: NAVY }, b); ic.textContent = ["★", "♪", "?"][i]; });

// ---------- S8: calendar ----------
const calG = svg("g", { opacity: 0 });
svg("rect", { x: 330, y: 420, width: 420, height: 480, rx: 30, fill: WHITE }, calG);
svg("rect", { x: 330, y: 420, width: 420, height: 120, rx: 30, fill: ALARM }, calG);
svg("rect", { x: 330, y: 500, width: 420, height: 40, fill: ALARM }, calG);
[420, 660].forEach(x => svg("rect", { x, y: 390, width: 26, height: 70, rx: 13, fill: "#55556A" }, calG));
const calNum = svg("text", { x: 540, y: 800, "text-anchor": "middle", "font-family": "Kufi", "font-weight": 700, "font-size": 230, fill: INK }, calG);
const calHead = svg("text", { x: 540, y: 500, "text-anchor": "middle", "font-family": "Kufi", "font-weight": 700, "font-size": 48, fill: WHITE }, calG);
calHead.textContent = "يوم";
const calPage = svg("rect", { x: 330, y: 540, width: 420, height: 360, fill: "#E6E0F2", opacity: 0 }, calG);

const rule = svg("line", { x1: 540, x2: 540, y1: 1060, y2: 1060, stroke: INK, "stroke-width": 4 });

// ---------- grain ----------
const grainTiles = (() => { const r = rng(3), tiles = []; for (let n = 0; n < 4; n++) { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"), im = g.createImageData(256, 256); for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 14; } g.putImageData(im, 0, 0); tiles.push(c); } return tiles; })();
const gctx = $("grain").getContext("2d");

// ---------- helpers ----------
function show(node, text, style, a) { if (text != null && node._t !== text) { node.textContent = text; node._t = text; } Object.assign(node.style, style); node.style.opacity = a; }
function slamIn(t, t0) { const k = spring(t - t0, 16, .62); return { s: lerp(1.35, 1, k), a: clamp((t - t0) / .12), y: (1 - k) * 40 }; }
function maskRTL(node, t, t0, d) { const k = ease(seg(t, t0, t0 + d)); node.style.clipPath = `inset(0 0 0 ${(1 - k) * 100}%)`; }
function countBlock(t, t0, t1, to, label, unit, color, labelColor, numSize = 176, suffix = "") {
  const inA = clamp((t - t0) / .25), outA = 1 - clamp((t - (t1 - .35)) / .3), a = Math.min(inA, outA);
  const k = easeOut(seg(t, t0 + .25, t0 + 2.6)), landed = t > t0 + 2.6;
  const blur = landed ? 0 : (1 - k) * 6 * (k > 0 ? 1 : 0);
  const pop = landed ? 1 + 0.08 * Math.exp(-10 * (t - t0 - 2.6)) * Math.cos(28 * (t - t0 - 2.6)) : 1;
  const l = slamIn(t, t0 + .05);
  show(T.label, label, { top: "1060px", fontSize: "62px", fontWeight: 700, color: labelColor, transform: `translateY(${l.y}px)` }, a);
  show(T.num, fmt(lerp(0, to, k)) + suffix, { top: "1130px", fontSize: numSize + "px", fontWeight: 700, color, letterSpacing: "2px", filter: blur > .3 ? `blur(${blur.toFixed(1)}px)` : "none", transform: `scale(${pop})`, direction: "ltr" }, a);
  const u = slamIn(t, t0 + 2.6);
  show(T.unit, unit, { top: "1380px", fontSize: "64px", fontWeight: 700, color: labelColor, transform: `translateY(${u.y}px) scale(${u.s})` }, Math.min(a, u.a));
  return { a, k };
}
function hide(...n) { for (const x of n) x.style.opacity = 0; }
const SCENES = [[0, "01", "MOON"], [2, "02", "TITLE"], [4.5, "03", "NEED"], [9, "04", "THIRD"], [13, "05", "CYCLES"], [17, "06", "AWAKE"], [21.5, "07", "DREAMS"], [25.5, "08", "RECORD"], [29.5, "09", "END"]];
const arcPath = (cx, cy, r, a0, a1) => { const p = []; for (let i = 0; i <= 60; i++) { const a = lerp(a0, a1, i / 60); p.push(`${(cx + Math.cos(a) * r).toFixed(1)},${(cy + Math.sin(a) * r).toFixed(1)}`); } return "M" + p.join(" L"); };
// hypnogram: depth (0 awake … 3 deep) per cycle, 5 cycles across the frame
const hyp = (() => { const pts = [], depths = [0, 1, 2, 3, 3, 2, 1, -1]; for (let c = 0; c < 5; c++) depths.forEach((d, i) => pts.push([c + i / depths.length, c > 2 && d === 3 ? 2 : d])); pts.push([5, 0]); return pts; })();

// ---------- seek ----------
function seek(t) {
  t = clamp(t, 0, VIDEO.duration - 1e-6);
  const sc = [...SCENES].reverse().find(s => t >= s[0]);
  $("hudScene").textContent = `SCENE ${sc[1]} / 09`;
  $("hudCat").textContent = `SLEEP / 24H — ${sc[2]}`;
  const fr = Math.floor(t * 30) % 30, ss = Math.floor(t);
  $("hudTc").innerHTML = `<span style="color:${LAV}">●</span> 00:00:${String(ss).padStart(2, "0")}:${String(fr).padStart(2, "0")}`;
  $("hud").style.color = (t >= 9 && t < 13) || t >= 29.5 ? INK : WHITE;
  hide(...Object.values(T));
  for (const k in T) { T[k].style.filter = "none"; T[k].style.clipPath = "none"; T[k].style.transform = "none"; T[k].style.textShadow = "none"; }

  let base = INK;
  if (t >= 2 && t < 4.5) base = IND;
  if (t >= 9 && t < 13) base = CREAM;
  if (t >= 13 && t < 17) base = IND;
  if (t >= 17 && t < 21.5) base = ALARM;
  if (t >= 21.5 && t < 25.5) base = NAVY;
  if (t >= 29.5) base = CREAM;
  bg.style.background = base;
  fx.clearRect(0, 0, 1080, 1920);

  // ---- S1 moon (0–2)
  if (t < 2) {
    const dk = easeOut(seg(t, .1, 1.1));
    moonArc.setAttribute("stroke-dashoffset", (moonLen * (1 - dk)).toFixed(1)); moonArc.setAttribute("opacity", 1);
    moonFill.setAttribute("opacity", (ease(seg(t, 1.0, 1.4)) * .95).toFixed(3));
    s1stars.forEach(s => s.e.setAttribute("opacity", t > .3 + s.ph * .8 ? (.4 + .6 * Math.abs(Math.sin(t * 4 + s.ph * 9))).toFixed(2) : 0));
    const fl = ease(seg(t, 1.72, 2.0));
    flood.setAttribute("r", (1300 * fl).toFixed(1));
    show(T.label2, "SLEEP / 24H", { top: "1250px", left: "60px", fontSize: "28px", color: WHITE }, clamp((t - 1.2) / .2) * (1 - fl));
  } else { moonArc.setAttribute("opacity", 0); moonFill.setAttribute("opacity", 0); s1stars.forEach(s => s.e.setAttribute("opacity", 0)); flood.setAttribute("r", 0); }

  // ---- S2 title (2–4.5)
  if (t >= 2 && t < 4.75) {
    const out = seg(t, 4.2, 4.5);
    const k1 = slamIn(t, 2.05);
    show(T.kick, "كل ليلة…", { top: "620px", fontSize: "62px", fontWeight: 700, color: CREAM, transform: `translateY(${k1.y}px)` }, k1.a * (1 - out));
    const b = slamIn(t, 2.5);
    show(T.big, "النوم", { top: "640px", fontSize: "280px", fontWeight: 700, color: WHITE, transform: `scale(${b.s})`, lineHeight: "1.5" }, b.a * (1 - out));
    maskRTL(T.big, t, 2.5, .45);
    const s = slamIn(t, 3.0);
    show(T.sub, "بالأرقام", { top: "1180px", fontSize: "88px", fontWeight: 700, color: LAV, transform: `translateY(${s.y}px)` }, s.a * (1 - out));
    maskRTL(T.sub, t, 3.0, .4);
    disc.setAttribute("r", (1200 * ease(seg(t, 4.15, 4.5))).toFixed(1));
  } else disc.setAttribute("r", 0);

  // ---- S3 need (4.5–9)
  if (t >= 4.5 && t < 9.05) {
    const a = clamp((t - 4.5) / .3) * (1 - seg(t, 8.6, 8.9));
    const k = easeOut(seg(t, 4.85, 7.1)), hrs = 7 * k;
    clockG.setAttribute("opacity", a); clockG.setAttribute("transform", `translate(540 700) scale(${spring(t - 4.55, 12, .65).toFixed(3)}) translate(-540 -700)`);
    clockArc.setAttribute("d", k > 0 ? arcPath(540, 700, 250, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * hrs / 12) : "M0,0");
    const ang = -Math.PI / 2 + Math.PI * 2 * hrs / 12;
    clockHand.setAttribute("x2", 540 + Math.cos(ang) * 160); clockHand.setAttribute("y2", 700 + Math.sin(ang) * 160);
    countBlock(t, 4.6, 9, 7, "جسمك محتاج على الأقل", "ساعات نوم كل ليلة", WHITE, CREAM);
    show(T.note, "حسب أطباء النوم", { top: "985px", fontSize: "36px", color: LAV }, clamp((t - 7.3) / .3) * .85 * (1 - seg(t, 8.6, 8.9)));
  } else clockG.setAttribute("opacity", 0);
  if (t >= 8.7 && t < 9.1) { const w = ease(seg(t, 8.7, 9.0)); fx.fillStyle = CREAM; fx.fillRect(0, 1920 - 1920 * w, 1080, 1920 * w); }

  // ---- S4 a third (9–13): ring split in three, one third indigo, collapses to a dot
  if (t >= 9 && t < 13.05) {
    const k = easeOut(seg(t, 9.35, 11.6)), col = ease(seg(t, 12.5, 12.95)), R = lerp(250, 14, col), cx = lerp(540, 120, col), cy = lerp(700, 1000, col);
    fx.lineWidth = lerp(70, 10, col);
    fx.strokeStyle = "rgba(11,11,20,.12)"; fx.beginPath(); fx.arc(cx, cy, R, 0, Math.PI * 2); fx.stroke();
    fx.strokeStyle = IND; fx.beginPath(); fx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 / 3 * k); fx.stroke();
    if (col < .5) { fx.strokeStyle = INK; fx.lineWidth = 6; for (let i = 0; i < 3; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 3; fx.beginPath(); fx.moveTo(cx + Math.cos(a) * (R - 46), cy + Math.sin(a) * (R - 46)); fx.lineTo(cx + Math.cos(a) * (R + 46), cy + Math.sin(a) * (R + 46)); fx.stroke(); } }
    if (col < .3) { fx.fillStyle = IND; fx.font = "700 64px Kufi"; fx.textAlign = "center"; fx.fillText("نوم", cx + 120, cy - 30); fx.fillStyle = "rgba(11,11,20,.45)"; fx.fillText("صحيان", cx - 60, cy + 120); }
    countBlock(t, 9.1, 13, 33, "إنت بتقضي حوالي", "من وقتك نايم!", INK, INK, 176, "%");
    show(T.note, "يعني تلت حياتك تقريبًا", { top: "985px", fontSize: "38px", color: IND }, clamp((t - 11.8) / .3) * (1 - seg(t, 12.6, 12.9)));
  }

  // ---- S5 cycles (13–17): hypnogram
  if (t >= 13 && t < 17.05) {
    const a = clamp((t - 13) / .2), k = easeOut(seg(t, 13.1, 15.6)), x0 = 80, x1 = 1000, y0 = 440, dy = 110;
    const X = u => lerp(x0, x1, u / 5), Yv = d => y0 + (d < 0 ? -.4 : d) * dy;
    fx.globalAlpha = a; fx.strokeStyle = "rgba(255,255,255,.15)"; fx.lineWidth = 2;
    for (let d = 0; d <= 3; d++) { fx.beginPath(); fx.moveTo(x0, Yv(d)); fx.lineTo(x1, Yv(d)); fx.stroke(); }
    fx.strokeStyle = LAV; fx.lineWidth = 12; fx.lineJoin = "round"; fx.lineCap = "round"; fx.beginPath();
    let last = null;
    for (let i = 0; i < hyp.length; i++) { const [u, d] = hyp[i]; if (u / 5 > k) break; const p = [X(u), Yv(d)]; i ? fx.lineTo(...p) : fx.moveTo(...p); last = p; }
    fx.stroke();
    if (last) { fx.fillStyle = WHITE; fx.beginPath(); fx.arc(last[0], last[1], 16, 0, Math.PI * 2); fx.fill(); }
    for (let c = 1; c <= 5; c++) if (k >= c / 5 - .01) { fx.fillStyle = YEL; fx.font = "700 40px Mono"; fx.textAlign = "center"; fx.fillText(String(c), X(c - .5), y0 + 3 * dy + 90); }
    fx.globalAlpha = 1;
