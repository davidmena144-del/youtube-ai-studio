<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>المحيط بالأرقام</title>
<style>
/*@FONTS@*/
html,body{margin:0;background:#06121F;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#06121F;transform-origin:0 0}
.layer{position:absolute;inset:0}
.abs{position:absolute;white-space:nowrap}
.c{left:0;right:0;text-align:center}
.kufi{font-family:"Kufi",sans-serif}
.kufi{padding:40px 0}
.mono{font-family:"Mono",monospace;direction:ltr}
#hud{position:absolute;inset:0;pointer-events:none;color:#fff;opacity:.5;font-size:24px}
#hud .br{position:absolute;width:56px;height:56px;border-color:#fff;border-style:solid;opacity:.8}
#grain,#vig{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%)}
canvas{position:absolute;left:0;top:0}
#ui{position:fixed;left:8px;bottom:8px;z-index:9;font:14px sans-serif;color:#fff;direction:ltr}
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <svg id="art" class="layer" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="txt" class="layer"></div>
  <div id="vig"></div>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="hud">
    <div class="br" style="left:48px;top:150px;border-width:3px 0 0 3px"></div>
    <div class="br" style="right:48px;top:150px;border-width:3px 3px 0 0"></div>
    <div class="br" style="left:48px;bottom:330px;border-width:0 0 3px 3px"></div>
    <div class="br" style="right:48px;bottom:330px;border-width:0 3px 3px 0"></div>
    <div id="hudScene" class="abs mono" style="right:120px;top:166px"></div>
    <div id="hudCat" class="abs mono" style="left:120px;bottom:346px"></div>
    <div id="hudTc" class="abs mono" style="right:120px;bottom:346px"></div>
  </div>
</div>
<div id="ui"></div>
<script>
/* Beat sheet — 120 BPM (beat = 0.5 s), 33 s, 9:16. Same grammar as «جسمك في 24 ساعة» / «دماغك في 24 ساعة»:
   one idea, a big number counting up per scene, every scene morphs into the next. Facts checked (WebSearch,
   NOAA first) — sources in the description.
 0.00  a single drop falls onto black water → splash, ripple rings (OCEAN / DATA)     | drip, ripple
 1.75  the water level floods up the frame (teal)                                     | riser → impact 2.0
 2.00  title slam «المحيط» + «بالأرقام», kicker «كوكبنا أزرق…»                       | kick+clap start
 4.15  a deep-blue wave rises over the title → scene 3                               | whoosh 4.5
 4.50  COVER: globe fills with water to 71 %, count 0→71% «من سطح الأرض»             | water swell
 8.75  aqua wave wipes up                                                             | whoosh 9.0
 9.00  OXYGEN (aqua): bubbles + plankton rise, count 0→50% «من أكسجين الأرض»          | bubble pops
12.50  bubbles converge into one dot = the sonar emitter                              | whoosh 13.0
13.00  DEPTH: sonar pings, a whale glides past, depth ruler scrolls, 0→3,700 «متر»    | pings, impact 16.9
17.00  DEEPEST: bioluminescent dark, Everest sinks inside the trench, 0→10,935 «متر»  | rumble, impact 19.5
21.50  PRESSURE: a can is crushed from all sides, 0→1,000 «ضعف ضغط السطح»            | creaks, crunch
25.50  MAPPED: a sonar sweep paints only ~29 % of a seafloor grid, 0→29%             | sweep, blips
29.50  END: «وكل هذا…» «ولم نكتشف إلا القليل!» + follow + sources note              | riser, ring-out
*/
const VIDEO = { w: 1080, h: 1920, duration: 33 };
window.VIDEO = VIDEO;
const BEAT = 0.5;
const INK = "#06121F", TEAL = "#0FB5A6", AQUA = "#BFF3EA", DEEP = "#0A2A5E", BIO = "#3DFFD0", SAND = "#E3C78A", CORAL = "#FF6B5B", NAVY = "#0B1A3A", CREAM = "#EDEBE4", WHITE = "#FFFFFF";

function spring(t, w = 14, z = 0.82) { if (t <= 0) return 0; if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t); const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 4);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const fmt = n => Math.round(n).toLocaleString("en-US");
const pulse = (t, period, w = 18) => { const k = ((t % period) + period) % period; return Math.exp(-w * k); };
const mix = (c1, c2, k) => { const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); const a = p(c1), b = p(c2); return "#" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(k))).toString(16).padStart(2, "0")).join(""); };

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const bg = $("bg"), art = $("art"), txt = $("txt"), fx = $("fx").getContext("2d");
function el(tag, cls, html, parent = txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; }
function svg(tag, attrs, parent = art) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }

const T = {};
T.kick = el("div", "abs c kufi"); T.big = el("div", "abs c kufi"); T.sub = el("div", "abs c kufi");
T.label = el("div", "abs c kufi"); T.num = el("div", "abs c kufi"); T.unit = el("div", "abs c kufi");
T.extra = el("div", "abs c kufi"); T.note = el("div", "abs c kufi"); T.label2 = el("div", "abs mono");
T.tag1 = el("div", "abs kufi"); T.tag2 = el("div", "abs kufi");
for (const k in T) Object.assign(T[k].style, { opacity: 0 });

// wavy-top fill used for every "water rises" transition
const wavePath = (top, t, amp = 26, ph = 0) => { let d = `M0,1940 L0,${top}`; for (let x = 0; x <= 1080; x += 20) d += ` L${x},${(top + Math.sin(x / 70 + t * 6 + ph) * amp).toFixed(1)}`; return d + " L1080,1940 Z"; };

// ---------- S1: drop + ripples + flood ----------
const drop = svg("path", { d: "M0,-34 C14,-12 22,4 22,14 A22,22 0 1 1 -22,14 C-22,4 -14,-12 0,-34 Z", fill: BIO, opacity: 0 });
const ripples = [0, 1, 2, 3].map(() => svg("ellipse", { cx: 540, cy: 960, rx: 0, ry: 0, fill: "none", stroke: BIO, "stroke-width": 6, opacity: 0 }));
const crown = (() => { const r = rng(8), a = []; for (let i = 0; i < 12; i++) a.push({ ang: -Math.PI / 2 + (r() - .5) * 2.2, sp: 300 + r() * 380, s: 5 + r() * 8, e: svg("circle", { r: 6, fill: BIO, opacity: 0 }) }); return a; })();
const flood = svg("path", { d: "", fill: TEAL });
const flood2 = svg("path", { d: "", fill: DEEP });
const wipe = svg("path", { d: "", fill: AQUA });

// ---------- S3: globe with water level ----------
const defs = svg("defs", {});
const gClip = svg("clipPath", { id: "gc" }, defs); svg("circle", { cx: 540, cy: 660, r: 250 }, gClip);
const globeG = svg("g", { opacity: 0 });
svg("circle", { cx: 540, cy: 660, r: 250, fill: SAND }, globeG);
const landDetail = svg("g", { "clip-path": "url(#gc)" }, globeG);
[[420, 520, 90, 60], [650, 600, 110, 70], [500, 760, 80, 50], [690, 800, 60, 40]].forEach(([x, y, rx, ry]) => svg("ellipse", { cx: x, cy: y, rx, ry, fill: "#C9A866" }, landDetail));
const gWater = svg("path", { d: "", fill: TEAL, "clip-path": "url(#gc)" }, globeG);
const gWater2 = svg("path", { d: "", fill: "#0B8F84", "clip-path": "url(#gc)", opacity: .7 }, globeG);
svg("circle", { cx: 540, cy: 660, r: 250, fill: "none", stroke: CREAM, "stroke-width": 8 }, globeG);
const gMark = svg("line", { x1: 260, x2: 330, y1: 0, y2: 0, stroke: CORAL, "stroke-width": 8, "stroke-linecap": "round", opacity: 0 }, globeG);

// ---------- S5: whale silhouette ----------
const whale = svg("g", { opacity: 0 });
svg("path", { d: "M-230,0 C-200,-70 -40,-90 90,-60 C170,-44 230,-20 250,6 C200,30 120,50 0,50 C-120,50 -190,40 -230,0 Z", fill: "#123C7A" }, whale);
svg("path", { d: "M-226,-2 L-300,-58 L-286,-4 L-306,48 Z", fill: "#123C7A" }, whale);
svg("path", { d: "M10,40 C30,80 70,96 110,96 C80,70 60,50 50,40 Z", fill: "#0F3266" }, whale);
svg("circle", { cx: 190, cy: -6, r: 7, fill: BIO }, whale);
svg("path", { d: "M120,22 C170,30 220,22 246,8", fill: "none", stroke: "#0B2852", "stroke-width": 6 }, whale);
const pings = [0, 1, 2].map(() => svg("circle", { cx: 540, cy: 640, r: 0, fill: "none", stroke: BIO, "stroke-width": 6, opacity: 0 }));
const blackout = svg("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "#000", opacity: 0 });

// ---------- S6: trench + Everest ----------
const trenchG = svg("g", { opacity: 0 });
const SURF = 360, FLOOR = 960, MPX = (FLOOR - SURF) / 10935;
svg("line", { x1: 90, x2: 990, y1: SURF, y2: SURF, stroke: BIO, "stroke-width": 5, "stroke-dasharray": "18 14" }, trenchG);
svg("path", { d: `M90,${SURF + 40} L330,${SURF + 90} L420,${FLOOR} L700,${FLOOR} L780,${SURF + 110} L990,${SURF + 60} L990,1000 L90,1000 Z`, fill: "#0C1626", stroke: "#1E3A5F", "stroke-width": 4 }, trenchG);
const everest = svg("path", { d: "", fill: "#8A97A8", stroke: CREAM, "stroke-width": 4 }, trenchG);
const snow = svg("path", { d: "", fill: CREAM }, trenchG);
const sub = svg("g", {}, trenchG);
svg("ellipse", { cx: 0, cy: 0, rx: 34, ry: 20, fill: SAND }, sub); svg("circle", { cx: 12, cy: -4, r: 7, fill: "#0C1626" }, sub);
const subBeam = svg("path", { d: "M30,0 L200,-60 L200,60 Z", fill: BIO, opacity: .18 }, sub);
const depthLine = svg("line", { x1: 250, x2: 250, y1: SURF, y2: SURF, stroke: CORAL, "stroke-width": 6, "stroke-linecap": "round" }, trenchG);

// ---------- S7: crushed can + arrows ----------
const canG = svg("g", { opacity: 0 });
const can = svg("path", { d: "", fill: CORAL, stroke: CREAM, "stroke-width": 8, "stroke-linejoin": "round" }, canG);
const canBand = svg("path", { d: "", fill: "none", stroke: CREAM, "stroke-width": 10 }, canG);
const arrows = [0, 1, 2, 3, 4, 5, 6, 7].map(() => svg("path", { d: "M-40,-18 L0,0 L-40,18 M-90,0 L0,0", fill: "none", stroke: BIO, "stroke-width": 10, "stroke-linecap": "round", "stroke-linejoin": "round" }, canG));

// ---------- S8: seafloor map grid ----------
const COLS = 12, ROWS = 7, CW = 70, CH = 70, GX = 540 - COLS * CW / 2, GY = 470;
const mapCells = (() => { const r = rng(29), all = []; for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) all.push({ i, j, k: r() }); const sorted = [...all].sort((a, b) => a.k - b.k); sorted.slice(0, 24).forEach(c => c.on = true); return all; })(); // 24/84 ≈ 29 %
const mapG = svg("g", { opacity: 0 });
const cellE = mapCells.map(c => svg("rect", { x: GX + c.i * CW + 4, y: GY + c.j * CH + 4, width: CW - 8, height: CH - 8, rx: 8, fill: "#13254A" }, mapG));
const qE = mapCells.map(c => { if (c.on) return null; const e = svg("text", { x: GX + c.i * CW + CW / 2, y: GY + c.j * CH + CH / 2 + 12, "text-anchor": "middle", "font-family": "Mono", "font-size": 30, fill: "#3A5A8F" }, mapG); e.textContent = "?"; return e; });
const sweep = svg("line", { x1: 0, x2: 0, y1: GY - 20, y2: GY + ROWS * CH + 20, stroke: BIO, "stroke-width": 6, opacity: 0 }, mapG);

const rule = svg("line", { x1: 540, x2: 540, y1: 1060, y2: 1060, stroke: DEEP, "stroke-width": 4 });

// ---------- grain ----------
const grainTiles = (() => { const r = rng(3), tiles = []; for (let n = 0; n < 4; n++) { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"), im = g.createImageData(256, 256); for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 14; } g.putImageData(im, 0, 0); tiles.push(c); } return tiles; })();
const gctx = $("grain").getContext("2d");

// ---------- helpers ----------
function show(node, text, style, a) { if (text != null && node._t !== text) { node.textContent = text; node._t = text; } Object.assign(node.style, style); node.style.opacity = a; }
function slamIn(t, t0) { const k = spring(t - t0, 16, .62); return { s: lerp(1.35, 1, k), a: clamp((t - t0) / .12), y: (1 - k) * 40 }; }
function maskRTL(node, t, t0, d) { const k = ease(seg(t, t0, t0 + d)); node.style.clipPath = `inset(0 0 0 ${(1 - k) * 100}%)`; }
function countBlock(t, t0, t1, to, label, unit, color, labelColor, suffix = "", numSize = 176) {
  const inA = clamp((t - t0) / .25), outA = 1 - clamp((t - (t1 - .35)) / .3), a = Math.min(inA, outA);
  const k = easeOut(seg(t, t0 + .25, t0 + 2.6)), landed = t > t0 + 2.6;
  const blur = landed ? 0 : (1 - k) * 6 * (k > 0 ? 1 : 0);
  const pop = landed ? 1 + 0.08 * Math.exp(-10 * (t - t0 - 2.6)) * Math.cos(28 * (t - t0 - 2.6)) : 1;
  const l = slamIn(t, t0 + .05);
  show(T.label, label, { top: "1060px", fontSize: "62px", fontWeight: 700, color: labelColor, transform: `translateY(${l.y}px)` }, a);
  show(T.num, fmt(lerp(0, to, k)) + suffix, { top: "1130px", fontSize: numSize + "px", fontWeight: 700, color, letterSpacing: "2px", filter: blur > .3 ? `blur(${blur.toFixed(1)}px)` : "none", transform: `scale(${pop})`, direction: "ltr" }, a);
  const u = slamIn(t, t0 + 2.6);
  show(T.unit, unit, { top: "1380px", fontSize: "66px", fontWeight: 700, color: labelColor, transform: `translateY(${u.y}px) scale(${u.s})` }, Math.min(a, u.a));
  return { a, k };
}
function hide(...n) { for (const x of n) x.style.opacity = 0; }
const SCENES = [[0, "01", "DROP"], [2, "02", "TITLE"], [4.5, "03", "COVER"], [9, "04", "OXYGEN"], [13, "05", "DEPTH"], [17, "06", "DEEPEST"], [21.5, "07", "PRESSURE"], [25.5, "08", "MAPPED"], [29.5, "09", "END"]];

// ---------- seek ----------
function seek(t) {
  t = clamp(t, 0, VIDEO.duration - 1e-6);
  const sc = [...SCENES].reverse().find(s => t >= s[0]);
  $("hudScene").textContent = `SCENE ${sc[1]} / 09`;
  $("hudCat").textContent = `OCEAN / DATA — ${sc[2]}`;
  const fr = Math.floor(t * 30) % 30, ss = Math.floor(t);
  $("hudTc").innerHTML = `<span style="color:${BIO}">●</span> 00:00:${String(ss).padStart(2, "0")}:${String(fr).padStart(2, "0")}`;
  $("hud").style.color = (t >= 9 && t < 13) || t >= 29.5 ? INK : WHITE;
  hide(...Object.values(T));
  for (const k in T) { T[k].style.filter = "none"; T[k].style.clipPath = "none"; T[k].style.transform = "none"; T[k].style.textShadow = "none"; }

  let base = INK;
  if (t >= 2 && t < 4.5) base = TEAL;
  if (t >= 4.5 && t < 9) base = DEEP;
  if (t >= 9 && t < 13) base = AQUA;
  if (t >= 13 && t < 17) base = mix(DEEP, "#030A18", seg(t, 13, 16.8));
  if (t >= 17 && t < 21.5) base = "#02060D";
  if (t >= 21.5 && t < 25.5) base = "#071A2B";
  if (t >= 25.5 && t < 29.5) base = NAVY;
  if (t >= 29.5) base = CREAM;
  bg.style.background = base;
  fx.clearRect(0, 0, 1080, 1920);

  // ---- S1 drop → splash → flood (0–2)
  if (t < 2) {
    const fall = seg(t, .15, .9), y = lerp(180, 940, fall * fall);
    drop.setAttribute("opacity", t >= .15 && t < .92 ? 1 : 0);
    drop.setAttribute("transform", `translate(540 ${y.toFixed(1)}) scale(${(1 + fall * .3).toFixed(3)},${(1 + fall * .6).toFixed(3)})`);
    ripples.forEach((r, i) => { const d = t - .92 - i * .22; if (d < 0) { r.setAttribute("opacity", 0); return; } const R = 40 + d * 520; r.setAttribute("rx", R); r.setAttribute("ry", R * .28); r.setAttribute("opacity", (1 - seg(d, 0, 1.1)).toFixed(3)); });
    crown.forEach(c => { const d = t - .92; if (d < 0 || d > .8) { c.e.setAttribute("opacity", 0); return; } c.e.setAttribute("cx", 540 + Math.cos(c.ang) * c.sp * d); c.e.setAttribute("cy", 950 + Math.sin(c.ang) * c.sp * d + 900 * d * d); c.e.setAttribute("r", c.s * (1 - d)); c.e.setAttribute("opacity", 1 - d / .8); });
    const fl = ease(seg(t, 1.72, 2.0));
    flood.setAttribute("d", fl > 0 ? wavePath(1960 - 2000 * fl, t) : "M0,0");
    show(T.label2, "OCEAN / DATA", { top: "1010px", left: "60px", fontSize: "28px", color: WHITE }, clamp((t - 1.1) / .2) * (1 - fl));
  } else { drop.setAttribute("opacity", 0); ripples.forEach(r => r.setAttribute("opacity", 0)); crown.forEach(c => c.e.setAttribute("opacity", 0)); flood.setAttribute("d", "M0,0"); }

  // ---- S2 title (2–4.5)
  if (t >= 2 && t < 4.75) {
    const out = seg(t, 4.2, 4.5);
    const k1 = slamIn(t, 2.05);
    show(T.kick, "كوكبنا أزرق…", { top: "620px", fontSize: "58px", fontWeight: 700, color: WHITE, transform: `translateY(${k1.y}px)` }, k1.a * (1 - out));
    const b = slamIn(t, 2.5);
    show(T.big, "المحيط", { top: "640px", fontSize: "250px", fontWeight: 700, color: WHITE, transform: `scale(${b.s})`, lineHeight: "1.5" }, b.a * (1 - out));
    maskRTL(T.big, t, 2.5, .45);
    const s = slamIn(t, 3.0);
    show(T.sub, "بالأرقام", { top: "1180px", fontSize: "96px", fontWeight: 700, color: DEEP, transform: `translateY(${s.y}px)` }, s.a * (1 - out));
    maskRTL(T.sub, t, 3.0, .4);
    const w = ease(seg(t, 4.15, 4.5));
    flood2.setAttribute("d", w > 0 ? wavePath(1960 - 2000 * w, t, 30, 1) : "M0,0");
  } else flood2.setAttribute("d", "M0,0");

  // ---- S3 cover: globe water level 0→71 % (4.5–9)
  if (t >= 4.5 && t < 9.05) {
    const a = clamp((t - 4.5) / .3);
    const g = spring(t - 4.55, 11, .7);
    globeG.setAttribute("opacity", a);
    globeG.setAttribute("transform", `translate(540 660) scale(${g.toFixed(4)}) translate(-540 -660)`);
    const lvl = easeOut(seg(t, 4.85, 7.1)) * .71, top = 910 - 500 * lvl;
    const wav = (ph, amp) => { let d = `M280,${top}`; for (let x = 280; x <= 800; x += 10) d += ` L${x},${(top + Math.sin(x / 34 + t * 5 + ph) * amp).toFixed(1)}`; return d + " L800,920 L280,920 Z"; };
    gWater.setAttribute("d", lvl > 0 ? wav(0, 9) : "M0,0"); gWater2.setAttribute("d", lvl > 0 ? wav(2, 6) : "M0,0");
    gMark.setAttribute("y1", 910 - 500 * .71); gMark.setAttribute("y2", 910 - 500 * .71); gMark.setAttribute("opacity", t > 7.1 ? 1 : 0);
    countBlock(t, 4.6, 9, 71, "يغطّي المحيط حوالي", "من سطح الأرض", WHITE, AQUA, "%");
  } else globeG.setAttribute("opacity", 0);
  // aqua wave wipe (8.7–9.05)
  { const w = ease(seg(t, 8.7, 9.0)); wipe.setAttribute("d", t >= 8.7 && t < 9.05 ? wavePath(1960 - 2000 * w, t, 26, 2) : "M0,0"); }

  // ---- S4 oxygen: bubbles + plankton (9–13)
  if (t >= 9 && t < 13.05) {
    const merge = ease(seg(t, 12.5, 12.95)), r = rng(51);
    for (let i = 0; i < 40; i++) {
      const x0 = 80 + r() * 920, sp = 140 + r() * 220, ph = r(), size = 10 + r() * 34, big = size > 34;
      const yy = 1000 - (((t - 9) * sp + ph * 900) % 900);
      const X = lerp(x0 + Math.sin(t * 2 + i) * 14, 540, merge), Y = lerp(yy, 620, merge), S = size * (1 - merge * .8) * clamp((t - 9.05 - ph * .4) / .3);
      if (S <= 0) continue;
      fx.globalAlpha = 1 - seg(t, 12.85, 13);
      fx.strokeStyle = DEEP; fx.lineWidth = 4; fx.fillStyle = "rgba(255,255,255,.55)";
      fx.beginPath(); fx.arc(X, Y, S, 0, Math.PI * 2); fx.fill(); fx.stroke();
      fx.fillStyle = WHITE; fx.beginPath(); fx.arc(X - S * .35, Y - S * .35, S * .22, 0, Math.PI * 2); fx.fill();
      if (big && merge < .3) { fx.fillStyle = DEEP; fx.font = `700 ${Math.round(S * .7)}px Mono`; fx.textAlign = "center"; fx.textBaseline = "middle"; fx.fillText("O2", X, Y + 2); }
    }
    const p = rng(61); fx.fillStyle = "#1E9E6A";
