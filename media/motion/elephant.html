<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الفيل بالأرقام</title>
<style>
/*@FONTS@*/
html,body{margin:0;background:#0E0E10;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg,#141416);transform-origin:0 0}
.L{position:absolute;inset:0}
.k{font-family:"Kufi",sans-serif;font-weight:700}
.kr{font-family:"Kufi",sans-serif;font-weight:400}
.m{font-family:"Mono",monospace;direction:ltr}
#bg{position:absolute;inset:0}
#cap{position:absolute;left:60px;right:60px;top:250px;height:300px;display:flex;align-items:center;justify-content:center;text-align:center}
#capIn{font-family:"Kufi",sans-serif;font-weight:700;font-size:92px;line-height:1.45;color:#fff;white-space:normal}
.kw{background:var(--accent,#E62E3A);color:var(--on-accent,#fff);padding:0 18px;border-radius:14px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#cardWrap{position:absolute;left:70px;top:610px;width:940px;height:680px}
#card{position:absolute;inset:0;border-radius:30px;overflow:hidden;background:var(--card,#1E1E22);box-shadow:0 40px 90px rgba(0,0,0,.55)}
.br{position:absolute;width:46px;height:46px;border-color:#fff;border-style:solid;opacity:.9}
#lt{position:absolute;left:70px;right:70px;top:1325px;direction:rtl}
#ltRow{display:flex;align-items:center;gap:22px}
#ltNum{font-family:"Mono",monospace;font-weight:700;font-size:40px;color:var(--on-accent,#fff);background:var(--accent,#E62E3A);border-radius:12px;padding:4px 16px;direction:ltr}
#ltTitle{font-family:"Kufi",sans-serif;font-weight:700;font-size:64px;color:#fff;white-space:nowrap}
#ltSub{font-family:"Kufi",sans-serif;font-weight:400;font-size:38px;color:#B9B9C4;margin-top:6px;white-space:nowrap}
#prog{position:absolute;left:70px;right:70px;top:1545px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#progF{position:absolute;right:0;top:0;bottom:0;background:var(--accent,#E62E3A)}
#rec{position:absolute;left:52px;top:584px;width:16px;height:16px;border-radius:50%;background:var(--accent,#E62E3A)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#grain{position:absolute;inset:0;pointer-events:none}
/* card scene parts */
.sc{position:absolute;inset:0}
.input{position:absolute;left:50px;right:50px;border-radius:30px;background:var(--card2,#2A2A30);border:3px solid var(--line,#3A3A44);display:flex;align-items:center;padding:0 30px 0 110px;font-family:"Kufi",sans-serif;font-size:40px;color:#fff;min-height:110px;direction:rtl}
.send{position:absolute;width:76px;height:76px;border-radius:50%;background:var(--accent,#E62E3A);display:flex;align-items:center;justify-content:center}
.phone{position:absolute;width:300px;height:560px;border-radius:44px;background:#0B0B10;border:8px solid #2E2E36;overflow:hidden}
.post{position:absolute;left:14px;right:14px;border-radius:18px;background:#fff;overflow:hidden}
.bub{position:absolute;max-width:600px;border-radius:30px;padding:16px 28px;font-family:"Kufi",sans-serif;font-size:38px;line-height:1.5;white-space:normal}
.bin{right:40px;background:var(--card2,#2E2E36);color:#fff;border-radius:30px 30px 8px 30px}
.bout{left:40px;background:#FFF2E8;color:#16161C;border-radius:30px 30px 30px 8px}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;background:#8A8A96;margin:0 6px}
.cell{position:absolute;border-radius:10px}
/* English mode (DATA.lang === "en") */
body.en .k,body.en .kr,body.en #capIn,body.en #ltTitle,body.en #ltSub,body.en .input,body.en .bub,body.en .qchip,body.en .tag{font-family:"Sans",sans-serif!important}
body.en #capIn{font-size:86px;line-height:1.3}
body.en #lt,body.en .input,body.en .bub{direction:ltr}
body.en .input{padding:0 110px 0 30px!important}
body.en .send{left:auto!important;right:72px}
/* Kufam display face (DATA.font === "kufam"), Arabic + Latin */
body.kufam .k,body.kufam .kr,body.kufam #capIn,body.kufam #ltTitle,body.kufam #ltSub,body.kufam .input,body.kufam .bub,body.kufam .qchip{font-family:"Kufam",sans-serif!important}
body.kufam #capIn,body.kufam #ltTitle,body.kufam .k{font-weight:800}
#ui{position:fixed;left:8px;bottom:8px;z-index:9;font:14px sans-serif;color:#fff;direction:ltr}
</style>
</head>

  <div class="br" style="right:-20px;bottom:-20px;border-width:0 5px 5px 0"></div>
  <div class="br" style="left:-20px;bottom:-20px;border-width:0 0 5px 5px"></div>
 </div>

// ---------- seek ----------
function seek(t) {

    cap.style.transform = `translateY(${((1 - k) * 34).toFixed(1)}px) scale(${lerp(1.12, 1, k).toFixed(3)})`;
    cap.style.color = light ? TH.endInk : TH.text;

    const vis = name === "none" ? 0 : 1;

    $("card").style.filter = Math.abs(whip + whipOut) > 4 ? `blur(${(Math.abs(whip + whipOut) / 26).toFixed(1)}px)` : "none";

// ---------- sound: a light groove + UI sounds on the cuts (no narration) ----------
window.buildAudio = async function (ctx) {
  const sr = ctx.sampleRate, BEAT = 60 / (DATA.bpm || 112);
  const master = ctx.createGain(); master.gain.value = NARR ? .24 : .8; // music sits under the voice
  if (NARR && NARR.audio) { const bin = atob(NARR.audio.split(",")[1]), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); const vs = ctx.createBufferSource(), vg = ctx.createGain(); vs.buffer = await ctx.decodeAudioData(u8.buffer); vg.gain.value = NARR.gain || 1.5; vs.connect(vg); vg.connect(ctx.destination); vs.start(0); }

  const snap = (t0, v = .16) => { noise(t0, .09, v, "bandpass", 2400, null, 1.5); osc("triangle", 330, t0, .05, v * .5); };
  const hat = (t0, v = .035) => noise(t0, .03, v, "highpass", 9000);
  const swish = (t0, v = .14) => noise(Math.max(0, t0 - .12), .24, v, "bandpass", 600, 5500, 2, .1);
  const tick = (t0, v = .05) => { noise(t0, .015, v, "highpass", 3500); osc("square", 1900 + (t0 * 911 % 400), t0, .012, v * .4); };
  const pop = (t0, f = 880, v = .12) => osc("sine", f, t0, .07, v, .002, f * 1.7);

  const D = DATA.duration;
  // groove: soft kick/snap + pluck chords
  const roots = DATA.roots || [65.41, 55, 43.65, 49], chords = DATA.chords || [[261.6, 329.6, 392], [220, 261.6, 329.6], [174.6, 220, 261.6], [196, 246.9, 293.7]];

    const q = quiet.some(([a, b]) => t0 >= a && t0 < b);
    kick(t0, q ? .35 : (n % 2 ? .45 : .7)); if (n % 2 === 1 && !q) snap(t0); hat(t0 + BEAT / 2, q ? .02 : .035);

    const ch = chords[bar % 4]; osc("sine", roots[bar % 4], t0, BEAT * 4 - .05, .22, .02);
    for (let s = 0; s < 8; s++) osc("triangle", ch[s % 3] * (s % 4 === 3 ? 2 : 1), t0 + s * BEAT / 2, .16, .045, .003);

// Sample-based SFX (media/motion/sfx: uisfx CC0 interface sounds + earshot MIT bank), placed on the exact event times.

async function sampleSfx(ctx, out) {

    if (kind === "ding") play("ui_success", t0, .5);
    else if (kind === "hit") play("es_impact", t0, .8, 1, .117);
    else if (kind === "pop") play("ui_select", t0, .3);
    else if (kind === "swish") play("es_swish", t0, .5, 1, .131);

  if (!window.HOOK) play("es_impact", 0, .85, 1, 0);
}

// typing ticks for "type"/"msg" shots
for (const [s0, name, o] of SHOTS) { if (name === "type") for (let i = 0; i < [...o.text].length; i++) TYPE_TICKS.push(s0 + .25 + i / (o.cps || 18)); if (name === "msg") for (let i = 0; i < [...o.reply].length; i += 2) TYPE_TICKS.push(s0 + 1.3 + i / (o.cps || 30)); }

// ---------- preview controls ----------
const isRender = location.search.includes("render");
if (!isRender) {
  const fit = () => { const s = Math.min(innerWidth / 1080, innerHeight / 1920); $("stage").style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  async function play() { ac ??= new AudioContext(); if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * VIDEO.duration), 48000); await buildAudio(off); buf = await off.startRendering(); } src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(0, offset % VIDEO.duration); startAt = ac.currentTime; playing = true; }

  const now = () => playing ? (offset + ac.currentTime - startAt) % VIDEO.duration : offset;

  $("pp").onclick = () => playing ? pause() : play();
  $("sc").oninput = e => { const was = playing; pause(); offset = +e.target.value; if (was) play(); };

<script>
/* HOOK v2 (0–2 s): a cold open placed over the first scene. The first line is on screen at frame 0 (the frame the
   feed shows), the hero word lands at 0.35 s, the punchline at 0.9 s, an open-loop tease at 1.3 s, then the panel
   bursts away at 1.75 s into the page's own opening.
   The hero word's motion acts its meaning (H.feel, after the kufam-kinetic-type rule "the motion is the feeling"):
     slam   default: big overshoot + camera shake
     brake  «استنى!»: everything is racing, the word lands and the whole frame freezes dead
     reveal «مستخبية»: the word is there from frame 0 but blurred and dim; a light sweep uncovers it
     glitch «بيهنّج»: the word arrives in stutters, with jitter and colour split
     shake  danger: slam, then an angry decaying shake, red glow, cracks under the word
     count  a number: counts up from 0 as it lands

   Wraps window.seek / window.buildAudio; the rest of the page is untouched. */
(function () {
  const H = window.HOOK, FEEL = H.feel || "slam";

  const Y3 = H.y3 || 990;

    line("hk1", 560, H.s1 || 74, CREAM, 700, 60) + line("hk2", 680, H.s2 || 190, H.accent, 900, 30) +
    line("hk3", Y3, H.s3 || 76, CREAM, 700, 60) + line("hk4", Y3 + 170, 50, "#FFD23F", 700, 60);

    } else if (d2 >= 0 && d2 < .6) { // shockwave + flash on the hit
      fx.strokeStyle = H.accent; fx.lineWidth = 26 * (1 - d2 / .6); fx.globalAlpha = 1 - d2 / .6; fx.beginPath(); fx.arc(540, 820, 80 + d2 * 1400, 0, Math.PI * 2); fx.stroke(); fx.globalAlpha = 1;
      if (d2 < .18) { fx.fillStyle = `rgba(255,255,255,${(.5 * (1 - d2 / .18)).toFixed(3)})`; fx.fillRect(0, 0, 1080, 1920); }
    }
    if (FEEL === "brake" && d2 >= 0) { // two hard bars lock the word in place
      const k = eo(d2 / .12); fx.fillStyle = H.accent2 || "#E62E3A";
      fx.fillRect(540 - 430 * k, 708, 860 * k, 12); fx.fillRect(540 - 430 * k, 948, 860 * k, 12);
    }
    if (FEEL === "shake" && d2 >= 0) { // cracks under the word
      const k = eo(d2 / .25); fx.strokeStyle = rgba("#E62E3A", .85); fx.lineWidth = 6; fx.lineJoin = "round";
      for (const c of cracks) { fx.beginPath(); c.forEach(([x, y], i) => { const px = 540 + x * k, py = 960 + y * k; if (i) fx.lineTo(px, py); else fx.moveTo(px, py); }); fx.stroke(); }
    }
    const hit = FEEL !== "reveal" && d2 >= 0 && d2 < .5 ? Math.exp(-d2 * (FEEL === "brake" ? 22 : 8)) * 22 * Math.sin(d2 * 75) : 0;
    // line 1: readable on frame 0
    const k1 = sp(t + .12, 14, .6);
    $h("hk1").style.transform = `translate(${hit * .4}px,${(1 - k1) * 30}px) scale(${lp(1.12, 1, k1)})`; $h("hk1").style.opacity = 1;
    // the hero word
    const w = $h("hk2"), st = w.style;
    let tf, op = d2 >= 0 ? cl(d2 / .05) : 0, shadow = "0 14px 0 rgba(0,0,0,.5)", filter = "none";
    if (FEEL === "brake") { const k = sp(d2, 30, .92); tf = `translate(${hit}px,0) scale(${lp(2.6, 1, k)})`; }
    else if (FEEL === "reveal") { const k = eo((t - T2) / .35); op = lp(.22, 1, k); filter = k < 1 ? `blur(${((1 - k) * 22).toFixed(1)}px)` : "none"; tf = `scale(${lp(1.1, 1, k)})`; }
    else if (FEEL === "glitch") {
      const dq = Math.floor(Math.max(0, d2) / .11) * .11, k = sp(d2 < .66 ? dq : d2), q = Math.floor(Math.max(0, d2) / .08), j = d2 >= 0 && d2 < 1.15 ? jit[q % jit.length] : [0, 0, false];
      tf = `translate(${j[0]}px,0) skewX(${j[1]}deg) scale(${lp(1.3, 1, k)})`;
      if (j[2] && d2 >= 0 && d2 < 1.15) shadow = "10px 0 #2EF2FF,-10px 0 #E62E3A,0 14px 0 rgba(0,0,0,.5)";
      if (d2 >= 0 && d2 < 1.15 && q % 5 === 3) op = .55;
    }
    else if (FEEL === "shake") { const k = sp(d2), sh = d2 >= 0 ? Math.sin(d2 * 62) * 9 * Math.exp(-d2 * 2.2) : 0; tf = `translate(${hit + sh}px,${sh * .4}px) scale(${lp(2.1, 1, k)}) rotate(${(lp(-6, -2, k) + sh * .12).toFixed(2)}deg)`; shadow = `0 0 ${(40 * Math.exp(-Math.max(0, d2) * 1.2)).toFixed(0)}px #E62E3A,0 14px 0 rgba(0,0,0,.5)`; }
    else { const k = sp(d2); tf = `translate(${hit}px,${hit * .5}px) scale(${lp(2.1, 1, k)}) rotate(${lp(-6, -2, k).toFixed(2)}deg)`; if (d2 >= 0 && d2 < .3) shadow = "9px 0 #2EF2FF,-9px 0 #E62E3A,0 14px 0 rgba(0,0,0,.5)"; }
    if (FEEL === "count") { const v = Math.round(NUM * eo(d2 / .5)).toLocaleString("en-US"), txt = String(H.big).replace(/[0-9][0-9,.]*/, v); if (w._t !== txt) { w.textContent = txt; w._t = txt; } }
    st.opacity = op; st.transform = tf; st.textShadow = shadow; st.filter = filter;
    // punchline + tease
    const d3 = t - T3, k3 = sp(d3, 16, .6);
    $h("hk3").style.opacity = d3 >= 0 ? cl(d3 / .08) : 0; $h("hk3").style.transform = `translateY(${(1 - k3) * 50}px)`;
    const d4 = t - T4;
    $h("hk4").style.opacity = d4 >= 0 ? cl(d4 / .08) * (Math.floor(t * 8) % 2 ? 1 : .55) : 0;
  }
  const s0 = window.seek;
  window.seek = t => { s0(t); hookSeek(t); };

  const a0 = window.buildAudio;
  window.buildAudio = async ctx => {
    if (a0) await a0(ctx);
    const m = ctx.createGain(); m.gain.value = .7; m.connect(ctx.destination);
    const SB = window.loadSfx ? await window.loadSfx(ctx) : {};

      if (FEEL !== "reveal") smp("es_rev", 0, .5, 0, .705 - T2); // reverse whoosh, its peak on the hit
      if (FEEL === "reveal") smp("es_whoosh", T2 + .1, .45, .354);
      else smp("es_impact", T2, FEEL === "brake" ? 1 : .85, .117);
      if (FEEL === "shake") smp("es_hit", T2 + .16, .6, .058);
      if (FEEL === "glitch") smp("es_glitch", T2 + .05, .5);
      if (FEEL === "count") for (let i = 0; i < 9; i++) smp("es_tick", T2 + .04 + i * .05, .35, 0, 0, .9 + i * .03);
      smp("ui_snap", T3, .5);
      smp("ui_select", T4, .4);
      smp("es_whoosh", 1.9, .6, .354);                        // the burst into the page: whoosh peak just before the cut

      osc("sine", 160, T3, .25, .45, 50); nz(T3, .06, .2, "bandpass", 2500, null, 2);

  };
})();
