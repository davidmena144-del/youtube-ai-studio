<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>البرق بالأرقام</title>
<style>
/*@FONTS@*/
html,body{margin:0;background:#0E0E10;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg,#141416);transform-origin:0 0}
.L{position:absolute;inset:0}
.k{font-family:"Kufi",sans-serif;font-weight:700}
.kr{font-family:"Kufi",sans-serif;font-weight:400}
.m{font-family:"Mono",monospace;direction:ltr}
#bg{position:absolute;inset:0}
#cap{position:absolute;left:60px;right:60px;top:250px;height:300px;display:flex;align-items:center;justify-content:center;text-align:center}
#capIn{font-family:"Kufi",sans-serif;font-weight:700;font-size:92px;line-height:1.45;color:#fff;white-space:normal}
.kw{background:var(--accent,#E62E3A);color:var(--on-accent,#fff);padding:0 18px;border-radius:14px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#cardWrap{position:absolute;left:70px;top:610px;width:940px;height:680px}
#card{position:absolute;inset:0;border-radius:30px;overflow:hidden;background:var(--card,#1E1E22);box-shadow:0 40px 90px rgba(0,0,0,.55)}
.br{position:absolute;width:46px;height:46px;border-color:#fff;border-style:solid;opacity:.9}
#lt{position:absolute;left:70px;right:70px;top:1325px;direction:rtl}
#ltRow{display:flex;align-items:center;gap:22px}
#ltNum{font-family:"Mono",monospace;font-weight:700;font-size:40px;color:var(--on-accent,#fff);background:var(--accent,#E62E3A);border-radius:12px;padding:4px 16px;direction:ltr}
#ltTitle{font-family:"Kufi",sans-serif;font-weight:700;font-size:64px;color:#fff;white-space:nowrap}
#ltSub{font-family:"Kufi",sans-serif;font-weight:400;font-size:38px;color:#B9B9C4;margin-top:6px;white-space:nowrap}
#prog{position:absolute;left:70px;right:70px;top:1545px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#progF{position:absolute;right:0;top:0;bottom:0;background:var(--accent,#E62E3A)}
#rec{position:absolute;left:52px;top:584px;width:16px;height:16px;border-radius:50%;background:var(--accent,#E62E3A)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#grain{position:absolute;inset:0;pointer-events:none}
/* card scene parts */
.sc{position:absolute;inset:0}
.input{position:absolute;left:50px;right:50px;border-radius:30px;background:var(--card2,#2A2A30);border:3px solid var(--line,#3A3A44);display:flex;align-items:center;padding:0 30px 0 110px;font-family:"Kufi",sans-serif;font-size:40px;color:#fff;min-height:110px;direction:rtl}
.send{position:absolute;width:76px;height:76px;border-radius:50%;background:var(--accent,#E62E3A);display:flex;align-items:center;justify-content:center}
.phone{position:absolute;width:300px;height:560px;border-radius:44px;background:#0B0B10;border:8px solid #2E2E36;overflow:hidden}
.post{position:absolute;left:14px;right:14px;border-radius:18px;background:#fff;overflow:hidden}
.bub{position:absolute;max-width:600px;border-radius:30px;padding:16px 28px;font-family:"Kufi",sans-serif;font-size:38px;line-height:1.5;white-space:normal}
.bin{right:40px;background:var(--card2,#2E2E36);color:#fff;border-radius:30px 30px 8px 30px}
.bout{left:40px;background:#FFF2E8;color:#16161C;border-radius:30px 30px 30px 8px}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;background:#8A8A96;margin:0 6px}
.cell{position:absolute;border-radius:10px}
/* English mode (DATA.lang === "en") */
body.en .k,body.en .kr,body.en #capIn,body.en #ltTitle,body.en #ltSub,body.en .input,body.en .bub,body.en .qchip,body.en .tag{font-family:"Sans",sans-serif!important}
body.en #capIn{font-size:86px;line-height:1.3}
body.en #lt,body.en .input,body.en .bub{direction:ltr}
body.en .input{padding:0 110px 0 30px!important}
body.en .send{left:auto!important;right:72px}
/* Kufam display face (DATA.font === "kufam"), Arabic + Latin */
body.kufam .k,body.kufam .kr,body.kufam #capIn,body.kufam #ltTitle,body.kufam #ltSub,body.kufam .input,body.kufam .bub,body.kufam .qchip{font-family:"Kufam",sans-serif!important}
body.kufam #capIn,body.kufam #ltTitle,body.kufam .k{font-weight:800}
#ui{position:fixed;left:8px;bottom:8px;z-index:9;font:14px sans-serif;color:#fff;direction:ltr}
</style>
</head>
<body>
<div id="stage">
 <canvas id="bg" width="1080" height="1920"></canvas>
 <div id="cap"><div id="capIn"></div></div>
 <div id="cardWrap">
  <div id="card"><div id="scene" class="L"></div></div>
  <div class="br" style="right:-20px;top:-20px;border-width:5px 5px 0 0"></div>
  <div class="br" style="left:-20px;top:-20px;border-width:5px 0 0 5px"></div>
  <div class="br" style="right:-20px;bottom:-20px;border-width:0 5px 5px 0"></div>
  <div class="br" style="left:-20px;bottom:-20px;border-width:0 0 5px 5px"></div>
 </div>
 <div id="rec"></div>
 <div id="lt"><div id="ltRow"><span id="ltNum"></span><span id="ltTitle"></span></div><div id="ltSub"></div></div>
 <div id="prog"><div id="progF"></div></div>
 <div id="flash"></div>
 <canvas id="grain" width="1080" height="1920"></canvas>
</div>
<div id="ui"></div>
<script>/*@SFX@*/</script>
<script>
/* Explainer-list engine (inspired by the reference's grammar, own look): top kinetic captions with a red keyword box,
   a framed card in the middle with mini-scenes that cut every 1–3 s, a numbered lower third, a progress line.
   No narration: the captions carry the words; music + UI sounds carry the pace. Pure seek(t). */
// title: البرق بالأرقام
/* global window */
window.DATA = {
  theme: {"bg": "#141A2B", "bg2": "#070912", "glow": "255,228,77", "accent": "#FFE44D", "onAccent": "#1A1600", "card": "#1B2238", "card2": "#252E4A", "line": "#3A4670", "scene": "#161C2F", "text": "#F4F6FF", "muted": "#A9B4D6", "warn": "#252E4A", "endBg": "#FFF8CC", "endCard": "#FFFDF0", "endInk": "#141A2B", "endAccent": "#C99A00", "pattern": "bolt", "bokeh": ["rgba(255,228,77,", "rgba(120,150,255,", "rgba(200,210,255,"]},
  font: "kufam", wordlit: true, realSfx: true, grooveFrom: 2,
  duration: 34, bpm: 116,
  roots: [65.41, 87.31, 55, 73.42], chords: [[261.6, 329.6, 392], [349.2, 440, 523.3], [220, 261.6, 329.6], [293.7, 349.2, 440]],
  caps: [
    [0.0, ""], [2.0, "[البرق] بالأرقام"], [3.2, "حرارة ضربة البرق"], [4.6, "حوالي [28 ألف] درجة"], [7.4, "أسخن من [الشمس]"], [8.8, "5 مرات!"], [11.6, "وكل ثانية؟"], [12.8, "حوالي [44] ضربة برق"], [14.4, "حوالين الأرض"], [15.6, "يعني [3 مليون]"], [17.0, "في اليوم الواحد"], [19.0, "[بعيد] قد إيه؟"], [20.6, "عدّ الثواني"], [21.8, "من البرق [للرعد]"], [24.2, "واقسم على [3]"], [25.6, "تطلع المسافة بالكيلو"], [27.4, "جرّبها في [المطرة]"], [28.8, "واحفظ الفيديو"], [30.2, "وابعته لصاحبك"], [31.6, "وتابع [تكّة]"]
  ],
  shots: [
    [0.0, "big", {"text": "[البرق]", "size": 190, "sub": "بالأرقام"}],
    [3.2, "count", {"to": 28000, "label": "حرارة ضربة البرق", "unit": "درجة مئوية", "dur": 2.6, "size": 200, "sub": "تقريبًا، للحظة قصيرة جدًا"}],
    [7.4, "bars", {"vals": [28000, 5500], "labels": ["البرق", "سطح الشمس"], "title": "درجة مئوية"}],
    [11.6, "count", {"to": 44, "label": "في كل ثانية", "unit": "ضربة برق", "dur": 1.6, "size": 240}],
    [15.6, "big", {"text": "[3 مليون] في اليوم", "size": 96, "sub": "حوالين الكوكب كله، تقريبًا"}],
    [19.0, "count", {"to": 3, "label": "الصوت بياخد حوالي", "unit": "ثواني لكل كيلو", "dur": 1.4, "size": 260}],
    [24.2, "big", {"text": "الثواني [÷ 3]", "size": 120, "sub": "= المسافة بينك وبين البرق بالكيلو"}],
    [27.4, "save", {"text": "احفظ الفيديو"}],
  ],
  items: [[0, "", "", ""], [3.2, "01", "28 ألف درجة", "أسخن من سطح الشمس"], [11.6, "02", "44 ضربة", "في كل ثانية"], [19.0, "03", "عدّ واقسم على 3", "تعرف بُعد البرق"], [27.4, "", "", ""]],
  // stickman host: [t, pose, mood, speech bubble]
  host: [[2.0, "wave", "big", "أهلًا!"], [3.2, "point", "smile", ""], [5.9, "shock", "o", "يا نهار!"], [7.4, "count", "o", "5 مرات؟!"], [10.2, "shrug", "flat", ""], [11.6, "think", "o", "كل ثانية؟"], [13.4, "shock", "o", "44!"], [15.6, "count", "smile", "3 مليون"], [19.0, "think", "smile", ""], [20.6, "count", "smile", "1… 2… 3"], [24.2, "point", "big", "÷ 3"], [27.4, "cheer", "big", "احفظه!"], [31.6, "wave", "big", "تابع تكّة"]],
  light: [[27.4, 99]],
  sfx: [[2.0, "hit"], [5.9, "ding"], [13.4, "ding"], [15.6, "hit"], [20.6, "ding"], [24.2, "hit"]],
};
// cold-open hook (hook.inject.html): the hero word's motion acts its meaning
window.HOOK = {"accent": "#FFE44D", "glow": "rgba(255,228,77,.4)", "streak": "rgba(255,245,170,.75)", "font": "Kufam", "feel": "shake", "l1": "ضربة البرق أسخن من", "big": "الشمس!", "l3": "…5 مرات", "tease": "وإزاي تعرف هو بعيد قد إيه؟", "bg": "#0A0D18"};

const DATA = window.DATA;
if (DATA.font === "kufam") document.body.classList.add("kufam");
if (DATA.lang === "en") { document.documentElement.setAttribute("dir", "ltr"); document.documentElement.lang = "en"; document.body.classList.add("en"); }
const VIDEO = { w: 1080, h: 1920, duration: DATA.duration };
window.VIDEO = VIDEO;
// Theme (DATA.theme): every page gets its own palette and background pattern, picked for its topic.
// Defaults are the original red-on-black look, so pages without a theme are unchanged.
const TH = Object.assign({ bg: "#141416", bg2: "", glow: "230,46,58", accent: "#E62E3A", onAccent: "#FFFFFF", card: "#1E1E22", card2: "#2A2A30", line: "#3A3A44",
  scene: "#17171B", text: DATA.wordlit ? "#F0E8D4" : "#FFFFFF", muted: "#B9B9C4", warn: "#3A1A1E", endBg: "#EDEBE6", endCard: "#F4F1EA", endInk: "#111111", endAccent: "", pattern: "", bokeh: null }, DATA.theme || {});
for (const [k, v] of Object.entries({ bg: TH.bg, accent: TH.accent, "on-accent": TH.onAccent, card: TH.card, card2: TH.card2, line: TH.line })) document.documentElement.style.setProperty("--" + k, v);
const RED = TH.accent, PAPER = TH.endAccent || TH.accent, BAD = "#E62E3A", Y = "#FFD23F", INK = "#0B0B10", W = TH.text; // RED = the theme accent; PAPER = accent on light paper
function spring(t, w = 16, z = .6) { if (t <= 0) return 0; const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eOut = x => 1 - Math.pow(1 - clamp(x), 4);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const $ = id => document.getElementById(id);
const typed = (s, t, t0, cps) => { const a = [...s]; return a.slice(0, Math.floor(clamp((t - t0) * cps, 0, a.length))).join(""); };
const kw = s => s.replace(/\[([^\]]+)\]/g, '<span class="kw">$1</span>');
const TYPE_TICKS = [];

// ---------- mini-scenes (lt = local time in the shot, d = shot duration, o = options) ----------
const SCENES = {
  // big typography inside the card
  big(lt, d, o) {
    const k = spring(lt, 15, .55);
    return `<div class="sc" style="background:${o.bg || TH.card}"></div>
      <div class="sc k" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:34px;color:${o.fg || W}">
       <div style="font-size:${o.size || 150}px;line-height:1.35;max-width:860px;text-align:center;white-space:normal;transform:scale(${lerp(1.5, 1, k).toFixed(3)});opacity:${clamp(lt / .08)}">${kw(o.text)}</div>
       ${o.sub ? `<div class="kr" style="font-size:44px;opacity:${clamp((lt - .35) / .2)};color:${o.subc || TH.muted}">${o.sub}</div>` : ""}</div>`;
  },
  // a shop front: awning, sign lights up, number slams
  store(lt, d, o) {
    const lit = eOut(seg(lt, .25, .5)), n = spring(lt - (o.numAt || .9), 16, .5);
    let aw = ""; for (let i = 0; i < 10; i++) aw += `<div style="position:absolute;top:120px;left:${150 + i * 64}px;width:64px;height:90px;background:${i % 2 ? "#fff" : RED};border-radius:0 0 32px 32px"></div>`;
    return `<div class="sc" style="background:linear-gradient(#2A1E1A,#1A1214)"></div>
      <div style="position:absolute;left:150px;right:150px;top:60px;height:70px;border-radius:14px;background:${lit > .5 ? Y : "#3A3A44"};box-shadow:0 0 ${(60 * lit).toFixed(0)}px rgba(255,210,63,.7);display:flex;align-items:center;justify-content:center" class="k"><span style="font-size:40px;color:${lit > .5 ? INK : "#777"}">${o.sign}</span></div>
      ${aw}
      <div style="position:absolute;left:190px;right:190px;top:230px;bottom:0;background:#3B2A24;border-radius:10px 10px 0 0"></div>
      <div style="position:absolute;left:250px;width:250px;top:280px;height:230px;border-radius:12px;background:rgba(255,230,180,${(.15 + .55 * lit).toFixed(2)})"></div>
      <div style="position:absolute;left:560px;width:130px;top:280px;bottom:0;border-radius:12px 12px 0 0;background:#24181A"></div>
      ${o.num ? `<div class="k" style="position:absolute;right:60px;top:200px;font-size:260px;color:${W};text-shadow:0 14px 0 ${RED};opacity:${clamp((lt - (o.numAt || .9)) / .05)};transform:scale(${lerp(2.2, 1, n).toFixed(3)}) rotate(-6deg)">${o.num}</div>` : ""}`;
  },
  // prompt typed into an input, then sent
  type(lt, d, o) {
    const txt = typed(o.text, lt, .25, o.cps || 18), done = lt > .25 + [...o.text].length / (o.cps || 18), press = done ? Math.exp(-(lt - .25 - [...o.text].length / (o.cps || 18)) * 8) : 0;
    return `<div class="sc" style="background:radial-gradient(circle at 50% 40%,${TH.card2},${TH.scene})"></div>
      <div class="k" style="position:absolute;right:56px;top:70px;font-size:34px;color:${TH.muted}">${o.label || "تكتب لـ Claude:"}</div>
      <div class="input" style="top:180px;min-height:300px;align-items:flex-start;padding-top:28px;line-height:1.55;white-space:normal">${txt}${done ? "" : `<span style="color:${TH.accent}">|</span>`}</div>
      <div class="send" style="left:72px;top:${180 + 300 - 100}px;transform:scale(${(1 + .3 * press).toFixed(3)})"><svg width="36" height="36" viewBox="0 0 34 34"><path d="M17,28 L17,7 M8,15 L17,6 L26,15" stroke="${TH.onAccent}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>`;
  },
  // a phone with posts sliding up
  posts(lt, d, o) {
    const cols = o.cols || ["#E62E3A", "#FFB020", "#2BD576"];
    let p = ""; cols.forEach((c, i) => {
      const k = spring(lt - .2 - i * .55, 13, .65); if (k <= 0) return;
      const heart = lt - .2 - i * .55 - .5, hk = heart > 0 ? spring(heart, 18, .4) : 0;
      p += `<div class="post" style="top:${30 + i * 168}px;height:150px;transform:translateY(${((1 - k) * 500).toFixed(0)}px)">
        <div style="position:absolute;right:0;top:0;bottom:0;width:120px;background:${c}"><svg width="120" height="150" viewBox="0 0 120 150"><circle cx="60" cy="62" r="26" fill="rgba(255,255,255,.75)"/><rect x="28" y="98" width="64" height="12" rx="6" fill="rgba(255,255,255,.75)"/></svg></div>
        <div style="position:absolute;left:14px;right:136px;top:26px;height:14px;border-radius:7px;background:#DDD"></div>
        <div style="position:absolute;left:44px;right:136px;top:54px;height:14px;border-radius:7px;background:#E8E8E8"></div>
        <div style="position:absolute;left:14px;top:96px;font-size:34px;color:${RED};transform:scale(${lerp(.2, 1, hk).toFixed(3)})">&#10084;</div>
        <div class="m" style="position:absolute;left:58px;top:102px;font-size:24px;color:#555">${Math.round(lerp(0, [128, 342, 517][i % 3], eOut(seg(heart, 0, 1.2))))}</div></div>`; });
    return `<div class="sc" style="background:radial-gradient(circle at 50% 60%,#3A2026,#17171B)"></div>
      <div class="phone" style="left:320px;top:60px;transform:rotate(${(-4 + Math.sin(lt * 1.5) * 1.5).toFixed(2)}deg)"><div style="position:absolute;left:105px;top:8px;width:74px;height:20px;border-radius:10px;background:#000"></div>${p}</div>
      ${o.tag ? `<div class="k" style="position:absolute;right:50px;top:${60}px;font-size:46px;color:${W};opacity:${clamp((lt - 1.4) / .15)}">${kw(o.tag)}</div>` : ""}`;
  },
  // a chat: incoming message, typing dots, reply typed, copy button
  msg(lt, d, o) {
    const inK = spring(lt - .15, 14, .6), replyT0 = 1.3;
    const r = lt < replyT0 ? "" : typed(o.reply, lt, replyT0, o.cps || 30), rDone = lt > replyT0 + [...o.reply].length / (o.cps || 30);
    const dots = lt > .7 && lt < replyT0 ? [0, 1, 2].map(i => `<span class="dot" style="transform:translateY(${(-Math.max(0, Math.sin(lt * 9 - i)) * 10).toFixed(1)}px)"></span>`).join("") : "";
    const cp = rDone ? lt - replyT0 - [...o.reply].length / (o.cps || 30) : -1;
    return `<div class="sc" style="background:${TH.scene}"></div>
      <div class="kr" style="position:absolute;left:0;right:0;top:0;height:86px;background:${TH.card2};display:flex;align-items:center;padding:0 40px;font-size:32px;color:${TH.muted}">${o.head || "رسايل العملاء"}</div>
      <div class="bub bin" style="top:${120 + (1 - inK) * 40}px;opacity:${clamp((lt - .15) / .1)}">${o.ask}</div>
      ${dots ? `<div class="bub bout" style="top:250px">${dots}</div>` : ""}
      ${r ? `<div class="bub bout" style="top:250px">${r}</div>` : ""}
      ${cp >= 0 ? `<div class="k" style="position:absolute;left:40px;bottom:36px;border-radius:24px;padding:10px 30px;font-size:34px;background:${cp > .35 ? "#2BD576" : RED};color:${cp > .35 ? "#fff" : TH.onAccent};transform:scale(${(1 + .25 * Math.exp(-Math.max(0, cp - .3) * 9) * (cp > .3 ? 1 : 0)).toFixed(3)})">${cp > .35 ? "اتنسخ ✓" : "نسخ"}</div>` : ""}`;
  },
  // a month grid filling day by day
  cal(lt, d, o) {
    const n = Math.floor(clamp((lt - .3) / (d - 1.0)) * 30), r = rng(5), cols = [RED, "#FFB020", "#2BD576", "#4C7DFF"];
    let g = ""; for (let i = 0; i < 30; i++) { const c = i % 6, row = Math.floor(i / 6), on = i < n, pop = on ? spring(lt - .3 - i / 30 * (d - 1.0), 18, .5) : 0; const col = cols[Math.floor(r() * 4)];
      g += `<div class="cell" style="right:${40 + c * 145}px;top:${120 + row * 108}px;width:130px;height:94px;background:${on ? col : TH.card2};transform:scale(${on ? lerp(.4, 1, pop).toFixed(3) : 1})"><span class="m" style="position:absolute;right:10px;top:6px;font-size:22px;color:${on ? "#fff" : "#55555F"}">${i + 1}</span>${on ? '<div style="position:absolute;left:12px;right:12px;bottom:14px;height:10px;border-radius:5px;background:rgba(255,255,255,.7)"></div>' : ""}</div>`; }
    return `<div class="sc" style="background:${TH.scene}"></div>
      <div class="k" style="position:absolute;right:44px;top:26px;font-size:40px;color:#fff">${o.title || "خطة الشهر"}</div>
      <div class="m" style="position:absolute;left:44px;top:34px;font-size:30px;color:${Y}">${n}/30</div>${g}`;
  },
  // a long page collapses into short bullets (summarise / CV / letter)
  doc(lt, d, o) {
    const fold = ease(seg(lt, o.foldAt || 1.2, (o.foldAt || 1.2) + .6)), r = rng(8);

// word-lit captions (kufam-kinetic-type): the line shows dim, each word lights in turn (0.2 s ease-out, rising 5 px),

function wordLit(text, lt, frame0, light) {
  const toks = []; text.replace(/\[([^\]]+)\]|([^\s\[\]]+)/g, (m, k, w) => { toks.push(k ? { w: k, key: true } : { w, key: false }); return m; });

    if (!o.key) return `<span style="display:inline-block;opacity:${op};transform:translateY(${y}px)">${o.w}</span>`;
    const p = frame0 ? 1 : 1 - Math.pow(1 - clamp((lt - keyAt) / .24), 3), pc = (p * 100).toFixed(1);

  }).join(" ");
}

<script>
/* HOOK v2 (0–2 s): a cold open placed over the first scene. The first line is on screen at frame 0 (the frame the
   feed shows), the hero word lands at 0.35 s, the punchline at 0.9 s, an open-loop tease at 1.3 s, then the panel
   bursts away at 1.75 s into the page's own opening.
   The hero word's motion acts its meaning (H.feel, after the kufam-kinetic-type rule "the motion is the feeling"):
     slam   default: big overshoot + camera shake
     brake  «استنى!»: everything is racing, the word lands and the whole frame freezes dead
     reveal «مستخبية»: the word is there from frame 0 but blurred and dim; a light sweep uncovers it
     glitch «بيهنّج»: the word arrives in stutters, with jitter and colour split
     shake  danger: slam, then an angry decaying shake, red glow, cracks under the word
     count  a number: counts up from 0 as it lands
   Sound: real samples when the page has them (window.loadSfx: reverse whoosh sucked into the hit, impact on the
   frame, whoosh peak on the burst), else a small synthesized fallback.
   Wraps window.seek / window.buildAudio; the rest of the page is untouched. */
(function () {
  const H = window.HOOK, FEEL = H.feel || "slam";
  const FONT = H.font || "Kufi", DIR = H.dir || "rtl", CREAM = "#F0E8D4";
  const root = document.createElement("div");
  root.id = "hook";
  root.style.cssText = "position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:0";
  const line = (id, top, size, color, weight, side) => `<div id="${id}" style="position:absolute;left:${side}px;right:${side}px;top:${top}px;text-align:center;font-family:${FONT},sans-serif;direction:${DIR};font-weight:${weight};font-size:${size}px;color:${color};white-space:nowrap;line-height:1.5"></div>`;
  const Y3 = H.y3 || 990;
  root.innerHTML = `<canvas id="hookFx" width="1080" height="1920" style="position:absolute;inset:0"></canvas>` +
    line("hk1", 560, H.s1 || 74, CREAM, 700, 60) + line("hk2", 680, H.s2 || 190, H.accent, 900, 30) +
    line("hk3", Y3, H.s3 || 76, CREAM, 700, 60) + line("hk4", Y3 + 170, 50, "#FFD23F", 700, 60);
  const stage = document.getElementById("stage");
  stage.insertBefore(root, document.getElementById("vig"));
  const $h = id => document.getElementById(id);
  $h("hk1").textContent = H.l1; $h("hk2").textContent = H.big; $h("hk3").textContent = H.l3; $h("hk4").textContent = H.tease;
  const fx = $h("hookFx").getContext("2d");
  const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const sp = (t, w = 17, z = .5) => { if (t <= 0) return 0; const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); };
  const lp = (a, b, k) => a + (b - a) * k;
  const eo = x => 1 - Math.pow(1 - cl(x), 3);
  let seed = 99; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const streaks = []; for (let i = 0; i < 90; i++) streaks.push({ ang: rnd() * Math.PI * 2, d: rnd(), sp: .6 + rnd() * 1.4, w: 2 + rnd() * 5 });
  const bokeh = []; for (let i = 0; i < 9; i++) bokeh.push({ x: 80 + rnd() * 920, y: 200 + rnd() * 1500, r: 70 + rnd() * 110, ph: rnd() * 6.28, sp: .4 + rnd() * .5, c: i % 3 });
  const jit = []; for (let i = 0; i < 24; i++) jit.push([rnd() > .45 ? (rnd() - .5) * 46 : 0, rnd() > .6 ? (rnd() - .5) * 10 : 0, rnd() > .5]);
  const cracks = []; for (let i = 0; i < 7; i++) { const a = Math.PI * (.08 + .84 * i / 6) + (rnd() - .5) * .2, pts = [[0, 0]]; let r = 0; for (let j = 0; j < 5; j++) { r += 50 + rnd() * 70; pts.push([Math.cos(a + (rnd() - .5) * .5) * r, Math.sin(a + (rnd() - .5) * .5) * r * .55]); } cracks.push(pts); }
  const NUM = FEEL === "count" ? Number(String(H.big).replace(/[^0-9.]/g, "")) : 0;
  const T2 = .35, T3 = .9, T4 = 1.3, OUT = 1.75, END = 2.0;
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

  function hookSeek(t) {
    if (t >= END) { root.style.opacity = 0; return; }
    const out = cl((t - OUT) / (END - OUT)), oe = out * out, d2 = t - T2;
    root.style.opacity = 1 - oe;
    root.style.transform = `scale(${1 + oe * .9})`;
    root.style.background = H.bg || "#0B0B10";
    fx.clearRect(0, 0, 1080, 1920);
    // glow + soft bokeh
    const g = fx.createRadialGradient(540, 820, 30, 540, 820, 1000); g.addColorStop(0, H.glow); g.addColorStop(1, "rgba(11,11,16,0)");
    fx.fillStyle = g; fx.fillRect(0, 0, 1080, 1920);
    for (const b of bokeh) {
      const x = b.x + Math.sin(t * b.sp + b.ph) * 30, y = b.y + Math.cos(t * b.sp * .8 + b.ph) * 22, col = [H.accent, "#FFBE50", "#5AAAA0"][b.c];
      const bg = fx.createRadialGradient(x, y, 0, x, y, b.r); bg.addColorStop(0, rgba(col, .16)); bg.addColorStop(1, rgba(col, 0));
      fx.fillStyle = bg; fx.fillRect(x - b.r, y - b.r, b.r * 2, b.r * 2);
    }
    // radial streaks: travel is the integral of speed, so "brake" can freeze them dead on the hit
    let travel, speed;
    if (FEEL === "brake") { travel = 2.4 * Math.min(t, T2); speed = t < T2 ? 2.4 : 0; }
    else if (FEEL === "reveal") { travel = .25 * t; speed = .25; }
    else { travel = t < T2 ? .35 * t : .35 * T2 + (t - T2) + (2.5 / 3) * (1 - Math.exp(-(t - T2) * 3)); speed = t < T2 ? .35 : 1 + 2.5 * Math.exp(-(t - T2) * 3); }
    fx.strokeStyle = H.streak; fx.lineCap = "round";
    for (const s of streaks) {
      const r0 = ((s.d + travel * s.sp * .9) % 1) * 1300 + 60, len = 60 + 260 * Math.max(speed, .15) * s.d;
      fx.globalAlpha = (FEEL === "reveal" ? .3 : .55) * cl(r0 / 300); fx.lineWidth = s.w;
      fx.beginPath(); fx.moveTo(540 + Math.cos(s.ang) * r0, 820 + Math.sin(s.ang) * r0); fx.lineTo(540 + Math.cos(s.ang) * (r0 + len), 820 + Math.sin(s.ang) * (r0 + len)); fx.stroke();
    }
    fx.globalAlpha = 1;
    if (FEEL === "reveal") { // a cone of light sweeps across and uncovers the word
      const k = eo((t - T2 + .12) / .5), cx = lp(1300, 540, k);
      fx.save(); fx.globalAlpha = .22 * cl((t - T2 + .12) / .1); fx.fillStyle = CREAM; fx.beginPath(); fx.moveTo(cx - 60, -40); fx.lineTo(cx + 60, -40); fx.lineTo(cx + 420, 1000); fx.lineTo(cx - 420, 1000); fx.closePath(); fx.filter = "blur(24px)"; fx.fill(); fx.restore();
    } else if (d2 >= 0 && d2 < .6) { // shockwave + flash on the hit
      fx.strokeStyle = H.accent; fx.lineWidth = 26 * (1 - d2 / .6); fx.globalAlpha = 1 - d2 / .6; fx.beginPath(); fx.arc(540, 820, 80 + d2 * 1400, 0, Math.PI * 2); fx.stroke(); fx.globalAlpha = 1;
      if (d2 < .18) { fx.fillStyle = `rgba(255,255,255,${(.5 * (1 - d2 / .18)).toFixed(3)})`; fx.fillRect(0, 0, 1080, 1920); }
    }
    if (FEEL === "brake" && d2 >= 0) { // two hard bars lock the word in place
      const k = eo(d2 / .12); fx.fillStyle = H.accent2 || "#E62E3A";
      fx.fillRect(540 - 430 * k, 708, 860 * k, 12); fx.fillRect(540 - 430 * k, 948, 860 * k, 12);
    }
    if (FEEL === "shake" && d2 >= 0) { // cracks under the word
      const k = eo(d2 / .25); fx.strokeStyle = rgba("#E62E3A", .85); fx.lineWidth = 6; fx.lineJoin = "round";
      for (const c of cracks) { fx.beginPath(); c.forEach(([x, y], i) => { const px = 540 + x * k, py = 960 + y * k; if (i) fx.lineTo(px, py); else fx.moveTo(px, py); }); fx.stroke(); }
    }
    const hit = FEEL !== "reveal" && d2 >= 0 && d2 < .5 ? Math.exp(-d2 * (FEEL === "brake" ? 22 : 8)) * 22 * Math.sin(d2 * 75) : 0;
    // line 1: readable on frame 0
    const k1 = sp(t + .12, 14, .6);
    $h("hk1").style.transform = `translate(${hit * .4}px,${(1 - k1) * 30}px) scale(${lp(1.12, 1, k1)})`; $h("hk1").style.opacity = 1;
    // the hero word
    const w = $h("hk2"), st = w.style;
    let tf, op = d2 >= 0 ? cl(d2 / .05) : 0, shadow = "0 14px 0 rgba(0,0,0,.5)", filter = "none";
    if (FEEL === "brake") { const k = sp(d2, 30, .92); tf = `translate(${hit}px,0) scale(${lp(2.6, 1, k)})`; }
    else if (FEEL === "reveal") { const k = eo((t - T2) / .35); op = lp(.22, 1, k); filter = k < 1 ? `blur(${((1 - k) * 22).toFixed(1)}px)` : "none"; tf = `scale(${lp(1.1, 1, k)})`; }
    else if (FEEL === "glitch") {
      const dq = Math.floor(Math.max(0, d2) / .11) * .11, k = sp(d2 < .66 ? dq : d2), q = Math.floor(Math.max(0, d2) / .08), j = d2 >= 0 && d2 < 1.15 ? jit[q % jit.length] : [0, 0, false];
      tf = `translate(${j[0]}px,0) skewX(${j[1]}deg) scale(${lp(1.3, 1, k)})`;
      if (j[2] && d2 >= 0 && d2 < 1.15) shadow = "10px 0 #2EF2FF,-10px 0 #E62E3A,0 14px 0 rgba(0,0,0,.5)";
      if (d2 >= 0 && d2 < 1.15 && q % 5 === 3) op = .55;
    }
    else if (FEEL === "shake") { const k = sp(d2), sh = d2 >= 0 ? Math.sin(d2 * 62) * 9 * Math.exp(-d2 * 2.2) : 0; tf = `translate(${hit + sh}px,${sh * .4}px) scale(${lp(2.1, 1, k)}) rotate(${(lp(-6, -2, k) + sh * .12).toFixed(2)}deg)`; shadow = `0 0 ${(40 * Math.exp(-Math.max(0, d2) * 1.2)).toFixed(0)}px #E62E3A,0 14px 0 rgba(0,0,0,.5)`; }
    else { const k = sp(d2); tf = `translate(${hit}px,${hit * .5}px) scale(${lp(2.1, 1, k)}) rotate(${lp(-6, -2, k).toFixed(2)}deg)`; if (d2 >= 0 && d2 < .3) shadow = "9px 0 #2EF2FF,-9px 0 #E62E3A,0 14px 0 rgba(0,0,0,.5)"; }
    if (FEEL === "count") { const v = Math.round(NUM * eo(d2 / .5)).toLocaleString("en-US"), txt = String(H.big).replace(/[0-9][0-9,.]*/, v); if (w._t !== txt) { w.textContent = txt; w._t = txt; } }
    st.opacity = op; st.transform = tf; st.textShadow = shadow; st.filter = filter;
    // punchline + tease
    const d3 = t - T3, k3 = sp(d3, 16, .6);
    $h("hk3").style.opacity = d3 >= 0 ? cl(d3 / .08) : 0; $h("hk3").style.transform = `translateY(${(1 - k3) * 50}px)`;
    const d4 = t - T4;
    $h("hk4").style.opacity = d4 >= 0 ? cl(d4 / .08) * (Math.floor(t * 8) % 2 ? 1 : .55) : 0;
  }
  const s0 = window.seek;
  window.seek = t => { s0(t); hookSeek(t); };

  const a0 = window.buildAudio;
  window.buildAudio = async ctx => {
    if (a0) await a0(ctx);
    const m = ctx.createGain(); m.gain.value = .7; m.connect(ctx.destination);
    const SB = window.loadSfx ? await window.loadSfx(ctx) : {};
    if (SB.es_impact) {
      // at = the moment the sample's peak (or onset) must land on; off = skip into the sample
      const smp = (k, at, g, peak = 0, off = 0, rate = 1) => { const b = SB[k]; if (!b) return; const s = ctx.createBufferSource(), gn = ctx.createGain(); s.buffer = b; s.playbackRate.value = rate; gn.gain.value = g; s.connect(gn); gn.connect(m); s.start(Math.max(0, at - peak / rate), off); };
      smp("es_tok", 0, .5);                                   // frame 0
      if (FEEL !== "reveal") smp("es_rev", 0, .5, 0, .705 - T2); // reverse whoosh, its peak on the hit
      if (FEEL === "reveal") smp("es_whoosh", T2 + .1, .45, .354);
      else smp("es_impact", T2, FEEL === "brake" ? 1 : .85, .117);
      if (FEEL === "shake") smp("es_hit", T2 + .16, .6, .058);
      if (FEEL === "glitch") smp("es_glitch", T2 + .05, .5);
      if (FEEL === "count") for (let i = 0; i < 9; i++) smp("es_tick", T2 + .04 + i * .05, .35, 0, 0, .9 + i * .03);
      smp("ui_snap", T3, .5);
      smp("ui_select", T4, .4);
      smp("es_whoosh", 1.9, .6, .354);                        // the burst into the page: whoosh peak just before the cut
    } else {
      const sr = ctx.sampleRate, nb = ctx.createBuffer(1, sr, sr), d = nb.getChannelData(0); let s = 7; for (let i = 0; i < d.length; i++) d[i] = ((s = (s * 16807) % 2147483647) / 2147483647) * 2 - 1;
      const env = (g, t0, a, p, dec) => { g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(p, t0 + a); g.gain.exponentialRampToValueAtTime(.0001, t0 + a + dec); };
      const osc = (type, f, t0, dur, p, fEnd) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0); if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t0 + dur); env(g, t0, .003, p, dur); o.connect(g); g.connect(m); o.start(t0); o.stop(t0 + dur + .05); };
      const nz = (t0, dur, p, type, f0, f1, q = 1) => { const src = ctx.createBufferSource(), b = ctx.createBiquadFilter(), g = ctx.createGain(); src.buffer = nb; b.type = type; b.Q.value = q; b.frequency.setValueAtTime(f0, t0); if (f1) b.frequency.exponentialRampToValueAtTime(f1, t0 + dur); env(g, t0, .004, p, dur); src.connect(b); b.connect(g); g.connect(m); src.start(t0); src.stop(t0 + dur + .05); };
      osc("sine", 120, 0, .45, .55, 38); nz(0, .2, .25, "highpass", 3000);
      osc("sine", 70, T2, 1.1, .9, 24); nz(T2, .5, .45, "lowpass", 5000, 150, .7); osc("sawtooth", 880, T2, .18, .08, 110);
      osc("sine", 160, T3, .25, .45, 50); nz(T3, .06, .2, "bandpass", 2500, null, 2);
      osc("triangle", 1568, T4, .1, .1); osc("triangle", 2093, T4 + .08, .1, .07);
      nz(OUT - .25, .5, .3, "bandpass", 400, 7000, 2);
    }
  };
})();
</script>
</body>
</html>
