<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Your Brain in 24 Hours</title>
<style>
/*@FONTS@*/
html,body{margin:0;background:#0B0B10;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#0B0B10;transform-origin:0 0}
.layer{position:absolute;inset:0}
.abs{position:absolute;white-space:nowrap}
.c{left:0;right:0;text-align:center}
.kufi{font-family:"Kufam",sans-serif}
.kufi{padding:40px 0}
.mono{font-family:"Mono",monospace;direction:ltr}
#hud{position:absolute;inset:0;pointer-events:none;color:#fff;opacity:.5;font-size:24px}
#hud .br{position:absolute;width:56px;height:56px;border-color:#fff;border-style:solid;opacity:.8}
#grain,#vig{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%)}
canvas{position:absolute;left:0;top:0}
#ui{position:fixed;left:8px;bottom:8px;z-index:9;font:14px sans-serif;color:#fff;direction:ltr}
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <svg id="art" class="layer" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="txt" class="layer"></div>
  <div id="vig"></div>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="hud">
    <div class="br" style="left:48px;top:150px;border-width:3px 0 0 3px"></div>
    <div class="br" style="right:48px;top:150px;border-width:3px 3px 0 0"></div>
    <div class="br" style="left:48px;bottom:330px;border-width:0 0 3px 3px"></div>
    <div class="br" style="right:48px;bottom:330px;border-width:0 3px 3px 0"></div>
    <div id="hudScene" class="abs mono" style="right:120px;top:166px"></div>
    <div id="hudCat" class="abs mono" style="left:120px;bottom:346px"></div>
    <div id="hudTc" class="abs mono" style="right:120px;bottom:346px"></div>
  </div>
</div>
<div id="ui"></div>
<script>
/* Beat sheet — 120 BPM (beat = 0.5 s), 33 s, 9:16. Same grammar as «جسمك في 24 ساعة»: one idea, a big number
   counting up per scene, every scene morphs into the next. Facts checked (WebSearch) — sources in the description.
 0.00  spark: a cyan dot fires, dendrites grow out of it into a branching neuron     | zap x2
 1.00  branches spread to the frame edges (BRAIN / 24H)                              | riser 1.0→2.0
 1.75  the neuron's glow floods the screen violet                                     | impact 2.0
 2.00  title slam «دماغك» + «لا يتوقّف لحظة», kicker                                 | kick+clap start
 4.25  dark disc grows from the centre → scene 3                                      | whoosh 4.5
 4.50  NEURONS: firing network, count 0→86,000,000,000 «خلية عصبية»                   | zaps on beats
 8.75  cream bar wipes up                                                             | whoosh 9.0
 9.00  THOUGHTS: bubbles pop across the screen, count 0→6,200 «فكرة كل يوم»          | pops
12.75  bubbles merge into one dot that becomes the signal pulse                      | whoosh 13.0
13.00  SPEED (blue): a pulse races along an axon, speedometer, 0→430 «كم/ساعة»       | zips, impact 16.9
17.00  ENERGY (yellow): battery fills to 20 % «من طاقة جسمك», slam «ووزنه 2% فقط!» | impact 19.5
21.50  POWER: a light bulb lights, count 0→20 «واط فقط»                              | hum
25.50  DREAMS: night sky, moon, clock ring sweeps, 0→120 «دقيقة من الأحلام»         | bells
29.50  END: «وكل هذا…» «داخل رأسك!» + follow + sources note                          | riser, ring-out
*/
const VIDEO = { w: 1080, h: 1920, duration: 33 };
window.VIDEO = VIDEO;
const BEAT = 0.5;
const INK = "#0B0B10", VIO = "#5B2EFF", CYAN = "#2EF2FF", CREAM = "#EDEBE4", BLUE = "#2F47FF", YEL = "#FFD23F", RED = "#E8323C", NAVY = "#0E1638", WHITE = "#FFFFFF";

function spring(t, w = 14, z = 0.82) { if (t <= 0) return 0; if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t); const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 4);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const fmt = n => Math.round(n).toLocaleString("en-US");
const pulse = (t, period, w = 18) => { const k = ((t % period) + period) % period; return Math.exp(-w * k); };

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const bg = $("bg"), art = $("art"), txt = $("txt"), fx = $("fx").getContext("2d");
function el(tag, cls, html, parent = txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; }
function svg(tag, attrs, parent = art) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }

const T = {};
T.kick = el("div", "abs c kufi"); T.big = el("div", "abs c kufi"); T.sub = el("div", "abs c kufi");
T.label = el("div", "abs c kufi"); T.num = el("div", "abs c kufi"); T.unit = el("div", "abs c kufi");
T.extra = el("div", "abs c kufi"); T.note = el("div", "abs c kufi"); T.label2 = el("div", "abs mono");
for (const k in T) Object.assign(T[k].style, { opacity: 0 });

// ---------- S1: neuron growing from a spark (baked branch tree) ----------
const tree = (() => { const r = rng(12), segs = []; function grow(x, y, ang, len, depth, t0) { if (depth > 6 || len < 18) return; const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len; segs.push({ x, y, x2, y2, t0, d: depth }); const n = depth < 2 ? 3 : 2; for (let i = 0; i < n; i++) grow(x2, y2, ang + (r() - .5) * 1.3, len * (.68 + r() * .2), depth + 1, t0 + .09); } for (let i = 0; i < 7; i++) grow(540, 960, i / 7 * Math.PI * 2 + r() * .4, 120 + r() * 40, 0, 1.0 + i * .02); return segs; })();
const treeG = svg("g", { opacity: 0 });
const treeL = tree.map(s => svg("line", { x1: s.x, y1: s.y, x2: s.x, y2: s.y, stroke: CYAN, "stroke-width": Math.max(2, 12 - s.d * 1.7), "stroke-linecap": "round" }, treeG));
const soma = svg("circle", { cx: 540, cy: 960, r: 0, fill: CYAN });
const somaGlow = svg("circle", { cx: 540, cy: 960, r: 0, fill: CYAN, opacity: .25 });
const flood = svg("circle", { cx: 540, cy: 960, r: 0, fill: VIO });
const disc = svg("circle", { cx: 540, cy: 960, r: 0, fill: INK });

// ---------- S3: neuron network ----------
const nodes = (() => { const r = rng(5), a = []; for (let i = 0; i < 46; i++) a.push({ x: 90 + r() * 900, y: 280 + r() * 700, s: 6 + r() * 10, ph: r() }); return a; })();
const edges = (() => { const a = []; nodes.forEach((n, i) => { const near = nodes.map((m, j) => [j, (m.x - n.x) ** 2 + (m.y - n.y) ** 2]).filter(([j]) => j > i).sort((p, q) => p[1] - q[1]).slice(0, 2); near.forEach(([j]) => a.push([i, j])); }); return a; })();

// ---------- S5: axon + speedometer ----------
const axonG = svg("g", { opacity: 0 });
const axon = svg("path", { d: "", fill: "none", stroke: WHITE, "stroke-opacity": .35, "stroke-width": 16, "stroke-linecap": "round" }, axonG);
const myelin = [0, 1, 2, 3, 4, 5].map(() => svg("rect", { width: 120, height: 40, rx: 20, fill: WHITE, opacity: .9 }, axonG));
const spark = svg("circle", { r: 26, fill: YEL }, axonG);
const sparkGlow = svg("circle", { r: 70, fill: YEL, opacity: .3 }, axonG);
const gauge = svg("g", { opacity: 0 });
svg("path", { d: "M-260,0 A260,260 0 0 1 260,0", fill: "none", stroke: WHITE, "stroke-opacity": .25, "stroke-width": 26, "stroke-linecap": "round" }, gauge);
const gaugeArc = svg("path", { d: "", fill: "none", stroke: YEL, "stroke-width": 26, "stroke-linecap": "round" }, gauge);
const needle = svg("line", { x1: 0, y1: 0, x2: -220, y2: 0, stroke: WHITE, "stroke-width": 12, "stroke-linecap": "round" }, gauge);
svg("circle", { r: 26, fill: WHITE }, gauge);
const blackout = svg("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: INK, opacity: 0 });

// ---------- S6: battery ----------
const batG = svg("g", { opacity: 0 });
svg("rect", { x: 300, y: 380, width: 480, height: 640, rx: 60, fill: "none", stroke: INK, "stroke-width": 22 }, batG);
svg("rect", { x: 450, y: 330, width: 180, height: 56, rx: 18, fill: INK }, batG);
const batFill = svg("rect", { x: 330, y: 990, width: 420, height: 0, rx: 34, fill: INK }, batG);
const batBolt = svg("path", { d: "M560,520 L470,720 L540,720 L500,880 L620,650 L550,650 Z", fill: YEL, stroke: INK, "stroke-width": 10, "stroke-linejoin": "round" }, batG);

// ---------- S7: light bulb ----------
const bulbG = svg("g", { opacity: 0 });
const bulbHalo = svg("circle", { cx: 540, cy: 640, r: 260, fill: YEL, opacity: 0 }, bulbG);
const bulb = svg("path", { d: "M540,420 C420,420 360,510 360,600 C360,690 430,730 450,800 L630,800 C650,730 720,690 720,600 C720,510 660,420 540,420 Z", fill: "#2A2A36", stroke: CREAM, "stroke-width": 12 }, bulbG);
const filament = svg("path", { d: "M480,800 L480,690 Q510,640 540,690 Q570,640 600,690 L600,800", fill: "none", stroke: CREAM, "stroke-width": 9, "stroke-linecap": "round" }, bulbG);
svg("rect", { x: 455, y: 800, width: 170, height: 34, rx: 8, fill: CREAM }, bulbG);
svg("rect", { x: 465, y: 840, width: 150, height: 30, rx: 8, fill: CREAM }, bulbG);
svg("rect", { x: 490, y: 876, width: 100, height: 30, rx: 12, fill: CREAM }, bulbG);
const bulbRays = [0, 1, 2, 3, 4, 5, 6, 7].map(() => svg("line", { stroke: YEL, "stroke-width": 14, "stroke-linecap": "round", opacity: 0 }, bulbG));

// ---------- S8: night sky + moon + clock ring ----------
const nightG = svg("g", { opacity: 0 });
const stars = (() => { const r = rng(17), a = []; for (let i = 0; i < 70; i++) a.push(svg("circle", { cx: r() * 1080, cy: 160 + r() * 1100, r: 1.5 + r() * 3, fill: WHITE }, nightG)); return a; })();
const clockBg = svg("circle", { cx: 540, cy: 680, r: 250, fill: "none", stroke: WHITE, "stroke-opacity": .18, "stroke-width": 22 }, nightG);
const clockArc = svg("path", { d: "", fill: "none", stroke: "#B9A8FF", "stroke-width": 22, "stroke-linecap": "round" }, nightG);
const moon = svg("g", {}, nightG); svg("circle", { cx: 0, cy: 0, r: 130, fill: CREAM }, moon); svg("circle", { cx: 58, cy: -40, r: 112, fill: NAVY }, moon);
const zzz = [0, 1, 2].map(i => { const e = svg("text", { "font-family": "Mono", "font-size": 64 - i * 12, fill: "#B9A8FF", opacity: 0 }, nightG); e.textContent = "z"; return e; });

const rule = svg("line", { x1: 540, x2: 540, y1: 1060, y2: 1060, stroke: INK, "stroke-width": 4 });

// ---------- grain ----------
const grainTiles = (() => { const r = rng(3), tiles = []; for (let n = 0; n < 4; n++) { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"), im = g.createImageData(256, 256); for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 14; } g.putImageData(im, 0, 0); tiles.push(c); } return tiles; })();
const gctx = $("grain").getContext("2d");

// ---------- helpers ----------
function show(node, text, style, a) { if (text != null && node._t !== text) { node.textContent = text; node._t = text; } Object.assign(node.style, style); node.style.opacity = a; }
function slamIn(t, t0) { const k = spring(t - t0, 16, .62); return { s: lerp(1.35, 1, k), a: clamp((t - t0) / .12), y: (1 - k) * 40 }; }
function maskRTL(node, t, t0, d) { const k = ease(seg(t, t0, t0 + d)); node.style.clipPath = `inset(0 ${(1 - k) * 100}% 0 0)`; } // LTR wipe (name kept)
function countBlock(t, t0, t1, to, label, unit, color, labelColor, numSize = 176, suffix = "") {
  const inA = clamp((t - t0) / .25), outA = 1 - clamp((t - (t1 - .35)) / .3), a = Math.min(inA, outA);
  const k = easeOut(seg(t, t0 + .25, t0 + 2.6)), landed = t > t0 + 2.6;
  const blur = landed ? 0 : (1 - k) * 6 * (k > 0 ? 1 : 0);
  const pop = landed ? 1 + 0.08 * Math.exp(-10 * (t - t0 - 2.6)) * Math.cos(28 * (t - t0 - 2.6)) : 1;
  const l = slamIn(t, t0 + .05);
  show(T.label, label, { top: "1060px", fontSize: "62px", fontWeight: 700, color: labelColor, transform: `translateY(${l.y}px)` }, a);
  show(T.num, fmt(lerp(0, to, k)) + suffix, { top: "1130px", fontSize: numSize + "px", fontWeight: 700, color, letterSpacing: "2px", filter: blur > .3 ? `blur(${blur.toFixed(1)}px)` : "none", transform: `scale(${pop})`, direction: "ltr" }, a);
  const u = slamIn(t, t0 + 2.6);
  show(T.unit, unit, { top: "1380px", fontSize: "66px", fontWeight: 700, color: labelColor, transform: `translateY(${u.y}px) scale(${u.s})` }, Math.min(a, u.a));
  return { a, k };
}
function hide(...n) { for (const x of n) x.style.opacity = 0; }
const SCENES = [[0, "01", "SPARK"], [2, "02", "TITLE"], [4.5, "03", "NEURONS"], [9, "04", "THOUGHTS"], [13, "05", "SPEED"], [17, "06", "ENERGY"], [21.5, "07", "POWER"], [25.5, "08", "DREAMS"], [29.5, "09", "END"]];
const arcPath = (cx, cy, r, a0, a1) => { const p = []; for (let i = 0; i <= 60; i++) { const a = lerp(a0, a1, i / 60); p.push(`${(cx + Math.cos(a) * r).toFixed(1)},${(cy + Math.sin(a) * r).toFixed(1)}`); } return "M" + p.join(" L"); };

// ---------- seek ----------
function seek(t) {
  t = clamp(t, 0, VIDEO.duration - 1e-6);
  const sc = [...SCENES].reverse().find(s => t >= s[0]);
  $("hudScene").textContent = `SCENE ${sc[1]} / 09`;
  $("hudCat").textContent = `BRAIN / 24H — ${sc[2]}`;
  const fr = Math.floor(t * 30) % 30, ss = Math.floor(t);
  $("hudTc").innerHTML = `<span style="color:${CYAN}">●</span> 00:00:${String(ss).padStart(2, "0")}:${String(fr).padStart(2, "0")}`;
  $("hud").style.color = (t >= 9 && t < 13) || (t >= 17 && t < 21.5) || t >= 29.5 ? INK : WHITE;
  hide(...Object.values(T));
  for (const k in T) { T[k].style.filter = "none"; T[k].style.clipPath = "none"; T[k].style.transform = "none"; T[k].style.textShadow = "none"; }

  let base = INK;
  if (t >= 2 && t < 4.5) base = VIO;
  if (t >= 9 && t < 13) base = CREAM;
  if (t >= 13 && t < 17) base = BLUE;
  if (t >= 17 && t < 21.5) base = YEL;
  if (t >= 25.5 && t < 29.5) base = NAVY;
  if (t >= 29.5) base = CREAM;
  bg.style.background = base;
  fx.clearRect(0, 0, 1080, 1920);

  // ---- S1 spark → neuron → violet flood (0–2)
  if (t < 2) {
    const d = spring(t - .15, 18, .55) * (1 + 0.4 * pulse(t - .5, .5, 14) * (t < 1.1 ? 1 : 0));
    soma.setAttribute("r", (24 * d).toFixed(2)); somaGlow.setAttribute("r", (70 * d * (1 + .4 * pulse(t - .5, .5, 10))).toFixed(1));
    treeG.setAttribute("opacity", 1);
    tree.forEach((s, i) => { const k = easeOut(seg(t, s.t0, s.t0 + .14)); treeL[i].setAttribute("opacity", k > 0 ? 1 : 0); treeL[i].setAttribute("x2", lerp(s.x, s.x2, k)); treeL[i].setAttribute("y2", lerp(s.y, s.y2, k)); });
    const fl = ease(seg(t, 1.72, 2.0));
    flood.setAttribute("r", (1200 * fl).toFixed(1));
    show(T.label2, "BRAIN / 24H", { top: "1010px", left: "60px", fontSize: "28px", color: WHITE }, clamp((t - 1.2) / .2) * (1 - fl));
  } else { soma.setAttribute("r", 0); somaGlow.setAttribute("r", 0); treeG.setAttribute("opacity", 0); flood.setAttribute("r", 0); }

  // ---- S2 title (2–4.5)
  if (t >= 2 && t < 4.75) {
    const out = seg(t, 4.2, 4.5);
    const k1 = slamIn(t, 2.05);
    show(T.kick, "In just one day…", { top: "620px", fontSize: "58px", fontWeight: 700, color: CREAM, transform: `translateY(${k1.y}px)` }, k1.a * (1 - out));
    const b = slamIn(t, 2.5);
    show(T.big, "Your Brain", { top: "670px", fontSize: "176px", fontWeight: 700, color: WHITE, transform: `scale(${b.s})`, lineHeight: "1.5" }, b.a * (1 - out));
    maskRTL(T.big, t, 2.5, .45);
    const s = slamIn(t, 3.0);
    show(T.sub, "never stops. Not once.", { top: "1180px", fontSize: "84px", fontWeight: 700, color: CYAN, transform: `translateY(${s.y}px)` }, s.a * (1 - out));
    maskRTL(T.sub, t, 3.0, .4);
    disc.setAttribute("r", (1200 * ease(seg(t, 4.15, 4.5))).toFixed(1));
  } else disc.setAttribute("r", 0);

  // ---- S3 neurons (4.5–9): firing network drawn on canvas
  if (t >= 4.5 && t < 9.05) {
    const a = clamp((t - 4.5) / .3);
    const grow = easeOut(seg(t, 4.55, 6.0));
    fx.save(); fx.globalAlpha = a;
    edges.forEach(([i, j], n) => { const A = nodes[i], B = nodes[j], k = clamp(grow * 1.6 - n / edges.length * .6); if (k <= 0) return; fx.strokeStyle = "rgba(46,242,255,.35)"; fx.lineWidth = 3; fx.beginPath(); fx.moveTo(A.x, A.y); fx.lineTo(lerp(A.x, B.x, k), lerp(A.y, B.y, k)); fx.stroke();
      const ph = ((t * .9 + n * .37) % 1); if (k >= 1) { fx.fillStyle = YEL; fx.beginPath(); fx.arc(lerp(A.x, B.x, ph), lerp(A.y, B.y, ph), 6, 0, Math.PI * 2); fx.fill(); } });
    nodes.forEach((n, i) => { const k = spring(t - 4.55 - n.ph * .8, 14, .6); if (k <= 0) return; const fire = pulse(t - 4.5 - n.ph * .5, BEAT, 9); fx.fillStyle = `rgba(46,242,255,${(.25 * fire).toFixed(3)})`; fx.beginPath(); fx.arc(n.x, n.y, n.s * 3.2 * k, 0, Math.PI * 2); fx.fill(); fx.fillStyle = fire > .5 ? WHITE : CYAN; fx.beginPath(); fx.arc(n.x, n.y, n.s * k, 0, Math.PI * 2); fx.fill(); });
    fx.restore();
    countBlock(t, 4.6, 9, 86000000000, "Your brain holds about", "nerve cells", WHITE, CREAM, 112);
  }
  // wipe into cream
  if (t >= 8.7 && t < 9.1) { const w = ease(seg(t, 8.7, 9.0)); fx.fillStyle = CREAM; fx.fillRect(0, 1920 - 1920 * w, 1080, 1920 * w); }

  // ---- S4 thoughts (9–13): bubbles pop, then merge into one dot
  if (t >= 9 && t < 13.05) {
    const r = rng(41), merge = ease(seg(t, 12.5, 12.95));
    for (let i = 0; i < 34; i++) {
      const x = 110 + r() * 860, y = 260 + r() * 680, born = 9.15 + r() * 3.0, size = 30 + r() * 60, col = [VIO, BLUE, RED, "#1B1B24"][i % 4];
      const life = t - born; if (life < 0) continue;
      const k = spring(life, 15, .5), fade = life > 1.4 ? 1 - seg(life, 1.4, 1.6) : 1;
      if (fade <= 0 && merge <= 0) continue;
      const X = lerp(x, 540, merge), Y = lerp(y, 620, merge), S = size * k * (1 - merge * .85);
      fx.globalAlpha = Math.max(fade, merge > 0 ? 1 - seg(t, 12.85, 13) : 0);
      fx.fillStyle = col; fx.beginPath(); fx.arc(X, Y, S, 0, Math.PI * 2); fx.fill();
      fx.beginPath(); fx.arc(X - S * .9, Y + S * .95, S * .22, 0, Math.PI * 2); fx.fill();
      fx.beginPath(); fx.arc(X - S * 1.25, Y + S * 1.35, S * .12, 0, Math.PI * 2); fx.fill();
      fx.fillStyle = CREAM; for (let d = -1; d <= 1; d++) { fx.beginPath(); fx.arc(X + d * S * .36, Y, S * .11, 0, Math.PI * 2); fx.fill(); }
    }
    fx.globalAlpha = 1;
    if (merge > 0) { fx.fillStyle = YEL; fx.beginPath(); fx.arc(540, 620, 26 * merge, 0, Math.PI * 2); fx.fill(); }
    countBlock(t, 9.1, 13, 6200, "You have about", "thoughts every day", INK, INK);
    show(T.note, "Queen's University study, 2020", { top: "960px", fontSize: "34px", color: INK }, clamp((t - 11.8) / .3) * .7 * (1 - seg(t, 12.7, 13)));
  }

  // ---- S5 speed (13–17)
  if (t >= 13 && t < 17.05) {
    const a = clamp((t - 13) / .2);
    axonG.setAttribute("opacity", a);
    const path = u => [lerp(-80, 1160, u), 560 + Math.sin(u * Math.PI * 3) * 70];
    let d = ""; for (let i = 0; i <= 60; i++) { const [x, y] = path(i / 60); d += (i ? " L" : "M") + x.toFixed(1) + "," + y.toFixed(1); }
    axon.setAttribute("d", d);

    const sr = ctx.sampleRate, m = ctx.createGain(); m.gain.value = .9; m.connect(ctx.destination);
    const nb = ctx.createBuffer(1, sr, sr), d = nb.getChannelData(0); let s = 7; for (let i = 0; i < d.length; i++) d[i] = ((s = (s * 16807) % 2147483647) / 2147483647) * 2 - 1;
    const env = (g, t0, a, p, dec) => { g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(p, t0 + a); g.gain.exponentialRampToValueAtTime(.0001, t0 + a + dec); };
    const osc = (type, f, t0, dur, p, fEnd) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0); if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t0 + dur); env(g, t0, .003, p, dur); o.connect(g); g.connect(m); o.start(t0); o.stop(t0 + dur + .05); };
    const nz = (t0, dur, p, type, f0, f1, q = 1) => { const src = ctx.createBufferSource(), b = ctx.createBiquadFilter(), g = ctx.createGain(); src.buffer = nb; b.type = type; b.Q.value = q; b.frequency.setValueAtTime(f0, t0); if (f1) b.frequency.exponentialRampToValueAtTime(f1, t0 + dur); env(g, t0, .004, p, dur); src.connect(b); b.connect(g); g.connect(m); src.start(t0); src.stop(t0 + dur + .05); };
    // frame-0 hit, the slam (sub drop + crack), punch tick, tease blip, burst-away whoosh
    osc("sine", 120, 0, .45, .55, 38); nz(0, .2, .25, "highpass", 3000);
    osc("sine", 70, T2, 1.1, .9, 24); nz(T2, .5, .45, "lowpass", 5000, 150, .7); osc("sawtooth", 880, T2, .18, .08, 110);
    osc("sine", 160, T3, .25, .45, 50); nz(T3, .06, .2, "bandpass", 2500, null, 2);
    osc("triangle", 1568, T4, .1, .1); osc("triangle", 2093, T4 + .08, .1, .07);
    nz(OUT - .25, .5, .3, "bandpass", 400, 7000, 2);
  };
})();
