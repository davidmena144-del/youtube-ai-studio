<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>3 تكّات تخلّي Claude يفهمك</title>
<style>
/*@FONTS@*/
html,body{margin:0;background:#07070A;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#0B0B10;transform-origin:0 0}
#cam{position:absolute;inset:0;transform-origin:540px 900px}
.L{position:absolute;inset:0}
.a{position:absolute;white-space:nowrap}
.c{left:0;right:0;text-align:center}
.k{font-family:"Kufi",sans-serif;font-weight:700}
.kr{font-family:"Kufi",sans-serif;font-weight:400}
.m{font-family:"Mono",monospace;direction:ltr}
.hl{background:#FFD23F;color:#0B0B10;padding:0 22px;border-radius:14px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hr{background:#E62E3A;color:#fff;padding:0 22px;border-radius:14px}
.y{color:#FFD23F}
#card{position:absolute;left:110px;top:500px;width:860px;height:640px;border-radius:44px;background:#14141B;border:3px solid #2A2A36;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}
#cardHead{position:absolute;left:0;right:0;top:0;height:86px;border-bottom:2px solid #24242E;display:flex;align-items:center;justify-content:space-between;padding:0 34px;direction:ltr}
#input{position:absolute;left:28px;right:28px;bottom:28px;min-height:96px;border-radius:30px;background:#1D1D26;border:3px solid #34343F;display:flex;align-items:center;padding:0 28px;direction:rtl}
#send{position:absolute;left:44px;bottom:44px;width:64px;height:64px;border-radius:50%;background:#FFD23F;display:flex;align-items:center;justify-content:center}
.bubble{position:absolute;right:34px;max-width:640px;border-radius:30px 30px 8px 30px;background:#2A2412;border:3px solid #FFD23F;color:#fff;padding:16px 28px;font-size:40px;line-height:1.5;white-space:normal}
.reply{position:absolute;left:34px;right:120px;color:#E9E9EE;font-size:40px;line-height:1.6;white-space:normal}
.bar{height:26px;border-radius:13px;background:#2E2E3A;margin:18px 0}
.chip{position:absolute;right:34px;left:34px;border-radius:24px;background:#1D1D26;border:3px solid #34343F;padding:14px 24px 14px 24px;font-size:38px;line-height:1.45;color:#fff;white-space:normal;display:flex;align-items:center;gap:20px}
.num{flex:none;width:58px;height:58px;border-radius:50%;background:#FFD23F;color:#0B0B10;display:flex;align-items:center;justify-content:center;font-size:34px}
#pill{position:absolute;top:150px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;background:#15151C;border:3px solid #2E2E3A;border-radius:60px;padding:12px 26px;direction:rtl}
.sw{width:66px;height:36px;border-radius:18px;background:#34343F;position:relative}
.sw i{position:absolute;top:5px;width:26px;height:26px;border-radius:50%;background:#8A8A96}
#flash{position:absolute;inset:0;background:#FFD23F;opacity:0;mix-blend-mode:screen;pointer-events:none}
#grain{position:absolute;inset:0;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
#ui{position:fixed;left:8px;bottom:8px;z-index:9;font:14px sans-serif;color:#fff;direction:ltr}
</style>
</head>
<body>
<div id="stage">
 <div id="cam">
  <canvas id="bg" width="1080" height="1920" class="L"></canvas>
  <div id="pill"><span class="k" style="font-size:34px;color:#fff">تكّة</span><span id="pillN" class="k" style="font-size:34px;color:#FFD23F">0/3</span><div class="sw" id="sw1"><i></i></div><div class="sw" id="sw2"><i></i></div><div class="sw" id="sw3"><i></i></div></div>
  <div id="txt" class="L"></div>
  <div id="card">
   <div id="cardHead"><div style="display:flex;align-items:center;gap:14px"><div style="width:22px;height:22px;border-radius:50%;background:#FFD23F"></div><span class="m" style="font-size:32px;color:#fff">Claude</span></div><span class="kr" style="font-size:28px;color:#8A8A96">محادثة جديدة</span></div>
   <div id="msgs" class="L"></div>
   <div id="input"><span id="inTxt" class="kr" style="font-size:38px;color:#fff"></span><span id="caret" style="display:inline-block;width:4px;height:44px;background:#FFD23F;margin-right:6px"></span></div>
   <div id="send"><svg width="34" height="34" viewBox="0 0 34 34"><path d="M17,28 L17,7 M8,15 L17,6 L26,15" stroke="#0B0B10" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>
  </div>
  <svg id="art" class="L" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
 </div>
 <div id="flash"></div>
 <div id="vig"></div>
 <canvas id="grain" width="1080" height="1920"></canvas>
</div>
<div id="ui"></div>
<script>
/* «3 تكّات تخلّي Claude يفهمك من أول مرة» — no narration: kinetic text, UI motion, stickman host, SFX.
 Beat sheet (120 BPM):
  0.0  HOOK      typed «Claude بيرد عليك / بكلام عام؟», confused stickman, «?»          typing ticks, glitch 2.6
  3.0  TWIST     «العيب مش فيه…» → slam «العيب في الطلب»                                whip + impact, groove starts
  6.0  TITLE     «3 تكّات» huge + «تخلّي Claude يفهمك من أول مرة», counter pill           riser → drop 9.0
  9.0  BAD       chat card: typed «اكتبلي بوست» → grey generic reply → ✗ «رد عام»       send whoosh, buzzer 12.6
 14.5  TAKKA 1   click → «قوله إنت مين» → chip 1                                         switch click, flash, bulb
 21.5  TAKKA 2   click → «حدّد المطلوب بالظبط» → chip 2                                  switch click
 28.5  TAKKA 3   click → «قوله شكل النتيجة» → chip 3                                     switch click
 35.5  RESULT    send → full reply typed → ✓ + confetti, «قبل / بعد»                      impact, ding 38.2
 41.5  OUTRO     «تكّة» logo with the stickman shadda + switch ON, «كل حاجة ليها تكّة»   click 45.7 (loops to start)
*/
const VIDEO = { w: 1080, h: 1920, duration: 46 };
window.VIDEO = VIDEO;
const INK = "#0B0B10", Y = "#FFD23F", R = "#E62E3A", W = "#FFFFFF", G = "#8A8A96";
function spring(t, w = 14, z = 0.75) { if (t <= 0) return 0; if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t); const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eOut = x => 1 - Math.pow(1 - clamp(x), 4);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const svg = (tag, at, p = $("art")) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); p.appendChild(e); return e; };
const div = (cls, html, p = $("txt")) => { const e = document.createElement("div"); e.className = cls; e.innerHTML = html; p.appendChild(e); e.style.opacity = 0; return e; };

// ---------- timeline constants ----------
const CLICKS = [14.7, 21.7, 28.7];          // the three تكّات
const IMPACTS = [3.0, 9.0, 35.6];
const WHIPS = [3.0, 6.0, 9.0, 14.5, 21.5, 28.5, 35.5, 41.5];
// typing schedules (also drive the typing sound)
const TYPING = [];
function typeSched(text, t0, cps) { const s = { text, t0, cps, t1: t0 + [...text].length / cps }; for (let i = 0; i < [...text].length; i++) if ([...text][i] !== " ") TYPING.push(t0 + i / cps); return s; }
const T_HOOK1 = typeSched("Claude بيرد عليك", 0.25, 18);
const T_HOOK2 = typeSched("بكلام عام؟", 1.25, 14);
const T_BAD = typeSched("اكتبلي بوست", 9.9, 10);
const PROMPT = ["أنا صاحب مطعم كشري في القاهرة", "اكتب بوست إنستجرام عن عرض الغدا", "3 سطور، بالمصري، ونبرة خفيفة"];
const T_CH = PROMPT.map((p, i) => typeSched(p, CLICKS[i] + 2.2, 22));
const REPLY = ["جعان؟ الكشري مستنيك!", "عرض الغدا النهارده: طبق ومشروب بسعر خاص.", "من 12 لـ 4 بس… تعالى بدري!"];
const T_REP = REPLY.map((p, i) => typeSched(p, 36.4 + i * 0.9, 34));
const typed = (s, t) => { const a = [...s.text]; return a.slice(0, Math.floor(clamp((t - s.t0) * s.cps, 0, a.length))).join(""); };

// ---------- text elements ----------
const H1 = div("a c k", ""), H2 = div("a c k", ""), H3 = div("a c k", ""), CAP = div("a c k", ""), Q = div("a k", "؟"), BIGN = div("a c k", "");
const ST = div("a k", ""), MARK = div("a k", "");

// ---------- stickman host (SVG, pose-interpolated) ----------
const host = svg("g", {});
const glow = svg("circle", { r: 120, fill: "url(#hglow)", opacity: 0 }, host);
const defs = svg("defs", {}); defs.innerHTML = `<radialGradient id="hglow"><stop offset="0" stop-color="#FFD23F" stop-opacity=".9"/><stop offset=".5" stop-color="#FFB703" stop-opacity=".3"/><stop offset="1" stop-color="#FFB703" stop-opacity="0"/></radialGradient>`;
const rays = [0, 1, 2, 3, 4].map(() => svg("line", { stroke: Y, "stroke-width": 9, "stroke-linecap": "round", opacity: 0 }, host));
const body = svg("path", { fill: "none", stroke: W, "stroke-width": 15, "stroke-linecap": "round", "stroke-linejoin": "round" }, host);
const head = svg("circle", { r: 36, fill: INK, stroke: W, "stroke-width": 12 }, host);
const eyeL = svg("circle", { r: 5.5, fill: W }, host), eyeR = svg("circle", { r: 5.5, fill: W }, host);
const mouth = svg("path", { fill: "none", stroke: W, "stroke-width": 6, "stroke-linecap": "round" }, host);
const POSES = {
  stand:   { hd: [0, -178], nk: [0, -140], hp: [0, 0], le: [-30, -92], lh: [-42, -40], re: [30, -92], rh: [42, -40], lk: [-18, 62], lf: [-26, 128], rk: [18, 62], rf: [26, 128] },
  scratch: { hd: [6, -176], nk: [0, -140], hp: [0, 0], le: [-30, -92], lh: [-42, -40], re: [52, -150], rh: [22, -196], lk: [-18, 62], lf: [-26, 128], rk: [18, 62], rf: [26, 128] },
  point:   { hd: [4, -178], nk: [0, -140], hp: [0, 0], le: [-30, -92], lh: [-42, -40], re: [62, -126], rh: [118, -168], lk: [-18, 62], lf: [-26, 128], rk: [18, 62], rf: [26, 128] },
  shrug:   { hd: [0, -172], nk: [0, -140], hp: [0, 0], le: [-62, -112], lh: [-84, -146], re: [62, -112], rh: [84, -146], lk: [-18, 62], lf: [-26, 128], rk: [18, 62], rf: [26, 128] },
  cheer:   { hd: [0, -184], nk: [0, -146], hp: [0, -6], le: [-50, -176], lh: [-62, -238], re: [50, -176], rh: [62, -238], lk: [-26, 56], lf: [-40, 118], rk: [26, 56], rf: [40, 118] },
  think:   { hd: [-4, -178], nk: [0, -140], hp: [0, 0], le: [-30, -92], lh: [-42, -40], re: [44, -98], rh: [14, -150], lk: [-18, 62], lf: [-26, 128], rk: [18, 62], rf: [26, 128] },
  wave:    { hd: [0, -178], nk: [0, -140], hp: [0, 0], le: [-30, -92], lh: [-42, -40], re: [58, -150], rh: [70, -210], lk: [-18, 62], lf: [-26, 128], rk: [18, 62], rf: [26, 128] },
};
// [time, pose, mood]
const HOST = [[0, "scratch", "o"], [3.0, "point", "flat"], [6.0, "think", "smile"], [9.0, "think", "flat"], [12.6, "shrug", "sad"],
  [14.6, "point", "smile"], [21.6, "point", "smile"], [28.6, "point", "smile"], [35.6, "cheer", "big"], [41.5, "wave", "big"]];
function poseAt(t) {
  let i = 0; while (i + 1 < HOST.length && HOST[i + 1][0] <= t) i++;
  const cur = POSES[HOST[i][1]], prev = POSES[HOST[Math.max(0, i - 1)][1]], k = i ? eOut(seg(t, HOST[i][0], HOST[i][0] + .28)) : 1;
  const p = {}; for (const j in cur) p[j] = [lerp(prev[j][0], cur[j][0], k), lerp(prev[j][1], cur[j][1], k)];
  return { p, mood: HOST[i][2] };
}
const AHA = [...CLICKS, 35.6];
function drawHost(t, x, y, s, a) {
  const { p, mood } = poseAt(t), bob = Math.sin(t * Math.PI * 2) * 4, X = j => x + p[j][0] * s, Yy = j => y + (p[j][1] + bob) * s;
  host.setAttribute("opacity", a);
  body.setAttribute("d", `M${X("nk")},${Yy("nk")} L${X("hp")},${Yy("hp")} M${X("nk") + 0},${Yy("nk") + 20 * s} L${X("le")},${Yy("le")} L${X("lh")},${Yy("lh")} M${X("nk")},${Yy("nk") + 20 * s} L${X("re")},${Yy("re")} L${X("rh")},${Yy("rh")} M${X("hp")},${Yy("hp")} L${X("lk")},${Yy("lk")} L${X("lf")},${Yy("lf")} M${X("hp")},${Yy("hp")} L${X("rk")},${Yy("rk")} L${X("rf")},${Yy("rf")}`);
  body.setAttribute("stroke-width", 15 * s);
  const hx = X("hd"), hy = Yy("hd");
  head.setAttribute("cx", hx); head.setAttribute("cy", hy); head.setAttribute("r", 36 * s); head.setAttribute("stroke-width", 12 * s);
  let lit = 0; for (const c of AHA) { const d = t - c; if (d >= 0 && d < 3.2) lit = Math.max(lit, d < .15 ? d / .15 : Math.exp(-(d - .15) * 1.1)); }
  head.setAttribute("fill", lit > .05 ? `rgba(255,210,63,${lit.toFixed(3)})` : INK);
  head.setAttribute("stroke", lit > .4 ? Y : W);
  glow.setAttribute("cx", hx); glow.setAttribute("cy", hy); glow.setAttribute("r", 130 * s); glow.setAttribute("opacity", lit);
  rays.forEach((r, i) => { const ang = (-150 + i * 30) * Math.PI / 180, r1 = 52 * s * (1 + lit * .2), r2 = r1 + 34 * s * lit; r.setAttribute("x1", hx + Math.cos(ang) * r1); r.setAttribute("y1", hy + Math.sin(ang) * r1); r.setAttribute("x2", hx + Math.cos(ang) * r2); r.setAttribute("y2", hy + Math.sin(ang) * r2); r.setAttribute("opacity", lit > .1 ? lit : 0); });
  const ink = lit > .4 ? INK : W;
  for (const [e, dx] of [[eyeL, -12], [eyeR, 12]]) { e.setAttribute("cx", hx + dx * s); e.setAttribute("cy", hy - 4 * s); e.setAttribute("r", (mood === "o" ? 6.5 : 5.5) * s); e.setAttribute("fill", ink); }
  const mx = hx, my = hy + 14 * s;
  const M = { smile: `M${mx - 12 * s},${my} Q${mx},${my + 10 * s} ${mx + 12 * s},${my}`, big: `M${mx - 15 * s},${my - 2 * s} Q${mx},${my + 16 * s} ${mx + 15 * s},${my - 2 * s}`,
    sad: `M${mx - 12 * s},${my + 6 * s} Q${mx},${my - 4 * s} ${mx + 12 * s},${my + 6 * s}`, flat: `M${mx - 10 * s},${my + 2 * s} L${mx + 10 * s},${my + 2 * s}`, o: `M${mx - 5 * s},${my + 4 * s} a${5 * s},${6 * s} 0 1 0 ${10 * s},0 a${5 * s},${6 * s} 0 1 0 ${-10 * s},0` };
  mouth.setAttribute("d", M[mood] || M.smile); mouth.setAttribute("stroke", ink); mouth.setAttribute("stroke-width", 6 * s);
  return { hx, hy };
}

// ---------- stamps, confetti, logo pieces ----------
const stamp = svg("g", { opacity: 0 });
const stampC = svg("circle", { r: 70, fill: "none", "stroke-width": 12 }, stamp);
const stampP = svg("path", { fill: "none", "stroke-width": 16, "stroke-linecap": "round", "stroke-linejoin": "round" }, stamp);
const conf = (() => { const r = rng(9), a = []; for (let i = 0; i < 70; i++) a.push({ ang: r() * Math.PI * 2, sp: 380 + r() * 520, col: [Y, R, W, "#2EF2FF"][i % 4], w: 10 + r() * 14, h: 6 + r() * 8, spin: (r() - .5) * 14 }); return a; })();
const confG = svg("g", {});
const confE = conf.map(c => svg("rect", { width: c.w, height: c.h, fill: c.col, opacity: 0 }, confG));
const logoG = svg("g", { opacity: 0 });
logoG.innerHTML = `<defs><radialGradient id="lg"><stop offset="0" stop-color="#FFD23F" stop-opacity=".85"/><stop offset=".5" stop-color="#FFB703" stop-opacity=".3"/><stop offset="1" stop-color="#FFB703" stop-opacity="0"/></radialGradient><linearGradient id="trk" x1="0" x2="1"><stop offset="0" stop-color="#B5121D"/><stop offset="1" stop-color="#FF3B47"/></linearGradient></defs>
 <rect id="lgTrack" x="390" y="1130" width="300" height="78" rx="39" fill="url(#trk)"/><circle id="lgKnob" cx="650" cy="1169" r="32" fill="#fff"/>`;
const LOGO = div("a c k", "تكة"), LOGOT = div("a c k", "كل حاجة ليها تكّة"), LOGOF = div("a c k", "تابع عشان التكّة الجاية");
const logoSpark = svg("g", { opacity: 0 });

// ---------- background ----------
const bgx = $("bg").getContext("2d");
const dots = (() => { const r = rng(4), a = []; for (let i = 0; i < 110; i++) a.push({ x: r() * 1080, y: r() * 1920, z: .3 + r() * .9, s: 1.5 + r() * 2.5 }); return a; })();
const SCN = [[0, "#1A1530"], [3, "#2A0F14"], [6, "#2A2410"], [9, "#121A2A"], [14.5, "#2A2410"], [21.5, "#2A2410"], [28.5, "#2A2410"], [35.5, "#0F2A1A"], [41.5, "#2A2410"]];
function drawBg(t) {
  bgx.fillStyle = INK; bgx.fillRect(0, 0, 1080, 1920);
  let i = 0; while (i + 1 < SCN.length && SCN[i + 1][0] <= t) i++;
  const col = SCN[i][1], gx = 540 + Math.sin(t * .4) * 160, gy = 820 + Math.cos(t * .3) * 140;
  const g = bgx.createRadialGradient(gx, gy, 40, gx, gy, 900); g.addColorStop(0, col); g.addColorStop(1, "rgba(11,11,16,0)");
  bgx.fillStyle = g; bgx.fillRect(0, 0, 1080, 1920);
  bgx.fillStyle = "rgba(255,255,255,.09)";
  for (const d of dots) { const y = ((d.y - t * 30 * d.z) % 1920 + 1920) % 1920; bgx.beginPath(); bgx.arc(d.x, y, d.s * d.z, 0, Math.PI * 2); bgx.fill(); }
}
const grain = (() => { const r = rng(3), tiles = []; for (let n = 0; n < 4; n++) { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"), im = g.createImageData(256, 256); for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 12; } g.putImageData(im, 0, 0); tiles.push(c); } return tiles; })();
const gctx = $("grain").getContext("2d");

// ---------- helpers ----------
function show(el, html, st, a) { if (html != null && el._h !== html) { el.innerHTML = html; el._h = html; } Object.assign(el.style, st); el.style.opacity = a; }
const slam = (t, t0) => { const k = spring(t - t0, 17, .55); return { s: lerp(1.6, 1, k), a: clamp((t - t0) / .08), y: (1 - k) * 60 }; };
const caret = t => (Math.floor(t * 2.4) % 2 ? 1 : 0);
const shakeAt = t => { let s = 0; for (const c of [...IMPACTS, ...CLICKS, 12.6, 2.6]) { const d = t - c; if (d >= 0 && d < .45) s += Math.exp(-d * 9) * 14 * Math.sin(d * 70); } return s; };
const zoomPunch = t => { let z = 0; for (const c of [...CLICKS, 9.0, 35.6]) { const d = t - c; if (d >= 0 && d < .6) z += .045 * Math.exp(-d * 7); } return z; };

// ---------- seek ----------
function seek(t) {
  t = clamp(t, 0, VIDEO.duration - 1e-6);
  drawBg(t);
  const sh = shakeAt(t), z = zoomPunch(t);
  let whipX = 0; for (const w of WHIPS) { const d = t - w; if (d > -.12 && d < .12) whipX += Math.sign(-d || 1) * (1 - Math.abs(d) / .12) * 140; }
  $("cam").style.transform = `translate(${(sh + whipX).toFixed(1)}px,${(sh * .4).toFixed(1)}px) scale(${(1 + z).toFixed(4)})`;
  let fl = 0; for (const c of [...CLICKS, 45.7]) { const d = t - c; if (d >= 0 && d < .35) fl = Math.max(fl, .55 * Math.exp(-d * 12)); }
  $("flash").style.opacity = fl.toFixed(3);
  for (const e of [H1, H2, H3, CAP, Q, BIGN, ST, MARK, LOGO, LOGOT, LOGOF]) { e.style.opacity = 0; e.style.clipPath = "none"; e.style.transform = "none"; e.style.filter = "none"; }

  // counter pill (from 6.0 to 41.5)
  const pa = t >= 6.2 && t < 41.3 ? clamp((t - 6.2) / .3) * (1 - seg(t, 41.0, 41.3)) : 0;
  $("pill").style.opacity = pa; $("pill").style.transform = `translateX(-50%) translateY(${(1 - eOut(seg(t, 6.2, 6.6))) * -40}px)`;
  const n = CLICKS.filter(c => t >= c).length; $("pillN").textContent = `${n}/3`;
  CLICKS.forEach((c, i) => { const on = eOut(seg(t, c, c + .18)), sw = $("sw" + (i + 1)); sw.style.background = on > .5 ? R : "#34343F"; const k = sw.firstChild; k.style.left = (5 + on * 30) + "px"; k.style.background = on > .5 ? W : "#8A8A96"; k.style.boxShadow = on > .5 ? "0 0 18px #FFD23F" : "none"; });

  // card visibility / position
  const cardIn = t >= 9 && t < 41.5;
  const ci = eOut(seg(t, 9.0, 9.45)), co = ease(seg(t, 41.0, 41.5));
  $("card").style.opacity = cardIn ? 1 : 0;
  $("card").style.transform = `translateY(${((1 - ci) * 1300 + co * 1300).toFixed(0)}px) rotate(${((1 - ci) * 6).toFixed(2)}deg)`;

  // host placement
  let hx = 200, hy = 1405, hs = 0.95, ha = 1;
  if (t < 3) { hx = 540; hy = 1250; hs = 1.6; }
  else if (t < 9) { hx = 540; hy = 1390; hs = 1.15; }
  if (t >= 41.5) ha = 1 - seg(t, 41.5, 41.8);
  const hpos = drawHost(t, hx, hy, hs, ha);

  // S0 HOOK
  if (t < 3.05) {

    show(H1, typed(T_HOOK1, t) + (t < T_HOOK1.t1 ? '<span style="color:#FFD23F">|</span>' : ""), { top: "420px", fontSize: "92px", color: W }, a);
    const h2 = typed(T_HOOK2, t), done = t >= T_HOOK2.t1;
    show(H2, done ? 'بكلام <span class="hl">عام</span>؟' : h2 + (t > 1.2 && caret(t) ? '<span style="color:#FFD23F">|</span>' : ""), { top: "560px", fontSize: "108px", color: W }, a);
    if (t > 2.55 && t < 2.8) { H2.style.transform = `translateX(${Math.sin(t * 160) * 14}px)`; H2.style.textShadow = "6px 0 #2EF2FF,-6px 0 #E62E3A"; } else H2.style.textShadow = "none";
    const qb = Math.sin(t * 7) * 10;
    show(Q, "؟", { left: (hpos.hx + 60) + "px", top: (hpos.hy - 200 + qb) + "px", fontSize: "120px", color: Y }, clamp((t - .4) / .3) * a);
  }
  // S1 TWIST
  if (t >= 3 && t < 6.05) {
    const a = 1 - seg(t, 5.85, 6.0);
    const s1 = slam(t, 3.05);
    show(H1, "العيب مش فيه…", { top: "420px", fontSize: "84px", color: "#B9B9C6", transform: `translateY(${s1.y}px)` }, s1.a * a * (t < 4.2 ? 1 : .55));
    const s2 = slam(t, 4.2);
    show(H2, 'العيب في <span class="hr">الطلب</span>', { top: "560px", fontSize: "122px", color: W, transform: `scale(${s2.s})` }, s2.a * a);
  }
  // S2 TITLE
  if (t >= 6 && t < 9.05) {
    const a = 1 - seg(t, 8.85, 9.0);
    const s = slam(t, 6.15);
    show(BIGN, '<span style="color:#FFD23F">3</span> تكّات', { top: "360px", fontSize: "250px", color: W, transform: `scale(${s.s})`, textShadow: "0 12px 0 #E62E3A" }, s.a * a);
    const s2 = slam(t, 6.9);
    show(H3, "تخلّي Claude يفهمك", { top: "760px", fontSize: "84px", color: W, transform: `translateY(${s2.y}px)` }, s2.a * a);

  }
  // card contents
  const msgs = $("msgs");
  if (cardIn) {

    if (t < 14.6) { $("inTxt").textContent = inText; $("caret").style.opacity = caret(t); }

    if (t >= 35.5) { $("inTxt").textContent = ""; $("caret").style.opacity = 0; }

    let html = "";
    if (t >= 11.2 && t < 14.5) {
      const bIn = eOut(seg(t, 11.2, 11.5));
      html += `<div class="bubble kr" style="top:${120 + (1 - bIn) * 60}px;opacity:${bIn}">اكتبلي بوست</div>`;
      const rIn = seg(t, 11.7, 12.5);
      html += `<div class="reply" style="top:260px;opacity:${clamp(rIn * 3)}">` + [0.92, 0.78, 0.86, 0.6, 0.7].map((w, i) => `<div class="bar" style="width:${(w * 100 * clamp(rIn * 5 - i)).toFixed(0)}%"></div>`).join("") + `</div>`;
    }
    if (t >= 14.5 && t < 35.5) {
      // the prompt builder: one chip per تكّة
      html += `<div class="a kr" style="right:34px;top:112px;font-size:30px;color:#8A8A96">الطلب بعد التكّات:</div>`;
      PROMPT.forEach((p, i) => {
        const c = CLICKS[i]; if (t < c + 2.0) return;
        const k = eOut(seg(t, c + 2.0, c + 2.35)), txt = typed(T_CH[i], t), done = t >= T_CH[i].t1, pulse = Math.exp(-Math.max(0, t - T_CH[i].t1) * 2.5);
        html += `<div class="chip kr" style="top:${170 + i * 150}px;opacity:${k};transform:translateX(${(1 - k) * -120}px);border-color:${done ? `rgba(255,210,63,${(.4 + .6 * pulse).toFixed(2)})` : "#34343F"};box-shadow:${done ? `0 0 ${(30 * pulse).toFixed(0)}px rgba(255,210,63,.6)` : "none"}"><div class="num k">${i + 1}</div><div>${txt}${!done ? '<span style="color:#FFD23F">|</span>' : ""}</div></div>`;
      });
    }
    if (t >= 35.5) {
      const bIn = eOut(seg(t, 35.6, 35.9));
      html += `<div class="bubble kr" style="top:${110 + (1 - bIn) * 60}px;opacity:${bIn};font-size:30px;max-width:700px">${PROMPT.join("، ")}</div>`;
      html += `<div class="reply kr" style="top:300px;font-size:37px;line-height:1.55">` + REPLY.map((l, i) => `<div style="margin:6px 0;opacity:${t >= T_REP[i].t0 ? 1 : 0}">${typed(T_REP[i], t)}</div>`).join("") + `</div>`;
    }
    if (msgs._h !== html) { msgs.innerHTML = html; msgs._h = html; }
    const res = eOut(seg(t, 36.0, 36.3)); $("input").style.opacity = t >= 36 ? 1 - res : 1; $("send").style.opacity = t >= 36 ? 1 - res : 1;
  }
  // headings over the card
  if (t >= 9 && t < 14.5) {
    const s = slam(t, 9.15);
    show(H1, 'الطلب <span class="hr">الناقص</span>', { top: "270px", fontSize: "92px", color: W, transform: `translateY(${s.y}px)` }, s.a * (1 - seg(t, 14.3, 14.5)));
    const s2 = slam(t, 12.65);
    show(CAP, 'رد ناقص', { top: "1210px", fontSize: "78px", color: "#FF6B74", transform: `scale(${s2.s})` }, s2.a * (1 - seg(t, 14.3, 14.5)));
  }
  [["قوله <span class=\"hl\">إنت مين</span>", 0], ["حدّد <span class=\"hl\">المطلوب بالظبط</span>", 1], ["قوله <span class=\"hl\">شكل النتيجة</span>", 2]].forEach(([h, i]) => {
    const c = CLICKS[i], end = i < 2 ? CLICKS[i + 1] - .2 : 35.4;
    if (t >= c - .2 && t < end) {
      const a = 1 - seg(t, end - .2, end);
      const k = slam(t, c + .05);
      show(ST, `التكّة ${["الأولى", "التانية", "التالتة"][i]}`, { top: "250px", left: "0", right: "0", textAlign: "center", fontSize: "50px", color: Y, transform: `translateY(${k.y}px)` }, k.a * a);
      const k2 = slam(t, c + .35);
      show(H1, h, { top: "330px", fontSize: "88px", color: W, transform: `scale(${k2.s})` }, k2.a * a);
    }
  });
  if (t >= 35.5 && t < 41.5) {
    const s = slam(t, 35.65);
    show(H1, 'نفس <span class="hl">Claude</span>… رد تاني خالص', { top: "320px", fontSize: "70px", color: W, transform: `scale(${s.s})` }, s.a * (1 - seg(t, 41.2, 41.5)));
    const s2 = slam(t, 39.2);
    show(CAP, "الفرق كله في التكّة", { top: "1250px", left: "300px", fontSize: "64px", color: Y, transform: `scale(${s2.s})` }, s2.a * (1 - seg(t, 41.2, 41.5)));
  }

  // stamp ✗ / ✓
  const stampT = t >= 12.6 && t < 14.4 ? 12.6 : (t >= 38.2 && t < 41.2 ? 38.2 : null);
  if (stampT) {
    const ok = stampT > 30, k = spring(t - stampT, 18, .5), col = ok ? "#2BD576" : R;
    stamp.setAttribute("opacity", clamp((t - stampT) / .06) * (1 - seg(t, ok ? 41.0 : 14.2, ok ? 41.2 : 14.4)));
    stamp.setAttribute("transform", `translate(${ok ? 900 : 820} ${ok ? 1190 : 860}) scale(${lerp(2.2, 1, k)}) rotate(-12)`);
    stampC.setAttribute("stroke", col); stampP.setAttribute("stroke", col);
    stampP.setAttribute("d", ok ? "M-34,2 L-8,28 L38,-26" : "M-30,-30 L30,30 M30,-30 L-30,30");
  } else stamp.setAttribute("opacity", 0);
  // confetti
  conf.forEach((c, i) => { const d = t - 38.25, e = confE[i]; if (d < 0 || d > 2.4) { e.setAttribute("opacity", 0); return; } const x = 900 + Math.cos(c.ang) * c.sp * d, y = 1190 + Math.sin(c.ang) * c.sp * d + 520 * d * d; e.setAttribute("x", x); e.setAttribute("y", y); e.setAttribute("transform", `rotate(${(c.spin * d * 57).toFixed(1)} ${x} ${y})`); e.setAttribute("opacity", 1 - d / 2.4); });

  // S8 OUTRO
  if (t >= 41.5) {
    const s = slam(t, 41.7);
    show(LOGO, "تكة", { top: "560px", fontSize: "300px", color: W, transform: `scale(${s.s})`, textShadow: "0 12px 0 #E62E3A" }, s.a);
    logoG.setAttribute("opacity", clamp((t - 42.3) / .2));
    const on = eOut(seg(t, 42.9, 43.1));
    logoG.querySelector("#lgKnob").setAttribute("cx", 430 + on * 220);
    logoG.querySelector("#lgTrack").setAttribute("fill", on > .5 ? "url(#trk)" : "#34343F");
    // the stickman shadda above the kaf, lit when the switch turns on
    const kx = 560, ky = 610, lit = on;
    logoSpark.setAttribute("opacity", s.a);
    logoSpark.innerHTML = `<circle cx="${kx}" cy="${ky}" r="${120 * lit}" fill="url(#lg)"/>` +
      [-150, -120, -90, -60, -30].map(a => { const r = a * Math.PI / 180; return `<line x1="${kx + Math.cos(r) * 70}" y1="${ky + Math.sin(r) * 70}" x2="${kx + Math.cos(r) * (70 + 34 * lit)}" y2="${ky + Math.sin(r) * (70 + 34 * lit)}" stroke="#FFD23F" stroke-width="12" stroke-linecap="round" opacity="${lit}"/>`; }).join("") +
      `<g stroke="${lit > .5 ? "#FFD23F" : "#fff"}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M${kx - 50},${ky - 22} Q${kx - 43},${ky + 20} ${kx - 19},${ky + 24} L${kx},${ky + 6} L${kx + 19},${ky + 24} Q${kx + 43},${ky + 20} ${kx + 50},${ky - 22}"/><path d="M${kx},${ky + 6} L${kx},${ky + 40}"/></g><circle cx="${kx}" cy="${ky - 20}" r="18" fill="${lit > .5 ? "#FFD23F" : "#fff"}"/>`;
    const s2 = slam(t, 43.3);
    show(LOGOT, "كل حاجة ليها تكّة", { top: "1250px", fontSize: "70px", color: Y, transform: `translateY(${s2.y}px)` }, s2.a);
    const s3 = slam(t, 44.2);
    show(LOGOF, 'تابع عشان <span class="hl">التكّة الجاية</span>', { top: "1360px", fontSize: "56px", color: W, transform: `translateY(${s3.y}px)` }, s3.a * (1 - seg(t, 45.6, 46)));
  } else { logoG.setAttribute("opacity", 0); logoSpark.setAttribute("opacity", 0); }

  // grain
  gctx.clearRect(0, 0, 1080, 1920);
  const tile = grain[Math.floor(t * 24) % 4];
  for (let y = 0; y < 1920; y += 256) for (let x = 0; x < 1080; x += 256) gctx.drawImage(tile, x, y);
}
window.seek = seek;

// ---------- sound (no narration: music + effects carry the video) ----------
window.buildAudio = async function (ctx) {
  const sr = ctx.sampleRate, BEAT = .5;
  const master = ctx.createGain(); master.gain.value = .8;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  master.connect(comp); comp.connect(ctx.destination);
  const nb = ctx.createBuffer(1, sr * 2, sr); { const r = rng(11), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; }
  const env = (g, t0, a, peak, dec) => { g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(.0001, t0 + a + dec); };
  const osc = (type, f, t0, dur, peak, a = .004, fEnd, dest = master) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0); if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t0 + dur); env(g, t0, a, peak, dur); o.connect(g); g.connect(dest); o.start(t0); o.stop(t0 + a + dur + .05); };
  const noise = (t0, dur, peak, type, f0, f1, q = 1, a = .004, dest = master) => { const s = ctx.createBufferSource(), b = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = nb; b.type = type; b.Q.value = q; b.frequency.setValueAtTime(f0, t0); if (f1) b.frequency.exponentialRampToValueAtTime(f1, t0 + dur); env(g, t0, a, peak, dur); s.connect(b); b.connect(g); g.connect(dest); s.start(t0, (t0 * 7.3) % 1); s.stop(t0 + a + dur + .05); };
  const kick = (t0, v = .8) => osc("sine", 150, t0, .3, v, .002, 42);
  const clap = (t0, v = .22) => { noise(t0, .13, v, "bandpass", 1500, null, 1.2); noise(t0 + .012, .09, v * .6, "bandpass", 2300, null, 1.5); };
  const hat = (t0, v = .045) => noise(t0, .035, v, "highpass", 8500);
  const whoosh = (t0, d = .45, v = .22) => noise(t0 - d * .7, d, v, "bandpass", 300, 5200, 2, d * .6);
  const impact = (t0, v = .8) => { osc("sine", 95, t0, .8, v, .003, 30); noise(t0, .45, .3, "lowpass", 3000, 200, .7); };
  const riser = (t0, t1, v = .18) => noise(t0, t1 - t0, v, "bandpass", 200, 6500, 3, (t1 - t0) * .9);
  const tick = (t0, v = .08) => { noise(t0, .02, v, "highpass", 3000); osc("square", 1800 + (t0 * 997 % 400), t0, .015, v * .4); };
  const click = t0 => { noise(t0, .012, .5, "highpass", 2500); osc("square", 2600, t0, .01, .25); osc("sine", 180, t0 + .01, .09, .5, .002, 90); noise(t0 + .06, .01, .3, "highpass", 4000); };
  const buzz = t0 => { osc("square", 110, t0, .32, .16, .005); osc("square", 116, t0, .32, .12, .005); };
  const ding = t0 => { osc("sine", 1318.5, t0, 1.4, .22, .003); osc("sine", 1975.5, t0 + .09, 1.2, .16, .003); };
  const pop = (t0, f = 900) => osc("sine", f, t0, .08, .18, .002, f * 1.8);

  for (const t0 of TYPING) tick(t0);
  // groove from the twist; drop at 9.0; break during the takka setups for focus
  for (let t0 = 3.0; t0 < 41.5; t0 += BEAT) {
    const inBreak = t0 >= 6 && t0 < 9;
    kick(t0, inBreak ? .45 : .75);
    if (!inBreak && Math.round((t0 - 3) / BEAT) % 2 === 1) clap(t0);
    if (t0 >= 9) { hat(t0 + .25); if (t0 >= 35.5) { hat(t0 + .125, .03); hat(t0 + .375, .03); } }
  }
  const roots = [55, 43.65, 65.41, 49], chords = [[220, 261.6, 329.6], [174.6, 220, 261.6], [261.6, 329.6, 392], [196, 246.9, 293.7]];
  const pad = ctx.createBiquadFilter(); pad.type = "lowpass"; pad.frequency.value = 1300; const pg = ctx.createGain(); pg.gain.value = .5; pad.connect(pg); pg.connect(master);
  for (let bar = 0, t0 = 3.0; t0 < 45.5; bar++, t0 += 2) {
    const r = roots[bar % 4];
    if (t0 < 41.5) for (let b = 0; b < 4; b++) osc("sawtooth", r * 2, t0 + b * BEAT, .36, .06, .01);
    osc("sine", r, t0, 1.9, .26, .02);
    for (const f of chords[bar % 4]) osc("sawtooth", f, t0, 1.95, .022, .2, null, pad);
  }
  for (const w of WHIPS) whoosh(w);
  for (const i of IMPACTS) impact(i);
  impact(2.6, .35); riser(7.3, 9.0); riser(34.2, 35.5, .14);
  pop(11.2, 700); pop(35.6, 760); buzz(12.6);
  for (const c of CLICKS) { click(c); riser(c - .9, c, .08); }
  PROMPT.forEach((p, i) => pop(CLICKS[i] + 2.0, 820 + i * 120));
  ding(38.2); for (let i = 0; i < 6; i++) pop(38.25 + i * .07, 1200 + i * 160);
  click(42.9); riser(44.6, 45.7, .1); click(45.7);
};

// ---------- preview controls ----------
const isRender = location.search.includes("render");
if (!isRender) {
  const fit = () => { const s = Math.min(innerWidth / 1080, innerHeight / 1920); $("stage").style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  async function play() { ac ??= new AudioContext(); if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * VIDEO.duration), 48000); await buildAudio(off); buf = await off.startRendering(); } src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(0, offset % VIDEO.duration); startAt = ac.currentTime; playing = true; }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; }
  const now = () => playing ? (offset + ac.currentTime - startAt) % VIDEO.duration : offset;
  $("ui").innerHTML = `<button id=pp>play/pause</button> <input id=sc type=range min=0 max=${VIDEO.duration} step=0.01 style="width:300px">`;
  $("pp").onclick = () => playing ? pause() : play();
  $("sc").oninput = e => { const was = playing; pause(); offset = +e.target.value; if (was) play(); };
  (function loop() { const t = now(); seek(t); if (!$("sc").matches(":active")) $("sc").value = t; requestAnimationFrame(loop); })();
} else seek(0);
</script>
