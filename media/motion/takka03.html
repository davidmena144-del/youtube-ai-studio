<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>خليه يسألك الأول</title>
<style>
/*@FONTS@*/
html,body{margin:0;background:#07070A;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#0B0B10;transform-origin:0 0}

.L{position:absolute;inset:0}
.a{position:absolute;white-space:nowrap}
.c{left:0;right:0;text-align:center}
.k{font-family:"Kufi",sans-serif;font-weight:700}
.kr{font-family:"Kufi",sans-serif;font-weight:400}
.m{font-family:"Mono",monospace;direction:ltr}
.hl{background:#FFD23F;color:#0B0B10;padding:0 22px;border-radius:14px}
.hr{background:#E62E3A;color:#fff;padding:0 22px;border-radius:14px}
#cmd{position:absolute;left:90px;width:900px;top:520px;box-sizing:border-box;border-radius:30px;background:#13131A;border:3px solid #2E2E3A;border-right:14px solid #FFD23F;padding:26px 40px 34px;opacity:0}
#cmdH{display:flex;justify-content:space-between;align-items:center;font-size:26px;color:#8A8A96;direction:ltr}
#cmd1,#cmd2{font-size:44px;line-height:1.6;color:#fff;white-space:normal;margin-top:12px;min-height:70px}
.qc{position:absolute;left:110px;width:860px;box-sizing:border-box;border-radius:40px;background:#15151C;border:4px solid #FFD23F;padding:26px 40px 34px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.qh{display:flex;justify-content:space-between;align-items:center;font-size:28px;color:#8A8A96}
.qt{font-size:62px;line-height:1.5;color:#fff;margin-top:10px;white-space:normal}
.ans{position:absolute;right:150px;max-width:760px;border-radius:34px 34px 8px 34px;background:#FFD23F;color:#0B0B10;padding:16px 34px;font-size:44px;line-height:1.5;white-space:normal}
.chip{position:absolute;top:250px;border-radius:40px;background:#15151C;border:3px solid #2BD576;color:#fff;padding:6px 24px;font-size:34px;display:flex;gap:12px;align-items:center}
.chip b{color:#2BD576}
#flash{position:absolute;inset:0;background:#FFD23F;opacity:0;mix-blend-mode:screen;pointer-events:none}
#grain{position:absolute;inset:0;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
#ui{position:fixed;left:8px;bottom:8px;z-index:9;font:14px sans-serif;color:#fff;direction:ltr}
</style>
</head>
<body>
<div id="stage">
 <div id="cam">
  <canvas id="bg" width="1080" height="1920" class="L"></canvas>
  <svg id="board" class="L" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="txt" class="L"></div>
  <div id="cmd" class="kr"><div id="cmdH"><span class="m">prompt</span><span class="m" style="color:#FFD23F">● ● ●</span></div><div id="cmd1"></div><div id="cmd2"></div></div>
  <div id="qs" class="L"></div>
  <svg id="art" class="L" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
 </div>
 <div id="flash"></div>
 <div id="vig"></div>
 <canvas id="grain" width="1080" height="1920"></canvas>
</div>
<div id="ui"></div>
<script>
/* «خليه يسألك الأول» — no narration.
  0.0  HOOK     «طلبت حاجة كبيرة… و Claude خمّن؟» blindfolded stickman throws a dart → misses the board
  3.0  TWIST    blindfold flies off → «خليه يسألك الأول»
  6.5  PROMPT   prompt card typed: «اعملي خطة تسويق لمحلي.» + «قبل ما تبدأ، اسألني 3 أسئلة…»
 11.2  QUIZ     3 question cards (لمين؟ / الميزانية؟ / الهدف؟), each answered, ✓, collapses into a chip
 22.0  RESULT   second throw → bullseye, rings pulse, confetti, «إجابة على مقاسك»
 29.0  RULE     «طلب كبير؟ خليه يسأل الأول» + copyable line
 33.0  OUTRO    «تكّة» logo, switch ON, «كل حاجة ليها تكّة», follow
*/
const VIDEO = { w: 1080, h: 1920, duration: 38 };
window.VIDEO = VIDEO;
const INK = "#0B0B10", Y = "#FFD23F", R = "#E62E3A", W = "#FFFFFF", GOOD = "#2BD576";
function spring(t, w = 14, z = 0.75) { if (t <= 0) return 0; if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t); const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eOut = x => 1 - Math.pow(1 - clamp(x), 4);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const svg = (tag, at, p = $("art")) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); p.appendChild(e); return e; };
const div = (cls, html, p = $("txt")) => { const e = document.createElement("div"); e.className = cls; e.innerHTML = html; p.appendChild(e); e.style.opacity = 0; return e; };

// ---------- timeline ----------
const THROW1 = 1.6, HIT1 = 2.1, PROMPT = 6.5, QUIZ = [11.2, 14.8, 18.4], RES = 22.0, THROW2 = 22.9, HIT2 = 23.4, RULE = 29.0, OUT = 33.0;
const IMPACTS = [3.0, PROMPT, RES, HIT2, 29.2, 33.2];
const WHIPS = [3.0, PROMPT, QUIZ[0], RES, RULE, OUT];
const TYPING = [];
function typeSched(text, t0, cps) { const a = [...text], s = { text, t0, cps, t1: t0 + a.length / cps }; for (let i = 0; i < a.length; i++) if (a[i] !== " ") TYPING.push(t0 + i / cps); return s; }
const typed = (s, t) => { const a = [...s.text]; return a.slice(0, Math.floor(clamp((t - s.t0) * s.cps, 0, a.length))).join(""); };
const T_C1 = typeSched("اعملي خطة تسويق لمحلي.", 6.9, 20);
const T_C2 = typeSched("قبل ما تبدأ، اسألني 3 أسئلة توضّح اللي محتاجه.", 8.2, 24);
const QS = [["الخطة دي لمين بالظبط؟", "بنات من 18 لـ 30 بيحبوا الإكسسوارات", "لمين؟"],
  ["الميزانية قد إيه؟", "قليلة… 2000 جنيه في الشهر", "الميزانية؟"],
  ["إيه أهم هدف ليك؟", "نزوّد الطلبات أونلاين", "الهدف؟"]];
const T_A = QS.map(([, a], i) => typeSched(a, QUIZ[i] + 1.2, 22));

// ---------- text elements ----------
const H1 = div("a c k", ""), H2 = div("a c k", ""), H3 = div("a c k", ""), CAP = div("a c k", ""), POP = div("a k", "");
const LOGO = div("a c k", "تكة"), LOGOT = div("a c k", "كل حاجة ليها تكّة"), LOGOF = div("a c k", "تابع عشان التكّة الجاية");
const CHIPS = QS.map(([, , c]) => div("chip k", `<b>✓</b>${c}`));
const COPY = div("a c kr", "");

// ---------- dartboard ----------
const bd = $("board");
const boardG = svg("g", { opacity: 0 }, bd);
const RINGS = [[220, "#F3F0E6"], [190, INK], [160, R], [130, "#F3F0E6"], [100, INK], [70, R], [40, Y], [16, INK]];
RINGS.forEach(([r, c]) => svg("circle", { r, fill: c, stroke: "#2E2E3A", "stroke-width": 3 }, boardG));
const pulseG = svg("g", {}, bd);
const pulses = [0, 1, 2].map(() => svg("circle", { r: 10, fill: "none", stroke: Y, "stroke-width": 10, opacity: 0 }, pulseG));
const dartG = svg("g", { opacity: 0 }, bd);
dartG.innerHTML = `<path d="M0,0 L-26,-7 L-26,7 Z" fill="#C9C9D4"/><rect x="-110" y="-6" width="86" height="12" rx="6" fill="${R}"/><path d="M-100,-6 L-132,-34 L-120,-6 Z M-100,6 L-132,34 L-120,6 Z" fill="${Y}"/>`;
const dart1G = svg("g", { opacity: 0 }, bd); dart1G.innerHTML = dartG.innerHTML;

// ---------- stickman host ----------
const defs = svg("defs", {}); defs.innerHTML = `<radialGradient id="hglow"><stop offset="0" stop-color="#FFD23F" stop-opacity=".9"/><stop offset=".5" stop-color="#FFB703" stop-opacity=".3"/><stop offset="1" stop-color="#FFB703" stop-opacity="0"/></radialGradient>
 <radialGradient id="lg"><stop offset="0" stop-color="#FFD23F" stop-opacity=".85"/><stop offset=".5" stop-color="#FFB703" stop-opacity=".3"/><stop offset="1" stop-color="#FFB703" stop-opacity="0"/></radialGradient>
 <linearGradient id="trk" x1="0" x2="1"><stop offset="0" stop-color="#B5121D"/><stop offset="1" stop-color="#FF3B47"/></linearGradient>`;
const host = svg("g", {});
const glow = svg("circle", { r: 120, fill: "url(#hglow)", opacity: 0 }, host);
const rays = [0, 1, 2, 3, 4].map(() => svg("line", { stroke: Y, "stroke-width": 9, "stroke-linecap": "round", opacity: 0 }, host));
const body = svg("path", { fill: "none", stroke: W, "stroke-width": 15, "stroke-linecap": "round", "stroke-linejoin": "round" }, host);
const head = svg("circle", { r: 36, fill: INK, stroke: W, "stroke-width": 12 }, host);
const eyeL = svg("circle", { r: 5.5, fill: W }, host), eyeR = svg("circle", { r: 5.5, fill: W }, host);
const mouth = svg("path", { fill: "none", stroke: W, "stroke-width": 6, "stroke-linecap": "round" }, host);
const band = svg("g", {}, host);
const bandR = svg("rect", { fill: R, rx: 6 }, band), bandT = svg("path", { fill: R }, band);
const POSES = {
  stand: { hd: [0, -178], nk: [0, -140], hp: [0, 0], le: [-30, -92], lh: [-42, -40], re: [30, -92], rh: [42, -40], lk: [-18, 62], lf: [-26, 128], rk: [18, 62], rf: [26, 128] },
  aim:   { hd: [2, -178], nk: [0, -140], hp: [0, 0], le: [-30, -92], lh: [-42, -40], re: [56, -132], rh: [104, -150], lk: [-22, 62], lf: [-34, 128], rk: [22, 62], rf: [34, 128] },
  wind:  { hd: [-6, -176], nk: [-4, -140], hp: [0, 0], le: [30, -100], lh: [60, -70], re: [-10, -184], rh: [-62, -214], lk: [-24, 62], lf: [-40, 128], rk: [22, 62], rf: [40, 124] },
  point: { hd: [6, -178], nk: [2, -140], hp: [0, 0], le: [-30, -92], lh: [-42, -40], re: [62, -126], rh: [118, -168], lk: [-22, 62], lf: [-34, 128], rk: [24, 62], rf: [44, 124] },
  shrug: { hd: [0, -172], nk: [0, -140], hp: [0, 0], le: [-62, -112], lh: [-84, -146], re: [62, -112], rh: [84, -146], lk: [-18, 62], lf: [-26, 128], rk: [18, 62], rf: [26, 128] },
  cheer: { hd: [0, -184], nk: [0, -146], hp: [0, -6], le: [-50, -176], lh: [-62, -238], re: [50, -176], rh: [62, -238], lk: [-26, 56], lf: [-40, 118], rk: [26, 56], rf: [40, 118] },
  think: { hd: [-4, -178], nk: [0, -140], hp: [0, 0], le: [-30, -92], lh: [-42, -40], re: [44, -98], rh: [14, -150], lk: [-18, 62], lf: [-26, 128], rk: [18, 62], rf: [26, 128] },
  raise: { hd: [0, -180], nk: [0, -140], hp: [0, 0], le: [-30, -92], lh: [-42, -40], re: [40, -170], rh: [50, -236], lk: [-18, 62], lf: [-26, 128], rk: [18, 62], rf: [26, 128] },
  wave:  { hd: [0, -178], nk: [0, -140], hp: [0, 0], le: [-30, -92], lh: [-42, -40], re: [58, -150], rh: [70, -210], lk: [-18, 62], lf: [-26, 128], rk: [18, 62], rf: [26, 128] },
};
const HOST = [[0, "aim", "flat"], [1.15, "wind", "flat"], [THROW1, "point", "o", .1], [2.2, "shrug", "sad"], [3.5, "stand", "o"], [4.1, "point", "smile"],
  [PROMPT, "think", "smile"], ...QUIZ.flatMap(q => [[q, "think", "o"], [q + 1.1, "raise", "smile"], [q + 2.6, "point", "big"]]),
  [RES, "aim", "smile"], [22.5, "wind", "smile"], [THROW2, "point", "big", .1], [HIT2 + .1, "cheer", "big"], [26.0, "point", "smile"],
  [RULE, "point", "smile"], [30.0, "cheer", "big"], [31.2, "point", "smile"], [OUT, "wave", "big"]];
function poseAt(t) {
  let i = 0; while (i + 1 < HOST.length && HOST[i + 1][0] <= t) i++;
  const cur = POSES[HOST[i][1]], prev = POSES[HOST[Math.max(0, i - 1)][1]], k = i ? eOut(seg(t, HOST[i][0], HOST[i][0] + (HOST[i][3] || .28))) : 1;
  const p = {}; for (const j in cur) p[j] = [lerp(prev[j][0], cur[j][0], k), lerp(prev[j][1], cur[j][1], k)];
  return { p, mood: HOST[i][2] };
}
const AHA = [3.6, ...QUIZ.map(q => q + 2.6), HIT2, 34.4];
function drawHost(t, x, y, s, a) {
  const { p, mood } = poseAt(t), bob = Math.sin(t * Math.PI * 2) * 4, X = j => x + p[j][0] * s, Yy = j => y + (p[j][1] + bob) * s;
  host.setAttribute("opacity", a);
  body.setAttribute("d", `M${X("nk")},${Yy("nk")} L${X("hp")},${Yy("hp")} M${X("nk")},${Yy("nk") + 20 * s} L${X("le")},${Yy("le")} L${X("lh")},${Yy("lh")} M${X("nk")},${Yy("nk") + 20 * s} L${X("re")},${Yy("re")} L${X("rh")},${Yy("rh")} M${X("hp")},${Yy("hp")} L${X("lk")},${Yy("lk")} L${X("lf")},${Yy("lf")} M${X("hp")},${Yy("hp")} L${X("rk")},${Yy("rk")} L${X("rf")},${Yy("rf")}`);
  body.setAttribute("stroke-width", 15 * s);
  const hx = X("hd"), hy = Yy("hd");
  head.setAttribute("cx", hx); head.setAttribute("cy", hy); head.setAttribute("r", 36 * s); head.setAttribute("stroke-width", 12 * s);
  let lit = 0; for (const c of AHA) { const d = t - c; if (d >= 0 && d < 3.2) lit = Math.max(lit, d < .15 ? d / .15 : Math.exp(-(d - .15) * 1.3)); }
  head.setAttribute("fill", lit > .05 ? `rgba(255,210,63,${lit.toFixed(3)})` : INK);
  head.setAttribute("stroke", lit > .4 ? Y : W);
  glow.setAttribute("cx", hx); glow.setAttribute("cy", hy); glow.setAttribute("r", 130 * s); glow.setAttribute("opacity", lit);
  rays.forEach((r, i) => { const ang = (-150 + i * 30) * Math.PI / 180, r1 = 52 * s * (1 + lit * .2), r2 = r1 + 34 * s * lit; r.setAttribute("x1", hx + Math.cos(ang) * r1); r.setAttribute("y1", hy + Math.sin(ang) * r1); r.setAttribute("x2", hx + Math.cos(ang) * r2); r.setAttribute("y2", hy + Math.sin(ang) * r2); r.setAttribute("opacity", lit > .1 ? lit : 0); });
  const ink = lit > .4 ? INK : W;
  for (const [e, dx] of [[eyeL, -12], [eyeR, 12]]) { e.setAttribute("cx", hx + dx * s); e.setAttribute("cy", hy - 4 * s); e.setAttribute("r", (mood === "o" ? 6.5 : 5.5) * s); e.setAttribute("fill", ink); }
  const mx = hx, my = hy + 14 * s;
  const M = { smile: `M${mx - 12 * s},${my} Q${mx},${my + 10 * s} ${mx + 12 * s},${my}`, big: `M${mx - 15 * s},${my - 2 * s} Q${mx},${my + 16 * s} ${mx + 15 * s},${my - 2 * s}`,
    sad: `M${mx - 12 * s},${my + 6 * s} Q${mx},${my - 4 * s} ${mx + 12 * s},${my + 6 * s}`, flat: `M${mx - 10 * s},${my + 2 * s} L${mx + 10 * s},${my + 2 * s}`, o: `M${mx - 5 * s},${my + 4 * s} a${5 * s},${6 * s} 0 1 0 ${10 * s},0 a${5 * s},${6 * s} 0 1 0 ${-10 * s},0` };
  mouth.setAttribute("d", M[mood] || M.smile); mouth.setAttribute("stroke", ink); mouth.setAttribute("stroke-width", 6 * s);
  // blindfold: on during the hook, flies off at 3.5
  const d = t - 3.5, off = d > 0 ? d : 0, ba = d > 0 ? 1 - seg(d, .35, .7) : 1;
  const bx = hx - 40 * s - off * 500 * s, by = hy - 16 * s - off * 1300 * s + off * off * 900 * s;
  band.setAttribute("opacity", ba); band.setAttribute("transform", `rotate(${(-6 - off * 400).toFixed(1)} ${bx + 40 * s} ${by + 11 * s})`);
  bandR.setAttribute("x", bx); bandR.setAttribute("y", by); bandR.setAttribute("width", 80 * s); bandR.setAttribute("height", 22 * s);
  bandT.setAttribute("d", `M${bx},${by + 6 * s} L${bx - 34 * s},${by - 8 * s} L${bx - 28 * s},${by + 18 * s} Z`);
  return { hx, hy, hand: [X("rh"), Yy("rh")] };
}

// ---------- stamps, confetti, logo ----------
const conf = (() => { const r = rng(5), a = []; for (let i = 0; i < 80; i++) a.push({ ang: r() * Math.PI * 2, sp: 380 + r() * 560, col: [Y, R, W, "#2EF2FF"][i % 4], w: 10 + r() * 14, h: 6 + r() * 8, spin: (r() - .5) * 14 }); return a; })();
const confG = svg("g", {}); const confE = conf.map(c => svg("rect", { width: c.w, height: c.h, fill: c.col, opacity: 0 }, confG));
const logoG = svg("g", { opacity: 0 });
logoG.innerHTML = `<rect id="lgTrack" x="390" y="1130" width="300" height="78" rx="39" fill="url(#trk)"/><circle id="lgKnob" cx="650" cy="1169" r="32" fill="#fff"/>`;
const logoSpark = svg("g", { opacity: 0 });

// ---------- background: radar rings from the centre ----------
const bgx = $("bg").getContext("2d");
const SCN = [[0, "#2A0F14"], [3, "#2A2410"], [PROMPT, "#14203A"], [QUIZ[0], "#1A1530"], [RES, "#0F2A1A"], [RULE, "#2A2410"], [OUT, "#2A2410"]];
function drawBg(t) {
  bgx.fillStyle = INK; bgx.fillRect(0, 0, 1080, 1920);
  let i = 0; while (i + 1 < SCN.length && SCN[i + 1][0] <= t) i++;
  const g = bgx.createRadialGradient(540, 960, 40, 540, 960, 1000); g.addColorStop(0, SCN[i][1]); g.addColorStop(1, "rgba(11,11,16,0)");
  bgx.fillStyle = g; bgx.fillRect(0, 0, 1080, 1920);
  bgx.lineWidth = 3;
  for (let n = 0; n < 9; n++) {
    const r = ((t * 70 + n * 140) % 1260);
    bgx.strokeStyle = `rgba(255,255,255,${(.06 * (1 - r / 1260)).toFixed(3)})`;
    bgx.beginPath(); bgx.arc(540, 960, r, 0, Math.PI * 2); bgx.stroke();
  }
}
const grain = (() => { const r = rng(3), tiles = []; for (let n = 0; n < 4; n++) { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"), im = g.createImageData(256, 256); for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 12; } g.putImageData(im, 0, 0); tiles.push(c); } return tiles; })();
const gctx = $("grain").getContext("2d");

// ---------- helpers ----------
function show(el, html, st, a) { if (html != null && el._h !== html) { el.innerHTML = html; el._h = html; } Object.assign(el.style, st); el.style.opacity = a; }
const slam = (t, t0) => { const k = spring(t - t0, 17, .55); return { s: lerp(1.6, 1, k), a: clamp((t - t0) / .08), y: (1 - k) * 60 }; };
const shakeAt = t => { let s = 0; for (const c of [...IMPACTS, HIT1]) { const d = t - c; if (d >= 0 && d < .45) s += Math.exp(-d * 9) * (c === HIT2 ? 22 : 14) * Math.sin(d * 70); } return s; };
const zoomPunch = t => { let z = 0; for (const c of [PROMPT, ...QUIZ.map(q => q + 2.6), HIT2, 30.0]) { const d = t - c; if (d >= 0 && d < .6) z += .045 * Math.exp(-d * 7); } return z; };
function dartPath(t, t0, p0, p1) {
  const k = clamp((t - t0) / .5), c = [(p0[0] + p1[0]) / 2, Math.min(p0[1], p1[1]) - 260];
  const P = u => [(1 - u) ** 2 * p0[0] + 2 * (1 - u) * u * c[0] + u * u * p1[0], (1 - u) ** 2 * p0[1] + 2 * (1 - u) * u * c[1] + u * u * p1[1]];
  const a = P(k), b = P(Math.min(1, k + .02)), b0 = P(Math.max(0, k - .02));
  const ang = Math.atan2(b[1] - b0[1], b[0] - b0[0]) * 180 / Math.PI;
  return { x: a[0], y: a[1], ang, done: k >= 1 };
}

// ---------- seek ----------
function seek(t) {
  t = clamp(t, 0, VIDEO.duration - 1e-6);
  drawBg(t);
  const sh = shakeAt(t), z = zoomPunch(t);
  let whipX = 0; for (const w of WHIPS) { const d = t - w; if (d > -.12 && d < .12) whipX += Math.sign(-d || 1) * (1 - Math.abs(d) / .12) * 140; }
  $("cam").style.transform = `translate(${(sh + whipX).toFixed(1)}px,${(sh * .4).toFixed(1)}px) scale(${(1 + z).toFixed(4)})`;
  let fl = 0; for (const c of [HIT2, 37.2]) { const d = t - c; if (d >= 0 && d < .35) fl = Math.max(fl, .55 * Math.exp(-d * 12)); }
  $("flash").style.opacity = fl.toFixed(3);
  for (const e of [H1, H2, H3, CAP, POP, LOGO, LOGOT, LOGOF, COPY]) { e.style.opacity = 0; e.style.transform = "none"; e.style.textShadow = "none"; }

  // host placement
  let hx = 230, hy = 1560, hs = 1.0, ha = 1;
  if (t >= 3 && t < PROMPT) { hx = 540; hy = 1450; hs = 1.15; }
  else if (t >= PROMPT && t < RES) { hx = 170; hy = 1600; hs = .82; }
  else if (t >= RES && t < RULE) { hx = 180; hy = 1610; hs = .9; }
  else if (t >= RULE) { hx = 540; hy = 1560; hs = 1.0; }
  if (t >= OUT) ha = 1 - seg(t, OUT, OUT + .3);
  const H = drawHost(t, hx, hy, hs, ha);

  // dartboard (hook at y=950, result at y=900)
  const boardOn = t < 3.0 || (t >= RES && t < RULE);
  if (boardOn) {
    const inK = t < 3 ? spring(t, 12, .6) : spring(t - RES, 12, .6), outK = t < 3 ? seg(t, 2.8, 3.0) : seg(t, RULE - .3, RULE);
    const cy = t < 3 ? 950 : 900, sc = lerp(.3, 1, inK) * (1 - outK * .6);
    boardG.setAttribute("opacity", clamp(inK * 3) * (1 - outK)); boardG.setAttribute("transform", `translate(640 ${cy}) scale(${sc.toFixed(3)})`);
  } else boardG.setAttribute("opacity", 0);
  // throw 1: misses
  if (t >= THROW1 && t < 3.0) {
    const d = dartPath(t, THROW1, [hx + 118, hy - 168], [930, 1250]);
    dart1G.setAttribute("opacity", 1 - seg(t, 2.8, 3.0)); dart1G.setAttribute("transform", `translate(${d.x} ${d.y}) rotate(${d.done ? 28 + Math.sin((t - HIT1) * 40) * 6 * Math.exp(-(t - HIT1) * 6) : d.ang})`);
  } else dart1G.setAttribute("opacity", 0);
  if (t >= HIT1 && t < 3.0) { const s = slam(t, HIT1 + .02); show(POP, "برّه!", { left: "720px", top: "1300px", fontSize: "80px", color: R, transform: `scale(${s.s}) rotate(-8deg)` }, s.a * (1 - seg(t, 2.8, 3.0))); }
  // throw 2: bullseye
  if (t >= THROW2 && t < RULE) {
    const d = dartPath(t, THROW2, [hx + 118, hy - 168], [640, 900]);
    dartG.setAttribute("opacity", 1 - seg(t, RULE - .3, RULE));
    dartG.setAttribute("transform", `translate(${d.x} ${d.y}) rotate(${d.done ? 22 + Math.sin((t - HIT2) * 45) * 8 * Math.exp(-(t - HIT2) * 5) : d.ang})`);
  } else dartG.setAttribute("opacity", 0);
  pulses.forEach((c, i) => { const d = t - HIT2 - i * .18; if (d < 0 || d > 1.1) { c.setAttribute("opacity", 0); return; } c.setAttribute("cx", 640); c.setAttribute("cy", 900); c.setAttribute("r", 30 + d * 420); c.setAttribute("opacity", (1 - d / 1.1) * .8); });
  conf.forEach((c, i) => { const d = t - HIT2, e = confE[i]; if (d < 0 || d > 2.4) { e.setAttribute("opacity", 0); return; } const x = 640 + Math.cos(c.ang) * c.sp * d, y = 900 + Math.sin(c.ang) * c.sp * d + 520 * d * d; e.setAttribute("x", x); e.setAttribute("y", y); e.setAttribute("transform", `rotate(${(c.spin * d * 57).toFixed(1)} ${x} ${y})`); e.setAttribute("opacity", 1 - d / 2.4); });

  // S0 HOOK
  if (t < 3.05) {
    const a = 1 - seg(t, 2.85, 3.0);
    const s1 = slam(t, .15), s2 = slam(t, .9);
    show(H1, "طلبت حاجة كبيرة…", { top: "300px", fontSize: "84px", color: "#C9C9D4", transform: `translateY(${s1.y}px)` }, s1.a * a);
    show(H2, 'و Claude <span class="hr">خمّن</span>؟', { top: "445px", fontSize: "94px", color: W, transform: `scale(${s2.s})` }, s2.a * a);
  }
  // S1 TWIST
  if (t >= 3 && t < PROMPT + .05) {
    const a = 1 - seg(t, PROMPT - .2, PROMPT);
    const s1 = slam(t, 3.1), s2 = slam(t, 4.1);
    show(H1, "بدل ما يخمّن…", { top: "420px", fontSize: "84px", color: "#C9C9D4", transform: `translateY(${s1.y}px)` }, s1.a * a);
    show(H2, 'خليه <span class="hl">يسألك الأول</span>', { top: "560px", fontSize: "104px", color: W, transform: `scale(${s2.s})`, textShadow: "0 10px 0 #E62E3A" }, s2.a * a);
  }
  // S2 PROMPT card
  const cmd = $("cmd");
  if (t >= PROMPT && t < QUIZ[0]) {
    const k = spring(t - PROMPT - .1, 13, .65), out = ease(seg(t, QUIZ[0] - .35, QUIZ[0]));
    cmd.style.opacity = clamp((t - PROMPT - .1) / .1) * (1 - out);
    cmd.style.transform = `translateY(${((1 - k) * 600 - out * 300).toFixed(0)}px) scale(${(1 - out * .2).toFixed(3)})`;
    $("cmd1").textContent = typed(T_C1, t);
    const c2 = typed(T_C2, t), done = t >= T_C2.t1 + .1;
    const html = done ? 'قبل ما تبدأ، <span class="hl k">اسألني 3 أسئلة</span> توضّح اللي محتاجه.' : c2 + (t >= T_C2.t0 ? '<span style="color:#FFD23F">|</span>' : "");
    if ($("cmd2")._h !== html) { $("cmd2").innerHTML = html; $("cmd2")._h = html; }
    const s = slam(t, PROMPT + .2);
    show(H1, "ضيف السطر ده لطلبك", { top: "300px", fontSize: "78px", color: W, transform: `translateY(${s.y}px)` }, s.a * (1 - out));
    if (t >= T_C2.t1 + .1) { const s2 = slam(t, T_C2.t1 + .15); show(CAP, "سطر واحد بيغيّر كل حاجة", { top: "1060px", left: "220px", fontSize: "56px", color: Y, transform: `scale(${s2.s})` }, s2.a * (1 - out)); }
  } else cmd.style.opacity = 0;
  if (!(t >= PROMPT && t < QUIZ[0]) && !(t >= HIT2 && t < RULE)) CAP.style.left = "";

  // S3 QUIZ cards
  let qh = "";
  QS.forEach(([q, ans], i) => {
    const t0 = QUIZ[i], end = t0 + 3.5;
    if (t >= t0 && t < end) {
      const k = spring(t - t0, 13, .6), col = ease(seg(t, end - .45, end));
      const ok = t >= t0 + 2.6, okk = spring(t - t0 - 2.6, 18, .5);
      const chipX = [760, 470, 160][i];
      const tx = lerp((1 - k) * 900, chipX - 330, col), ty = lerp(0, -260, col), sc = lerp(1, .3, col), rot = (1 - k) * 14;
      qh += `<div class="qc kr" style="top:470px;opacity:${(1 - col * .9).toFixed(3)};transform:translate(${tx.toFixed(0)}px,${ty.toFixed(0)}px) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(3)});border-color:${ok ? GOOD : Y}"><div class="qh"><span class="m">Claude</span><span class="k">سؤال ${i + 1} من 3</span></div><div class="qt k">${q}</div>${ok ? `<div style="position:absolute;left:34px;top:30px;width:76px;height:76px;border-radius:50%;background:${GOOD};color:#0B0B10;display:flex;align-items:center;justify-content:center;font-size:48px;transform:scale(${lerp(2, 1, okk).toFixed(3)})" class="k">✓</div>` : ""}</div>`;
      if (t >= t0 + 1.0) {
        const a = eOut(seg(t, t0 + 1.0, t0 + 1.25)) * (1 - col);
        qh += `<div class="ans kr" style="top:${790 + (1 - a) * 40}px;opacity:${a.toFixed(3)}">${typed(T_A[i], t)}${t < T_A[i].t1 ? '<span style="color:#E62E3A">|</span>' : ""}</div>`;
      }
    }
  });
  if ($("qs")._h !== qh) { $("qs").innerHTML = qh; $("qs")._h = qh; }
  // answered chips stay on top through the result
  CHIPS.forEach((c, i) => {
    const t0 = QUIZ[i] + 3.45;
    if (t < t0 || t >= RULE) { c.style.opacity = 0; return; }
    const k = spring(t - t0, 16, .55);
    c.style.right = ["60px", "", ""][i]; c.style.left = ["", "50%", "60px"][i];
    c.style.transform = `${i === 1 ? "translateX(-50%) " : ""}scale(${lerp(.4, 1, k).toFixed(3)})`;
    c.style.opacity = clamp((t - t0) / .08) * (1 - seg(t, RULE - .3, RULE));
  });
  if (t >= QUIZ[0] && t < RES) {
    const s = slam(t, QUIZ[0] + .1);
    show(H1, "و Claude بيسألك…", { top: "330px", fontSize: "60px", color: "#C9C9D4", transform: `translateY(${s.y}px)` }, s.a * (1 - seg(t, QUIZ[1] - .2, QUIZ[1])));
  }

  // S4 RESULT
  if (t >= HIT2 && t < RULE) {
    const a = 1 - seg(t, RULE - .3, RULE);
    const s = slam(t, HIT2 + .15);
    show(H1, 'إجابة <span class="hl">على مقاسك</span>', { top: "1170px", fontSize: "86px", color: W, transform: `scale(${s.s})` }, s.a * a);
    const s2 = slam(t, 25.6);
    show(CAP, "3 أسئلة… وفّروا عليك لفّ كتير", { top: "1300px", left: "290px", fontSize: "42px", color: "#C9C9D4", transform: `translateY(${s2.y}px)` }, s2.a * a);
  }
  // S5 RULE
  if (t >= RULE && t < OUT) {
    const a = 1 - seg(t, OUT - .25, OUT);
    const s1 = slam(t, 29.2), s2 = slam(t, 30.0), s3 = slam(t, 31.2);
    show(H2, "طلب كبير؟", { top: "420px", fontSize: "110px", color: W, transform: `scale(${s1.s})` }, s1.a * a);
    show(H3, '<span class="hl">خليه يسأل الأول</span>', { top: "600px", fontSize: "110px", color: W, transform: `scale(${s2.s})`, textShadow: "0 10px 0 #E62E3A" }, s2.a * a);
    show(COPY, '<div style="display:inline-block;border-radius:26px;background:#15151C;border:3px dashed #FFD23F;padding:18px 36px;font-size:44px;color:#fff">«قبل ما تبدأ، اسألني 3 أسئلة»</div><div class="k" style="margin-top:22px;font-size:38px;color:#FFD23F">انسخها وجرّبها</div>', { top: "860px", transform: `translateY(${s3.y}px)` }, s3.a * a);
  }

  // OUTRO
  if (t >= OUT) {
    const s = slam(t, 33.2);
    show(LOGO, "تكة", { top: "560px", fontSize: "300px", color: W, transform: `scale(${s.s})`, textShadow: "0 12px 0 #E62E3A" }, s.a);
    logoG.setAttribute("opacity", clamp((t - 33.8) / .2));
    const on = eOut(seg(t, 34.4, 34.6));
    logoG.querySelector("#lgKnob").setAttribute("cx", 430 + on * 220);
    logoG.querySelector("#lgTrack").setAttribute("fill", on > .5 ? "url(#trk)" : "#34343F");
    const kx = 560, ky = 610, lit = on;
    logoSpark.setAttribute("opacity", s.a);
    logoSpark.innerHTML = `<circle cx="${kx}" cy="${ky}" r="${120 * lit}" fill="url(#lg)"/>` +
      [-150, -120, -90, -60, -30].map(a => { const r = a * Math.PI / 180; return `<line x1="${kx + Math.cos(r) * 70}" y1="${ky + Math.sin(r) * 70}" x2="${kx + Math.cos(r) * (70 + 34 * lit)}" y2="${ky + Math.sin(r) * (70 + 34 * lit)}" stroke="#FFD23F" stroke-width="12" stroke-linecap="round" opacity="${lit}"/>`; }).join("") +
      `<g stroke="${lit > .5 ? "#FFD23F" : "#fff"}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M${kx - 50},${ky - 22} Q${kx - 43},${ky + 20} ${kx - 19},${ky + 24} L${kx},${ky + 6} L${kx + 19},${ky + 24} Q${kx + 43},${ky + 20} ${kx + 50},${ky - 22}"/><path d="M${kx},${ky + 6} L${kx},${ky + 40}"/></g><circle cx="${kx}" cy="${ky - 20}" r="18" fill="${lit > .5 ? "#FFD23F" : "#fff"}"/>`;
    const s2 = slam(t, 34.8);
    show(LOGOT, "كل حاجة ليها تكّة", { top: "1250px", fontSize: "70px", color: Y, transform: `translateY(${s2.y}px)` }, s2.a);
    const s3 = slam(t, 35.7);
    show(LOGOF, 'تابع عشان <span class="hl">التكّة الجاية</span>', { top: "1360px", fontSize: "56px", color: W, transform: `translateY(${s3.y}px)` }, s3.a * (1 - seg(t, 37.1, 37.5)));
  } else { logoG.setAttribute("opacity", 0); logoSpark.setAttribute("opacity", 0); }

  gctx.clearRect(0, 0, 1080, 1920);
  const tile = grain[Math.floor(t * 24) % 4];
  for (let y = 0; y < 1920; y += 256) for (let x = 0; x < 1080; x += 256) gctx.drawImage(tile, x, y);
}
window.seek = seek;

// ---------- sound (no narration: music + effects carry the video) ----------
window.buildAudio = async function (ctx) {
  const sr = ctx.sampleRate, BEAT = 60 / 112;
  const master = ctx.createGain(); master.gain.value = .8;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  master.connect(comp); comp.connect(ctx.destination);
  const nb = ctx.createBuffer(1, sr * 2, sr); { const r = rng(23), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; }
  const env = (g, t0, a, peak, dec) => { g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(.0001, t0 + a + dec); };
  const osc = (type, f, t0, dur, peak, a = .004, fEnd, dest = master) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0); if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t0 + dur); env(g, t0, a, peak, dur); o.connect(g); g.connect(dest); o.start(t0); o.stop(t0 + a + dur + .05); };
  const noise = (t0, dur, peak, type, f0, f1, q = 1, a = .004, dest = master) => { const s = ctx.createBufferSource(), b = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = nb; b.type = type; b.Q.value = q; b.frequency.setValueAtTime(f0, t0); if (f1) b.frequency.exponentialRampToValueAtTime(f1, t0 + dur); env(g, t0, a, peak, dur); s.connect(b); b.connect(g); g.connect(dest); s.start(t0, (t0 * 7.3) % 1); s.stop(t0 + a + dur + .05); };
  const kick = (t0, v = .8) => osc("sine", 145, t0, .3, v, .002, 42);
  const clap = (t0, v = .2) => { noise(t0, .13, v, "bandpass", 1500, null, 1.2); noise(t0 + .012, .09, v * .6, "bandpass", 2300, null, 1.5); };
  const hat = (t0, v = .04) => noise(t0, .03, v, "highpass", 8800);
  const whoosh = (t0, d = .45, v = .22) => noise(t0 - d * .7, d, v, "bandpass", 300, 5200, 2, d * .6);
  const impact = (t0, v = .8) => { osc("sine", 92, t0, .85, v, .003, 28); noise(t0, .45, .3, "lowpass", 3000, 200, .7); };
  const riser = (t0, t1, v = .18) => noise(t0, t1 - t0, v, "bandpass", 200, 6500, 3, (t1 - t0) * .9);
  const tick = (t0, v = .07) => { noise(t0, .02, v, "highpass", 3000); osc("square", 1700 + (t0 * 977 % 450), t0, .015, v * .4); };
  const clock = (t0, hi) => { noise(t0, .03, .12, "bandpass", hi ? 3200 : 2400, null, 8); };
  const thunk = (t0, v = .6) => { osc("sine", 210, t0, .14, v, .002, 70); noise(t0, .06, .3, "lowpass", 2500); };
  const wobble = t0 => { for (let i = 0; i < 6; i++) osc("triangle", 160 + (i % 2) * 18, t0 + i * .05, .05, .08 * (1 - i / 6), .002); };
  const buzz = t0 => { osc("square", 110, t0, .32, .16, .005); osc("square", 116, t0, .32, .12, .005); };
  const chime = (t0, b = 0) => { osc("sine", 1046.5 * 2 ** (b / 12), t0, .5, .18, .003); osc("sine", 1568 * 2 ** (b / 12), t0 + .08, .55, .14, .003); };
  const ding = t0 => { osc("sine", 1318.5, t0, 1.4, .22, .003); osc("sine", 1975.5, t0 + .09, 1.2, .16, .003); };
  const pop = (t0, f = 900, v = .18) => osc("sine", f, t0, .08, v, .002, f * 1.8);
  const click = t0 => { noise(t0, .012, .5, "highpass", 2500); osc("square", 2600, t0, .01, .25); osc("sine", 180, t0 + .01, .09, .5, .002, 90); noise(t0 + .06, .01, .3, "highpass", 4000); };

  for (const t0 of TYPING) tick(t0);
  // hook: tense low drone + heartbeat, nothing else, so the miss lands
  osc("sawtooth", 55, 0, 2.9, .05, .4); [0, .55, 1.1].forEach(x => { kick(x, .5); kick(x + .18, .35); });
  // main groove from the twist; quiz has a ticking clock; drop at the bullseye
  for (let n = 0, t0 = 3.0; t0 < OUT; n++, t0 += BEAT) {
    const quiz = t0 >= QUIZ[0] && t0 < RES;
    kick(t0, quiz ? .55 : .75);
    if (n % 2 === 1) clap(t0, quiz ? .14 : .2);
    if (t0 >= PROMPT) hat(t0 + BEAT / 2, quiz ? .03 : .04);
    if (quiz) { clock(t0, n % 2 === 0); clock(t0 + BEAT / 2, n % 2 === 1); }
    if (t0 >= HIT2) { hat(t0 + BEAT / 4, .025); hat(t0 + BEAT * .75, .025); }
  }
  // C – G – Am – F, playful pluck melody after the bullseye
  const roots = [65.41, 49.0, 55.0, 43.65], chords = [[261.6, 329.6, 392], [246.9, 293.7, 392], [220, 261.6, 329.6], [220, 261.6, 349.2]];
  const pad = ctx.createBiquadFilter(); pad.type = "lowpass"; pad.frequency.value = 1400; const pg = ctx.createGain(); pg.gain.value = .5; pad.connect(pg); pg.connect(master);
  const mel = [0, 4, 7, 12, 7, 4, 9, 7];
  for (let bar = 0, t0 = 3.0; t0 < 37.6; bar++, t0 += BEAT * 4) {
    const r = roots[bar % 4];
    osc("sine", r, t0, BEAT * 4 - .05, .26, .02);
    if (t0 < OUT) for (let b = 0; b < 4; b++) osc("square", r * 2, t0 + b * BEAT, .22, .035, .01);
    for (const f of chords[bar % 4]) osc("sawtooth", f, t0, BEAT * 4 - .02, .02, .25, null, pad);
    if (t0 >= HIT2 - .5 && t0 < OUT) mel.forEach((s, j) => osc("triangle", chords[bar % 4][0] * 2 * 2 ** (s / 12), t0 + j * BEAT / 2, .18, .05, .003));
  }
  for (const w of WHIPS) whoosh(w);
  for (const i of IMPACTS) impact(i);
  // throw 1 (miss), throw 2 (bullseye)
  whoosh(THROW1 + .35, .5, .25); thunk(HIT1, .45); wobble(HIT1 + .02); buzz(HIT1 + .15);
  pop(3.5, 500); whoosh(3.7, .4, .15);
  riser(21.2, RES, .12); riser(22.4, THROW2, .1); whoosh(THROW2 + .35, .5, .28); thunk(HIT2, .8); wobble(HIT2 + .02); ding(HIT2 + .05); for (let i = 0; i < 6; i++) pop(HIT2 + .1 + i * .07, 1200 + i * 160);
  QUIZ.forEach((q, i) => { whoosh(q + .1, .35, .18); pop(q + 1.0, 760); chime(q + 2.6, i * 2); pop(q + 3.45, 1100 + i * 120); });
  pop(T_C2.t1 + .15, 980);
  pop(29.2, 600); pop(30.0, 900); pop(31.2, 1200);
  click(34.4); riser(36.1, 37.2, .1); click(37.2);
};

// ---------- preview controls ----------
const isRender = location.search.includes("render");
if (!isRender) {
  const fit = () => { const s = Math.min(innerWidth / 1080, innerHeight / 1920); $("stage").style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  async function play() { ac ??= new AudioContext(); if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * VIDEO.duration), 48000); await buildAudio(off); buf = await off.startRendering(); } src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(0, offset % VIDEO.duration); startAt = ac.currentTime; playing = true; }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; }
  const now = () => playing ? (offset + ac.currentTime - startAt) % VIDEO.duration : offset;
  $("ui").innerHTML = `<button id=pp>play/pause</button> <input id=sc type=range min=0 max=${VIDEO.duration} step=0.01 style="width:300px">`;
  $("pp").onclick = () => playing ? pause() : play();
  $("sc").oninput = e => { const was = playing; pause(); offset = +e.target.value; if (was) play(); };
  (function loop() { const t = now(); seek(t); if (!$("sc").matches(":active")) $("sc").value = t; requestAnimationFrame(loop); })();
} else seek(0);
</script>
