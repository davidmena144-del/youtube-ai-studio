name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes the zero-spend guard (tests/cost-guard.test.ts) and every SQL function test,
      # run against real Postgres compiled to WASM (PGlite) with all migrations applied.
      - run: npm test
      # Real Postgres 16 with a NON-superuser owner that has CREATEROLE (like Neon's owner role).
      # The e2e applies migrations twice (idempotent), then drives the CLI and worker through the
      # production driver path (drizzle neon-http) via a local HTTP stand-in, as the
      # least-privilege roles. It does not prove Neon itself; see docs/PHASE1-STATUS.md.
      - name: Postgres 16 e2e over the neon-http driver path + schema drift check
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER ci WITH PASSWORD 'ci' CREATEROLE;" -c "CREATE DATABASE ci OWNER ci;"
          OWNER_URL=postgres://ci:ci@localhost:5432/ci bash tests/e2e/neon-http.sh
          DATABASE_URL=postgres://ci:ci@localhost:5432/ci npx drizzle-kit check
      - name: CLI smoke
        run: DATABASE_URL=postgres://unused npm run studio -- help | grep -q "studio <command>"
      - run: npm audit --omit=dev --audit-level=high

  media:
    # Real render of both formats through the full free pipeline (espeak TTS for speed in CI;
    # production uses the TTS engine chosen in Phase 2). Fails unless media QA passes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: bash scripts/install-media.sh espeak
      - name: Render Short + long-form, QA must pass
        working-directory: media
        run: |
          for f in short_sleep long_house_of_wisdom; do
            TTS_ENGINE=espeak ../.venv-media/bin/python -m studio_media.produce --spec fixtures/$f.json --out ../render/$f
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-renders
          path: |
            render/*/video.mp4
            render/*/thumbnail.jpg
            render/*/manifest.json
          retention-days: 3
