name: YouTube daily Short

# Owner-approved: publishes ONE Short per day (PUBLIC) from media/motion/queue.json — the first page not
# yet on the channel. Render (Chromium + ffmpeg) → media QA → upload → verify. No narration, no paid
# services. Idempotent: a page is never uploaded twice (ys:test:<page> marker). Quota: ~1,630 units/day.

on:
  schedule:
    - cron: "23 17 * * *" # 19:23 Africa/Cairo
  workflow_dispatch:

concurrency:
  group: youtube-daily-short
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts # no dependency lifecycle scripts in jobs that hold secrets
      - name: Pick today's Short
        id: pick
        run: node --import tsx scripts/next-short.ts
      - name: Renderer (Chromium via Playwright, ffmpeg, fonts)
        if: steps.pick.outputs.page != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-noto-core fonts-lemonada fonts-dejavu-core
          sudo apt-get install -y -q --no-install-recommends fonts-dejavu-mono || true
          npm i --no-save --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Render
        if: steps.pick.outputs.page != ''
        working-directory: media/motion
        env:
          PAGE: ${{ steps.pick.outputs.page }}
        run: |
          node build.mjs "$PAGE.html" "/tmp/$PAGE.built.html"
          cp render.mjs /tmp/render.mjs && ln -sfn "$GITHUB_WORKSPACE/node_modules" /tmp/node_modules
          cd /tmp && OUTPUT_SCALE=1.3333333333 node render.mjs "$PAGE.built.html" "$PAGE.mp4" 30 4 "$(nproc)" # 1440x2560 upload: YouTube serves sharper streams above 1080p
      - name: Media QA
        if: steps.pick.outputs.page != ''
        env:
          PAGE: ${{ steps.pick.outputs.page }}
        run: python3 media/motion/qa.py "/tmp/$PAGE.mp4" render "$(python3 -c "import json;print(json.load(open('media/motion/$PAGE.seo.json'))['title'])")"
      - name: Publish (public) and verify
        if: steps.pick.outputs.page != ''
        env:
          PAGE: ${{ steps.pick.outputs.page }}
          UPLOAD_PRIVACY: public
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: node --import tsx scripts/youtube-test-upload.ts render "media/motion/$PAGE.seo.json" "ys:test:${PAGE//_/-}"
      # A 1080p copy goes to a public bucket so Buffer can post the same Short to TikTok. Never fails the run.
      - name: Copy for TikTok (public bucket)
        if: steps.pick.outputs.page != ''
        continue-on-error: true
        env:
          PAGE: ${{ steps.pick.outputs.page }}
          SUPABASE_URL: https://tzmvrhixsymehvoffzvl.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_GaoM45Ni-k1jBRY7pWdiOg_CVMDO3ap # publishable by design, not a secret
        run: |
          ffmpeg -v error -y -i "/tmp/$PAGE.mp4" -vf "scale=1080:1920:flags=lanczos" -c:v libx264 -preset medium -crf 23 -maxrate 6M -bufsize 12M -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart "/tmp/$PAGE.tiktok.mp4"
          node --import tsx scripts/tiktok-upload.ts "/tmp/$PAGE.tiktok.mp4" "$PAGE"
      - uses: actions/upload-artifact@v4
        if: always() && steps.pick.outputs.page != ''
        with:
          name: daily-short
          path: |
            render/video.mp4
            render/manifest.json
          retention-days: 7
