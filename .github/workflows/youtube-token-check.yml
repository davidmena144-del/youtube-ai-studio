name: YouTube token check

# Daily check of the YouTube OAuth refresh token (Google OAuth app in "Testing": tokens expire 7 days
# after consent). Exchanges the token at Google's token endpoint only: no YouTube quota, no upload,
# no publishing, does not depend on WORKER_ENABLED. The run FAILS (and GitHub notifies the owner)
# from 2 days before the estimated expiry or when Google rejects the token. Fix: docs/YOUTUBE-REAUTH.md.
# Cost: about 1 free Actions minute per day.

on:
  schedule:
    - cron: "41 5 * * *" # 07:41 Africa/Cairo
  workflow_dispatch:
    inputs:
      issued_at:
        description: "Optional: when you created the current refresh token (UTC, e.g. 2026-11-16T12:40:00Z). Leave empty to keep the recorded time."
        required: false
        default: ""

concurrency:
  group: youtube-token-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts # no dependency lifecycle scripts in jobs that hold secrets
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      - name: Check the refresh token
        run: node --import tsx scripts/youtube-token-check.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_TOKEN_ISSUED_AT: ${{ inputs.issued_at }}
          YT_OAUTH_APP_STATUS: ${{ vars.YT_OAUTH_APP_STATUS || 'testing' }}
