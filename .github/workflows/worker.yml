name: Worker

# Media/system worker: claims media and system jobs from Neon and runs them, then exits.
# Phase 1: only the built-in system.noop handler exists (smoke test). Media handlers arrive in
# Phase 4. The worker never calls a paid API; Claude work happens in Claude Code scheduled tasks.
#
# Requirements:
#  1. This file must be on the default branch for schedules/manual runs to work.
#  2. Repository variable WORKER_ENABLED=true (the job is skipped otherwise).
#  3. Secrets: DATABASE_URL (app_worker role), MIGRATION_DATABASE_URL (direct connection, migrator).
#
# Cost: private repo → draws from the free $12/month included compute; with no payment method on
# the GitHub account, usage is blocked (never billed) once that allowance is used.

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */3 * * *"

concurrency:
  group: worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    if: vars.WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # No secrets in this step's environment (install scripts cannot read them).
      - run: npm ci --omit=dev

      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      - name: Process media/system jobs
        run: npm run worker:once
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WORKER_TIME_BUDGET_MS: "1500000"
          WORKER_MIN_REMAINING_MS: "720000"
