name: Worker

# Media/system worker: renders approved projects (free TTS + FFmpeg), runs media QA, uploads to
# YouTube through the publish gate, and pulls analytics. Started on demand by the manager right
# after it hands over a project (workflow_dispatch), plus a 6-hourly fallback schedule.
#
# Free-tier economy: a cheap check runs first; the media toolchain is only installed when there is
# due work. Minutes are recorded in the database and runs stop at the policy budget
# (gha_monthly_minutes_budget, default 1700 of the free 2000/month for private repos).
#
# Requirements: this file on the default branch; repository variable WORKER_ENABLED=true;
# secrets DATABASE_URL, MIGRATION_DATABASE_URL, ENCRYPTION_KEY, YT_CLIENT_ID, YT_CLIENT_SECRET;
# optional variable TTS_ENGINE (default silma).

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

concurrency:
  group: worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  work:
    if: vars.WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev

      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      - name: Anything to do?
        id: check
        run: npm run --silent worker:once -- --check | tee check.txt && grep -o "pending=[0-9]*" check.txt >> "$GITHUB_OUTPUT"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: actions/setup-python@v6
        if: steps.check.outputs.pending != '0'
        with:
          python-version: "3.11"
          cache: pip
      - name: Model cache
        if: steps.check.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ vars.TTS_ENGINE || 'silma' }}-v1
      - name: Install media toolchain
        if: steps.check.outputs.pending != '0'
        run: |
          start=$(date +%s)
          bash scripts/install-media.sh "${{ vars.TTS_ENGINE || 'silma' }}"
          echo "WORKER_SETUP_MINUTES=$(( ( $(date +%s) - start ) / 60 + 1 ))" >> "$GITHUB_ENV"

      - name: Process jobs
        if: steps.check.outputs.pending != '0'
        run: npm run worker:once
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MEDIA_PYTHON: ${{ github.workspace }}/.venv-media/bin/python
          MEDIA_PHOTOS: "1"
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'silma' }}
          WORKER_TIME_BUDGET_MS: "3000000"
          WORKER_MIN_REMAINING_MS: "900000"
