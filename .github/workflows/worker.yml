name: Worker

# Free cloud worker: drains the job queue, then exits.
#
# Requirements:
#  1. This file must be on the repository's DEFAULT branch (main): GitHub only runs scheduled
#     and manually-dispatched workflows from there.
#  2. Repository variables (Settings → Secrets and variables → Actions → Variables):
#       WORKER_ENABLED = true            (the job is skipped otherwise)
#       LLM_PROVIDER   = anthropic|mock  (explicit — must match the web app's setting)
#  3. Repository secrets: DATABASE_URL (required), ANTHROPIC_API_KEY (if LLM_PROVIDER=anthropic),
#     ENCRYPTION_KEY (from phase 3). The worker does NOT need SESSION_SECRET or the admin password.
#
# Minutes: each run is billed at least 1 minute. Private repos get 2,000 free minutes/month;
# this schedule (every 2 hours ≈ 360 runs/month) leaves room for manual runs.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

concurrency:
  group: worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    if: vars.WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # No secrets are present in this step's environment (install scripts cannot read them).
      - run: npm ci --omit=dev

      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Process queued jobs
        run: npm run worker:once
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'mock' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          WORKER_TIME_BUDGET_MS: "1500000"
