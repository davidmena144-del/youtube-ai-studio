name: YouTube motion Short upload

# Owner-approved upload of ONE motion-graphics Short (no narration): renders media/motion/<page>.html
# deterministically with Chromium (Playwright) + ffmpeg, runs media QA, then uploads with the SEO in
# media/motion/<page>.seo.json. Privacy is the owner's explicit choice (default private), never a
# scheduled publishAt. Re-running never creates a duplicate: the description carries ys:test:<page>.

on:
  workflow_dispatch:
    inputs:
      page:
        description: "Motion page in media/motion (without .html)"
        default: "body24h"
      privacy:
        description: "Visibility of the uploaded video"
        type: choice
        options: [private, public]
        default: private

concurrency:
  group: youtube-motion-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PAGE: ${{ inputs.page || 'body24h' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate page name
        run: |
          [[ "$PAGE" =~ ^[a-z0-9_]{3,40}$ ]] || { echo "invalid page name"; exit 1; }
          test -f "media/motion/$PAGE.html" && test -f "media/motion/$PAGE.seo.json"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts # no dependency lifecycle scripts in jobs that hold secrets
      - name: Renderer (Chromium via Playwright, ffmpeg, fonts)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-noto-core fonts-lemonada fonts-dejavu-core
          sudo apt-get install -y -q --no-install-recommends fonts-dejavu-mono || true
          npm i --no-save --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Render (motion graphics + synthesised music and effects)
        working-directory: media/motion
        run: |
          node build.mjs "$PAGE.html" "/tmp/$PAGE.built.html"
          cp render.mjs /tmp/render.mjs && ln -sfn "$GITHUB_WORKSPACE/node_modules" /tmp/node_modules
          cd /tmp && OUTPUT_SCALE=1.3333333333 node render.mjs "$PAGE.built.html" "$PAGE.mp4" 30 4 "$(nproc)" # 1440x2560 upload: YouTube serves sharper streams above 1080p
      - name: Media QA
        run: python3 media/motion/qa.py "/tmp/$PAGE.mp4" render "$(python3 -c "import json,sys;print(json.load(open('media/motion/$PAGE.seo.json'))['title'])")"
      - name: Upload and verify
        run: node --import tsx scripts/youtube-test-upload.ts render "media/motion/$PAGE.seo.json" "ys:test:${PAGE//_/-}"
        env:
          UPLOAD_PRIVACY: ${{ inputs.privacy }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-render
          path: |
            render/video.mp4
            render/manifest.json
          retention-days: 7
