name: YouTube private test upload

# Owner-approved acceptance test: renders one fixture Short with the configured free TTS engine and
# uploads it as PRIVATE (the script cannot publish; no publishAt), with title/description/tags,
# thumbnail and Arabic captions, then reads it back and waits for processing.
# Re-running with the same fixture NEVER uploads a second video: the description carries a marker
# (ys:test:<fixture>) and the channel's uploads are checked first. Delete the test video in Studio if you like.

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: "Fixture name in media/fixtures (spec <name>.json; optional SEO <name>.seo.json)"
        default: "short_yawn"

concurrency:
  group: youtube-test-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIXTURE: ${{ inputs.fixture || 'short_yawn' }}
      ENGINE: ${{ vars.TTS_ENGINE || 'silma' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate fixture name
        run: |
          [[ "$FIXTURE" =~ ^[a-z0-9_]{3,40}$ ]] || { echo "invalid fixture name"; exit 1; }
          test -f "media/fixtures/$FIXTURE.json"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts # no dependency lifecycle scripts in jobs that hold secrets
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.ENGINE }}-v1
      - run: bash scripts/install-media.sh "$ENGINE"
      - name: Render the fixture Short (TTS, visuals, captions, thumbnail, media QA)
        working-directory: media
        run: TTS_ENGINE="$ENGINE" ../.venv-media/bin/python -m studio_media.produce --spec "fixtures/$FIXTURE.json" --out ../render --photos
      - name: Media QA result
        if: always()
        run: python3 -c "import json;m=json.load(open('render/manifest.json'));print('RENDER', json.dumps({k:m.get(k) for k in ('engine','timing_s','qa','attributions')}, ensure_ascii=False))"
      - name: Upload as PRIVATE and verify
        run: |
          SEO=""; [ -f "media/fixtures/$FIXTURE.seo.json" ] && SEO="media/fixtures/$FIXTURE.seo.json"
          node --import tsx scripts/youtube-test-upload.ts render "$SEO" "ys:test:${FIXTURE//_/-}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-render
          path: |
            render/video.mp4
            render/thumbnail.jpg
            render/manifest.json
            render/captions.srt
          retention-days: 7
